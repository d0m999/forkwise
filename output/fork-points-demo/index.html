<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>见岔 · 多岔点幽灵叠加（不同方向）</title>
<style>
  :root{
    --bg:#f6f6f3; --panel:#fff; --line:#dcdcd6; --text:#1b1b19; --muted:#8b8b80;
    --amber:#b45309; --blue:#1d4ed8; --violet:#6d28d9; --teal:#0f766e;
    --solid:#ffffff; --ghostbg:#fafaf7;
  }
  *{box-sizing:border-box;}
  body{margin:0;font:13px/1.5 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);}
  header{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);}
  .brand{font-weight:600;letter-spacing:.5px;}
  .brand span{color:var(--muted);font-weight:400;font-size:11px;margin-left:4px;}
  .uLabel{font-size:11px;color:var(--muted);}
  .ubtn{height:28px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);}
  .ubtn.on{background:var(--text);color:#fff;border-color:var(--text);}
  .ubtn:hover{border-color:#b5b5ad;}
  .sep{width:1px;height:22px;background:var(--line);}
  select{height:28px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;padding:0 6px;}
  .chip{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;font-size:12px;}
  .chip.on{background:#fdf6e9;border-color:var(--amber);color:var(--amber);}
  .main{display:flex;height:calc(100vh - 52px - 34px);}
  aside{width:250px;flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px;}
  aside h3{margin:0 0 4px;font-size:12px;}
  .hint{font-size:11px;color:var(--muted);margin:0 0 10px;}
  .fork-item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer;background:#fff;}
  .fork-item:hover{border-color:#b5b5ad;}
  .fork-item.active{border-color:var(--text);box-shadow:0 0 0 2px rgba(0,0,0,.06);}
  .fork-item .ft{font-size:12px;font-weight:600;}
  .fork-item .fs{font-size:11px;color:var(--muted);margin-top:2px;}
  .fork-item .fp{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;}
  .pill{font-size:10px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:var(--muted);background:#fafaf7;}
  .pill.on{color:#fff;border-color:transparent;}
  .pill.pB.on{background:var(--amber);} .pill.pC.on{background:var(--blue);} .pill.pD.on{background:var(--violet);} .pill.pA.on{background:var(--text);}
  #viewport{flex:1;position:relative;overflow:hidden;cursor:grab;}
  #viewport.drag{cursor:grabbing;}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;}
  #wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
  .card{position:absolute;width:236px;min-height:62px;border-radius:10px;border:1px solid var(--line);background:var(--solid);padding:9px 11px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .card .k{font-size:10px;color:var(--muted);letter-spacing:.4px;}
  .card .t{font-size:12.5px;margin-top:3px;}
  .card.preview{border-color:var(--text);box-shadow:0 0 0 2px rgba(0,0,0,.08);}
  .card.preview .k{color:var(--text);}
  .card.ghost{background:var(--ghostbg);border-style:dashed;box-shadow:none;opacity:.95;}
  .card.ghost .t{color:#4a4a44;}
  .card.gh-B{border-color:var(--amber);} .card.gh-B .k{color:var(--amber);}
  .card.gh-C{border-color:var(--blue);} .card.gh-C .k{color:var(--blue);}
  .card.gh-D{border-color:var(--violet);} .card.gh-D .k{color:var(--violet);}
  .card.flash{animation:fl .9s ease;}
  @keyframes fl{0%,100%{box-shadow:0 1px 2px rgba(0,0,0,.05);}30%{box-shadow:0 0 0 6px rgba(29,78,216,.28);}}
  .echo{position:absolute;width:236px;height:62px;border-radius:10px;border:1px dashed;background:transparent;opacity:.7;pointer-events:none;}
  .echo.e-B{border-color:var(--amber);} .echo.e-C{border-color:var(--blue);} .echo.e-D{border-color:var(--violet);}
  .badge{position:absolute;width:auto;min-width:26px;height:20px;padding:0 6px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:10.5px;line-height:18px;text-align:center;cursor:pointer;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .badge:hover{border-color:var(--text);}
  .badge.hot{border-color:var(--text);background:var(--text);color:#fff;}
  .note{position:absolute;font-size:10.5px;color:var(--muted);}
  #peek{position:fixed;right:0;top:52px;bottom:34px;width:320px;background:var(--panel);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .18s ease;padding:12px;overflow:auto;z-index:40;}
  #peek.open{transform:none;}
  .pk-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .pk-head b{font-size:12.5px;}
  .pk-close{cursor:pointer;color:var(--muted);border:none;background:none;font-size:16px;line-height:1;}
  .pk-card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;background:#fff;}
  .pk-card:hover{border-color:#b5b5ad;}
  .pk-card .t1{font-size:12px;} .pk-card .t2{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .pk-card.pk-fork{border-left:3px solid var(--text);}
  .pk-sec{font-size:10.5px;color:var(--muted);margin:10px 0 5px;letter-spacing:.4px;}
  .pk-btn{width:100%;height:30px;margin-top:8px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:12px;}
  .pk-btn.primary{background:var(--text);color:#fff;border-color:var(--text);}
  #pop{position:fixed;z-index:60;width:330px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.16);padding:10px;display:none;}
  #pop.open{display:block;}
  .vi{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:6px;cursor:pointer;}
  .vi:hover{border-color:#b5b5ad;}
  .vi.sel{border-color:var(--text);box-shadow:0 0 0 2px rgba(0,0,0,.06);}
  .vi .vh{font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;}
  .vi .vt{font-size:12px;margin-top:2px;}
  footer{height:34px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-top:1px solid var(--line);font-size:11px;color:var(--muted);}
  .lg{display:inline-flex;align-items:center;gap:5px;}
  .sw{width:14px;height:10px;border-radius:3px;border:1px solid var(--line);background:#fff;}
  .sw.dash{border-style:dashed;border-color:var(--amber);}
  .sw.gh{background:#fafaf7;border-color:var(--violet);}
  #toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%) translateY(14px);background:var(--text);color:#fff;padding:8px 14px;border-radius:16px;font-size:12px;opacity:0;transition:.2s;pointer-events:none;z-index:80;}
  #toast.show{opacity:1;transform:translateX(-50%);}
</style>
</head>
<body>
<header>
  <div class="brand">见岔 <span>Forkwise · 多岔点对照</span></div>
  <div class="sep"></div>
  <span class="uLabel">当前路径</span>
  <button class="ubtn" id="btnA" onclick="setU('A')">A · 原假设</button>
  <button class="ubtn" id="btnB" onclick="setU('B')">B · 资本开支</button>
  <button class="ubtn" id="btnC" onclick="setU('C')">C · 订单延后</button>
  <button class="ubtn" id="btnD" onclick="setU('D')">D · 库存性质</button>
  <div class="sep"></div>
  <span class="uLabel">对照方向</span>
  <select id="compSel" onchange="setComp(this.value)"></select>
  <div class="chip" id="ghostChip" onclick="toggleGhost()"><span id="chipTxt">对照层</span></div>
</header>

<div class="main">
  <aside>
    <h3>岔点 · 3 处</h3>
    <p class="hint">同一张图上有三个不同方向的岔出点。点一个岔点＝把对照切到那个方向并定位。</p>
    <div id="forkList"></div>
    <h3 style="margin-top:14px">汇合点</h3>
    <p class="hint">三个方向最终都改写了同一个结论，所以结论卡有 4 版。</p>
    <div id="convList"></div>
  </aside>
  <div id="viewport">
    <div id="world"><svg id="wires" width="1200" height="700"></svg></div>
  </div>
</div>

<div id="peek">
  <div class="pk-head"><b id="pkTitle">透视</b><button class="pk-close" onclick="closePeek()">×</button></div>
  <div id="pkBody"></div>
</div>

<div id="pop"></div>
<div id="toast"></div>

<footer>
  <span class="lg"><i class="sw"></i>实体＝当前路径</span>
  <span class="lg"><i class="sw dash"></i>虚线空框＝对照方向在此有另一版本（无文字）</span>
  <span class="lg"><i class="sw gh"></i>幽灵卡＝对照方向独有</span>
  <span class="lg"><i class="sw" style="border-color:var(--violet);border-width:2px"></i>高亮虚线＝该方向的影响传导链</span>
  <span class="lg">⇄ N 版＝此卡在几条路径中内容不同</span>
</footer>

<script>
/* ---------- 数据：沿用主原型 forkwise-research-prototype 的真实节点与文案 ---------- */
var NODES = {
  p1:{x:40,  y:30,  k:'前提 · 作者表达', t:'新增订单能够兑现为收入'},
  p2:{x:40,  y:250, k:'前提 · AI 推断',  t:'资本开支强度不持续上升'},
  p3:{x:40,  y:470, k:'前提 · 作者表达', t:'库存下降可能释放营运资金'},
  i1:{x:340, y:120, k:'联合推导 · AI 推断', t:'收入兑现与资本开支共同支持'},
  i2:{x:340, y:440, k:'独立推导 · 作者表达', t:'营运资金释放提供独立支持'},
  c1:{x:660, y:250, k:'结论 · 作者表达', t:'现金流可能改善'}
};
var EDGES = [['p1','i1'],['p2','i1'],['i1','c1'],['p3','i2'],['i2','c1']];

var PATHS = {
  A:{name:'路径 A · 原假设', fork:null, col:'#6b7280',
     cards:{}, extra:[],
     desc:'作者原链 + 个人草稿，未岔出'},
  B:{name:'路径 B · 若资本开支持续上升', fork:'p2', col:'#b45309',
     cards:{p2:'资本开支强度持续上升', i1:'收入增长与资金回收可能背离', c1:'现金流改善仍需进一步观察'},
     extra:[],
     desc:'主原型已保存的那条：拿掉「不持续上升」前提，沿 p2→i1→c1 传导'},
  C:{name:'路径 C · 若订单兑现延后', fork:'p1', col:'#1d4ed8',
     cards:{p1:'新增订单兑现时点可能延后', i1:'收入兑现不确定，联合支持待观察', c1:'现金流改善的时点后移'},
     extra:[{id:'Cx', after:'p1', t:'关注预收款与合同负债变化', k:'独有 · 本路径新增'}],
     desc:'另一个方向：从订单前提岔出，同样经 i1 汇到 c1'},
  D:{name:'路径 D · 若库存下降来自跌价', fork:'p3', col:'#6d28d9',
     cards:{p3:'库存下降可能来自跌价或转销', i2:'营运资金释放的证据不足', c1:'现金流改善仅剩单一路径支持'},
     extra:[{id:'Dy', after:'p3', t:'核对存货附注的跌价与转销明细', k:'独有 · 本路径新增'}],
     desc:'走另一条通道：从库存前提岔出，经 i2 这条独立推导汇到 c1'}
};
var ORDER = ['A','B','C','D'];
var PCOL = {B:'amber', C:'blue', D:'violet'};

var U='A', COMP='B', ghostOn=true, preview=null;   /* preview = {id, path} */
var CW=236, CH=62;

function textOf(id, p){ return PATHS[p].cards[id] || PATHS.A.cards[id] || NODES[id].t; }
function versionsOf(id){
  var r=[];
  for(var i=0;i<ORDER.length;i++){ var p=ORDER[i]; if(PATHS[p].cards[id]) r.push(p); }
  if(r.indexOf('A')<0) r.unshift('A');
  return r;
}
function isFork(id){ return versionsOf(id).length > 1; }
function forks(){ var r=[]; for(var k in NODES) if(isFork(k) && k!=='c1') r.push(k); return r; }
function downstream(start){
  var seen={}, stack=[start], out={};
  out[start]=1;
  while(stack.length){
    var n=stack.pop();
    for(var i=0;i<EDGES.length;i++){
      if(EDGES[i][0]===n && !out[EDGES[i][1]]){ out[EDGES[i][1]]=1; stack.push(EDGES[i][1]); }
    }
  }
  return out;
}
function ghostX(id){ return NODES[id].x; }
function ghostY(id){ return NODES[id].y; }

/* ---------- 渲染 ---------- */
function render(){
  var world=document.getElementById('world');
  world.querySelectorAll('.card,.badge,.echo,.note').forEach(function(n){ n.remove(); });

  var comp=COMP;
  var colKey=PCOL[comp] || 'teal';
  var col=PATHS[comp].col;

  /* 1) 连线 */
  var down = (comp && PATHS[comp].fork) ? downstream(PATHS[comp].fork) : {};
  var w='';
  EDGES.forEach(function(e){
    var a=NODES[e[0]], b=NODES[e[1]];
    var x1=a.x+CW, y1=a.y+CH/2, x2=b.x, y2=b.y+CH/2;
    var mx=(x1+x2)/2;
    var hot = ghostOn && down[e[0]] && down[e[1]];
    w += '<path d="M '+x1+' '+y1+' C '+mx+' '+y1+', '+mx+' '+y2+', '+x2+' '+y2+'" fill="none" stroke="'+(hot?col:'#c9c9c2')+'" stroke-width="'+(hot?2:1.2)+'" stroke-dasharray="'+(hot?'6 4':'')+'" marker-end="url(#m'+(hot?'Hot':'Gray')+')"/>';
  });
  /* 对照方向的独有卡：从锚点卡向下引虚线 */
  if(ghostOn){
    PATHS[comp].extra.forEach(function(x){
      var a=NODES[x.after];
      w += '<path d="M '+(a.x+CW/2)+' '+(a.y+CH)+' L '+(a.x+CW/2)+' '+(a.y+CH+18)+'" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#mHot)"/>';
    });
  }
  document.getElementById('wires').innerHTML =
    '<defs><marker id="mGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
    '<path d="M2 1L8 5L2 9" fill="none" stroke="#c9c9c2" stroke-width="1.5" stroke-linecap="round"/></marker>'+
    '<marker id="mHot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
    '<path d="M2 1L8 5L2 9" fill="none" stroke="'+col+'" stroke-width="1.8" stroke-linecap="round"/></marker></defs>' + w;

  /* 2) 实体卡 + 岔点徽标 */
  for(var id in NODES){
    var n=NODES[id];
    var isPrev = preview && preview.id===id;
    var txt = isPrev ? textOf(id, preview.path) : textOf(id, U);
    var d=document.createElement('div');
    d.className='card'+(isPrev?' preview':'');
    d.id=id;
    d.style.left=n.x+'px'; d.style.top=n.y+'px';
    d.innerHTML='<div class="k">'+(isPrev?('预览 · 路径 '+preview.path+' · 只读'):n.k)+'</div><div class="t">'+txt+'</div>';
    d.setAttribute('onclick','cardClick(\''+id+'\')');
    world.appendChild(d);

    /* 3) 幽灵：echo 轮廓（无文字） */
    if(ghostOn && comp!==U && PATHS[comp].cards[id] && PATHS[comp].cards[id]!==txt){
      var ec=document.createElement('div');
      ec.className='echo e-'+comp;
      ec.id=id+'-echo';
      ec.style.left=(n.x+13)+'px'; ec.style.top=(n.y+13)+'px';
      world.appendChild(ec);
    }

    /* 4) 徽标 ⇄ N 版 */
    var vs=versionsOf(id);
    if(vs.length>1){
      var b=document.createElement('div');
      b.className='badge'+(vs.indexOf(comp)>=0?' hot':'');
      b.id=id+'-badge';
      b.style.left=(n.x+CW-58)+'px'; b.style.top=(n.y-11)+'px';
      b.textContent='⇄ '+vs.length+' 版';
      b.setAttribute('onclick','openPop(\''+id+'\',event)');
      world.appendChild(b);
    }
  }

  /* 5) 幽灵独有卡 */
  if(ghostOn){
    PATHS[comp].extra.forEach(function(x){
      var a=NODES[x.after];
      var g=document.createElement('div');
      g.className='card ghost gh-'+comp;
      g.id=x.id;
      g.style.left=a.x+'px'; g.style.top=(a.y+CH+18)+'px';
      g.innerHTML='<div class="k">'+x.k+' · 路径 '+comp+'</div><div class="t">'+x.t+'</div>';
      g.setAttribute('onclick','peek()');
      world.appendChild(g);
    });
  }

  /* 6) 岔点清单 */
  var fl=document.getElementById('forkList'), html='';
  forks().forEach(function(f){
    var vs=versionsOf(f);
    var dirs='';
    vs.forEach(function(p){ dirs += '<span class="pill p'+p+(p===comp?' on':'')+'">'+p+' · '+PATHS[p].name.split('· ')[1]+'</span>'; });
    html += '<div class="fork-item'+(PATHS[comp].fork===f?' active':'')+'" onclick="gotoFork(\''+f+'\')">'+
            '<div class="ft">'+NODES[f].t+'</div>'+
            '<div class="fs">'+NODES[f].k+' · '+vs.length+' 版</div>'+
            '<div class="fp">'+dirs+'</div></div>';
  });
  fl.innerHTML=html;
  document.getElementById('convList').innerHTML =
    '<div class="fork-item" onclick="gotoFork(\'c1\')"><div class="ft">'+NODES.c1.t+'</div>'+
    '<div class="fs">结论 · '+versionsOf('c1').length+' 版（三个方向在此汇合）</div></div>';

  /* 7) 顶栏状态 */
  ORDER.forEach(function(p){ document.getElementById('btn'+p).classList.toggle('on', p===U); });
  var nRew=0; for(var k in PATHS[comp].cards) nRew++;
  document.getElementById('chipTxt').textContent =
    '对照层：路径 '+comp+' · '+nRew+' 处改写 + '+PATHS[comp].extra.length+' 张独有卡';
  document.getElementById('ghostChip').classList.toggle('on', ghostOn);
}

/* ---------- 交互 ---------- */
function setU(u){
  if(u===U) return;
  U=u; preview=null; closePeek(); closePop();
  if(COMP===u){ COMP = (u==='A')?'B':'A'; syncSel(); }
  render();
  toast('已切到 '+PATHS[u].name+'；对照方向：'+PATHS[COMP].name);
}
function setComp(c){ COMP=c; preview=null; render(); toast('对照方向切到 '+PATHS[c].name+' · '+PATHS[c].desc); }
function syncSel(){ document.getElementById('compSel').value=COMP; }
function toggleGhost(){ ghostOn=!ghostOn; render(); }
function gotoFork(f){
  /* 点岔点＝把对照切到那个方向（若该岔点不属于当前对照路径） */
  var vs=versionsOf(f), cands=vs.filter(function(p){ return p!==U && PATHS[p].cards[f]; });
  if(cands.length){
    var target = (cands.indexOf(COMP)>=0) ? COMP : cands[0];
    if(target!==COMP){ COMP=target; syncSel(); render(); }
  }
  flash(f);
  toast('岔点「'+NODES[f].t+'」· 当前对照方向：'+PATHS[COMP].name);
}
function cardClick(id){ if(isFork(id)) openPop(id, {target:document.getElementById(id)}); }
function flash(id){
  var n=document.getElementById(id);
  if(!n) return;
  n.scrollIntoView&&0; n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash');
}
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); },2600); }

/* 版本选择器 */
function openPop(id, ev){
  var pop=document.getElementById('pop');
  var vs=versionsOf(id);
  var h='<div style="font-size:11px;color:var(--muted);margin-bottom:6px">此卡在 '+vs.length+' 条路径中内容不同 · 点一版预览（只读）</div>';
  vs.forEach(function(p){
    var isCur = (p===U && !(preview&&preview.id===id));
    var sel = preview && preview.id===id && preview.path===p;
    h += '<div class="vi'+(sel?' sel':'')+'" onclick="previewVer(\''+id+'\',\''+p+'\')">'+
         '<div class="vh"><span>路径 '+p+' · '+PATHS[p].name.split('· ')[1]+'</span><span>'+(isCur?'当前':(sel?'预览中':''))+'</span></div>'+
         '<div class="vt">'+textOf(id,p)+'</div></div>';
  });
  h += '<div style="display:flex;gap:6px;margin-top:8px">'+
       '<button class="pk-btn" onclick="clearPreview()">翻回当前版</button>'+
       '<button class="pk-btn primary" onclick="adopt()">采用此版（演示）</button></div>';
  pop.innerHTML=h;
  pop.classList.add('open');
  var src = (ev && ev.target) ? ev.target : null;
  var x = src ? src.getBoundingClientRect().left : 400;
  var y = src ? src.getBoundingClientRect().bottom+6 : 120;
  pop.style.left=Math.min(x, window.innerWidth-350)+'px'; pop.style.top=y+'px';
}
function closePop(){ document.getElementById('pop').classList.remove('open'); }
function previewVer(id,p){ preview={id:id,path:p}; render(); openPop(id,null); toast('预览路径 '+p+' 版本 · 只读，不写入当前路径'); }
function clearPreview(){ preview=null; render(); closePop(); }
function adopt(){ toast('演示：采用会生成当前路径的局部版本并记录出处（ADR 0006），此处不写入'); }

/* 透视抽屉 */
function peek(){
  var comp=COMP, body=document.getElementById('pkBody');
  document.getElementById('pkTitle').textContent='透视「'+PATHS[comp].name+'」';
  var h='<div class="pk-sec">岔出点</div>';
  var f=PATHS[comp].fork;
  if(f){
    h+='<div class="pk-card pk-fork" onclick="flash(\''+f+'\')"><div class="t1">'+textOf(f,comp)+'</div>'+
       '<div class="t2">改写自：'+textOf(f,U)+'</div></div>';
  }
  h+='<div class="pk-sec">沿此方向传导的改写</div>';
  var n=0;
  for(var id in PATHS[comp].cards){ if(id===f) continue; n++;
    h+='<div class="pk-card" onclick="flash(\''+id+'\')"><div class="t1">'+PATHS[comp].cards[id]+'</div>'+
       '<div class="t2">'+NODES[id].k+' · 当前路径为：'+textOf(id,U)+'</div></div>';
  }
  if(!n) h+='<div class="t2" style="color:var(--muted)">（仅岔出点本身改写）</div>';
  if(PATHS[comp].extra.length){
    h+='<div class="pk-sec">本路径独有卡</div>';
    PATHS[comp].extra.forEach(function(x){
      h+='<div class="pk-card" onclick="flash(\''+x.id+'\')"><div class="t1">'+x.t+'</div><div class="t2">'+x.k+'</div></div>';
    });
  }
  h+='<div class="pk-sec">共享段（不重复渲染）</div>';
  var sh=[]; for(var id2 in NODES){ if(!PATHS[comp].cards[id2]) sh.push(NODES[id2].t); }
  h+='<div class="t2" style="color:var(--muted)">'+sh.join(' ／ ')+'</div>';
  h+='<button class="pk-btn primary" onclick="setU(\''+comp+'\')">切换到此路径工作</button>';
  body.innerHTML=h;
  document.getElementById('peek').classList.add('open');
}
function closePeek(){ document.getElementById('peek').classList.remove('open'); }

/* 平移 */
(function(){
  var vp=document.getElementById('viewport'), world=document.getElementById('world');
  var tx=0, ty=0, dragging=false, sx=0, sy=0;
  vp.addEventListener('mousedown', function(e){
    if(e.target.closest('.card')||e.target.closest('.badge')||e.target.closest('#pop')) return;
    dragging=true; sx=e.clientX; sy=e.clientY; vp.classList.add('drag'); closePop();
  });
  window.addEventListener('mousemove', function(e){
    if(!dragging) return;
    tx += e.clientX-sx; ty += e.clientY-sy; sx=e.clientX; sy=e.clientY;
    world.style.transform='translate('+tx+'px,'+ty+'px)';
  });
  window.addEventListener('mouseup', function(){ dragging=false; vp.classList.remove('drag'); });
})();

/* 初始化 */
(function(){
  var sel=document.getElementById('compSel'), h='';
  ['B','C','D'].forEach(function(p){ h+='<option value="'+p+'">'+p+' · '+PATHS[p].name.split('· ')[1]+'</option>'; });
  sel.innerHTML=h; sel.value='B';
  render();
  toast('同一张图上三个不同方向的岔点：p1 订单 / p2 资本开支 / p3 库存，都汇到 c1');
})();
</script>
