<div id="forkwise-card-chain" class="viz-dotted-background">
  <div class="fwc-preview-meta">模拟内容／研究卡设计预览</div>

      <div class="fwc-stance"><span>我的立场</span><span>待研究</span></div>

  </aside>
  <template data-content="revenue-source"><p class="fwc-meta">模拟观点材料，版本 1</p><blockquote>“本季营业收入已经回升。”</blockquote><dl><dt>业务期间</dt><dd>材料所指的本季，具体季度未提供</dd><dt>发布时间</dt><dd>未提供</dd><dt>原文位置</dt><dd>模拟材料第 1 句</dd></dl></template>
  <template data-content="cashflow-source"><p class="fwc-meta">模拟观点材料，版本 1</p><blockquote>“公司未来几个季度的自由现金流可能改善。”</blockquote><dl><dt>业务期间</dt><dd>未来几个季度，具体起止未提供</dd><dt>发布时间</dt><dd>未提供</dd><dt>原文位置</dt><dd>模拟材料第 2 句</dd></dl></template>
  <template data-content="revenue-check"><p class="fwc-meta">模拟查证结果／AI 候选意见</p><p>查证：有支持依据</p><blockquote>“本季营业收入较前季回升。”</blockquote><p>引用：模拟季度材料，版本 1。未提供数值及可比口径，仍需进一步核对。</p><p>我的立场：待研究。</p></template>

  <template data-content="revenue-detail"><p class="fwc-meta">作者表达／内容版本 1</p><p>本季营业收入已经回升。</p><dl><dt>我的立场</dt><dd>待研究</dd><dt>重建核对</dt><dd>待核对</dd><dt>查证</dt><dd>有支持依据；数值与可比口径仍需核对</dd></dl></template>
  <template data-content="cashflow-detail"><p class="fwc-meta">作者表达／内容版本 1</p><p>公司未来几个季度的自由现金流可能改善。</p><dl><dt>我的立场</dt><dd>待研究</dd><dt>重建核对</dt><dd>待核对</dd><dt>查证</dt><dd>证据不足；未来期间的回款数据缺失</dd></dl></template>
  <template data-content="inference-detail"><p class="fwc-meta">AI 推断／原文未明确表达</p><p>收入回升可能带来更多现金流入。</p><dl><dt>前提</dt><dd>本季营业收入已经回升</dd><dt>结论</dt><dd>公司未来几个季度的自由现金流可能改善</dd><dt>我的立场</dt><dd>待研究</dd><dt>查证摘要</dt><dd>收入确认与实际回款的时间关系仍需核验</dd><dt>来源</dt><dd>原文未明确表达；根据模拟观点材料补充的候选推导</dd></dl></template>
</div>
<style>
#forkwise-card-chain { position:relative; color-scheme:light dark; --fwc-paper:light-dark(#fff,#242a30); --fwc-text:light-dark(#24323b,#edf1f4); --fwc-muted:light-dark(#626e79,#b7c0ca); --fwc-edge:light-dark(#d5dde3,#48535e); --fwc-selection:light-dark(#276a63,#82c1b5); --fwc-line:light-dark(#9eacb5,#7e909b); --fwc-wash:light-dark(#f5f7f8,#2c343b); --fwc-radius:10px; --fwc-text-size:19px; --fwc-padding:20px; font-family:"PingFang SC","Hiragino Sans GB",sans-serif; color:var(--fwc-text); }
#forkwise-card-chain .fwc-preview-meta { padding:18px 20px 0; color:var(--fwc-muted); font-size:12px; }
#forkwise-card-chain .fwc-scene { display:grid; grid-template-columns:minmax(0,1fr) 145px minmax(0,1fr); align-items:center; padding:28px 20px 34px; }
#forkwise-card-chain .fwc-note { position:relative; min-width:0; box-sizing:border-box; padding:var(--fwc-padding); border:1px solid var(--fwc-edge); border-radius:var(--fwc-radius); background:var(--fwc-paper); }
#forkwise-card-chain .fwc-note.is-selected { border-color:var(--fwc-selection); box-shadow:0 0 0 1px var(--fwc-selection); }
#forkwise-card-chain .fwc-head { display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:12px; color:var(--fwc-muted); }
#forkwise-card-chain .fwc-statement { display:block; width:100%; padding:0; margin:20px 0 24px; border:0; background:transparent; color:var(--fwc-text); font:inherit; font-size:var(--fwc-text-size); font-weight:500; line-height:1.65; text-align:left; overflow-wrap:anywhere; }
#forkwise-card-chain .fwc-stance { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; font-size:12px; }
#forkwise-card-chain .fwc-stance span:first-child { color:var(--fwc-muted); }
#forkwise-card-chain .fwc-verification { display:flex; flex-direction:column; align-items:flex-start; gap:6px; width:100%; background:transparent; border:0; padding:0; color:var(--fwc-text); font:inherit; text-align:left; line-height:1.55; }
#forkwise-card-chain .fwc-check-name { font-size:12px; font-weight:500; }
#forkwise-card-chain .fwc-check-summary { font-size:13px; color:var(--fwc-muted); overflow-wrap:anywhere; }
#forkwise-card-chain .fwc-footer { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-top:16px; padding-top:12px; border-top:1px solid var(--fwc-edge); }
#forkwise-card-chain .fwc-action { display:inline-flex; align-items:center; gap:5px; padding:3px 0; border:0; background:transparent; color:var(--fwc-text); font:inherit; font-size:12px; }
#forkwise-card-chain .fwc-action svg { width:14px; height:14px; }
#forkwise-card-chain .fwc-secondary { color:var(--fwc-muted); }
#forkwise-card-chain [aria-expanded="true"] { color:var(--fwc-selection); }
#forkwise-card-chain .fwc-connection { position:relative; display:flex; justify-content:center; align-items:center; min-width:0; height:110px; }
#forkwise-card-chain .fwc-line { position:absolute; left:0; right:0; top:50%; height:1px; background:var(--fwc-line); }
#forkwise-card-chain .fwc-line::after { content:""; position:absolute; right:2px; top:-3px; width:6px; height:6px; border-right:1px solid var(--fwc-line); border-top:1px solid var(--fwc-line); transform:rotate(45deg); }
#forkwise-card-chain .fwc-relation { position:relative; z-index:1; display:flex; flex-direction:column; gap:5px; align-items:center; max-width:129px; margin:0 7px; padding:7px; border:1px solid var(--fwc-edge); border-radius:5px; background:var(--fwc-paper); color:var(--fwc-text); font:inherit; line-height:1.6; text-align:center; }
#forkwise-card-chain .fwc-relation span { position:absolute; top:-24px; left:50%; transform:translateX(-50%); white-space:nowrap; padding:0 4px; background:var(--fwc-paper); color:var(--fwc-muted); font-size:11px; }
#forkwise-card-chain .fwc-relation strong { font-weight:400; font-size:12px; }
#forkwise-card-chain .fwc-popover { position:absolute; z-index:10; box-sizing:border-box; width:min(360px,calc(100% - 24px)); padding:18px; border:1px solid var(--fwc-edge); border-radius:10px; background:var(--fwc-paper); color:var(--fwc-text); box-shadow:0 10px 28px light-dark(#24323b22,#00000044); }
#forkwise-card-chain .fwc-popover[hidden] { display:none; }
#forkwise-card-chain .fwc-popover-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:12px; font-size:14px; }
#forkwise-card-chain .fwc-popover-title { font-weight:500; }
#forkwise-card-chain .fwc-close { border:0; background:transparent; color:var(--fwc-muted); font:inherit; font-size:12px; padding:3px 0; }
#forkwise-card-chain .fwc-popover-body { font-size:13px; line-height:1.65; overflow-wrap:anywhere; }
#forkwise-card-chain .fwc-popover-body p { margin:10px 0; }
#forkwise-card-chain .fwc-popover-body .fwc-meta { color:var(--fwc-muted); font-size:12px; }
#forkwise-card-chain .fwc-popover-body blockquote { margin:14px 0; padding:0 0 0 12px; border-left:2px solid var(--fwc-edge); }
#forkwise-card-chain .fwc-popover-body dl { display:grid; grid-template-columns:70px minmax(0,1fr); gap:10px 12px; margin:16px 0 0; }
#forkwise-card-chain .fwc-popover-body dt { color:var(--fwc-muted); }
#forkwise-card-chain .fwc-popover-body dd { margin:0; }
@media(max-width:640px) { #forkwise-card-chain .fwc-scene { grid-template-columns:minmax(0,340px); justify-content:center; padding:24px 20px; } #forkwise-card-chain .fwc-connection { height:108px; } #forkwise-card-chain .fwc-line { top:0; bottom:0; left:50%; right:auto; width:1px; height:auto; } #forkwise-card-chain .fwc-line::after { right:-3px; top:auto; bottom:3px; transform:rotate(135deg); } #forkwise-card-chain .fwc-relation { max-width:none; text-align:left; align-items:flex-start; padding:8px 16px; } #forkwise-card-chain .fwc-relation strong br { display:none; } }
@media(pointer:coarse) { #forkwise-card-chain .fwc-action, #forkwise-card-chain .fwc-close { min-height:44px; } }
</style>
<script>
(() => {
  const root = document.getElementById('forkwise-card-chain');
  const popup = root.querySelector('.fwc-popover');
  const popupTitle = root.querySelector('.fwc-popover-title');
  const popupBody = root.querySelector('.fwc-popover-body');
  const titles = {'revenue-source':'主张来源','cashflow-source':'主张来源','revenue-check':'公开资料查证','cashflow-check':'公开资料查证','revenue-detail':'判断与详情','cashflow-detail':'判断与详情','inference-detail':'推导关系'};
  const state = { selected:null, panel:null };
  let anchor = null;
  const save = () => {if(window.openai?.setWidgetState) window.openai.setWidgetState({privateContent:{selected:state.selected,panel:state.panel}}).catch(()=>{});};
  const place = () => {
    if(popup.hidden || !anchor) return;
    const bounds = root.getBoundingClientRect(), point = anchor.getBoundingClientRect();
    const left = Math.max(12,Math.min(point.left-bounds.left,root.clientWidth-popup.offsetWidth-12));
    const top = Math.max(12,Math.min(point.top-bounds.top+point.height+10,root.clientHeight-popup.offsetHeight-12));
    popup.style.left = `${left}px`; popup.style.top = `${top}px`;
  };
  const select = id => {
    state.selected = ['revenue','cashflow'].includes(id) ? id : null;
    root.querySelectorAll('[data-object]').forEach(note=>note.classList.toggle('is-selected',note.dataset.object===state.selected));
    root.querySelectorAll('[data-select]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.select===state.selected)));
  };
  const open = (panel, button) => {
    const template = [...root.querySelectorAll('template[data-content]')].find(item=>item.dataset.content===panel);
    state.panel = template ? panel : null;
    root.querySelectorAll('[data-panel]').forEach(item=>item.setAttribute('aria-expanded',String(item.dataset.panel===state.panel)));
    if(!template) {popup.hidden=true; anchor=null; return;}
    anchor = button; popupTitle.textContent=titles[panel]; popupBody.replaceChildren(template.content.cloneNode(true)); popup.hidden=false; place();
  };
  root.querySelectorAll('[data-select]').forEach(button=>button.addEventListener('click',()=>{select(button.dataset.select);open(null,null);save();}));
  root.querySelectorAll('[data-panel]').forEach(button=>button.addEventListener('click',()=>{open(state.panel===button.dataset.panel?null:button.dataset.panel,button);save();}));
  root.querySelector('.fwc-close').addEventListener('click',()=>{const previous=anchor;open(null,null);previous?.focus();save();});
  root.addEventListener('keydown',event=>{if(event.key==='Escape'){const previous=anchor;open(null,null);previous?.focus();save();}});
  const restore = stored => {
    select(stored?.privateContent?.selected);
    const panel = stored?.privateContent?.panel;
    const button = [...root.querySelectorAll('[data-panel]')].find(item=>item.dataset.panel===panel);
    open(button?panel:null,button);
  };
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState) restore(event.detail.globals.widgetState);});
  new ResizeObserver(place).observe(root);
  if(globalThis.Tweak){
    const settings = {radius:10,textSize:19,padding:20};
    const render = () => {root.style.setProperty('--fwc-radius',`${settings.radius}px`);root.style.setProperty('--fwc-text-size',`${settings.textSize}px`);root.style.setProperty('--fwc-padding',`${settings.padding}px`);place();};
    const tweak = new Tweak({container:root.querySelector('.fwc-note'),onChange:render});
    tweak.addSlider(settings,'radius',{label:'卡片圆角',min:6,max:14,unit:'px'});
    tweak.addSlider(settings,'textSize',{label:'主张字号',min:17,max:22,unit:'px'});
    tweak.addSlider(settings,'padding',{label:'卡片留白',min:16,max:24,unit:'px'});
  }
})();
</script>
