<svg xmlns="http://www.w3.org/2000/svg" width="790" height="790" viewBox="0 0 790 790" role="img" aria-labelledby="title desc">
  <title id="title">推导理由附在线上</title>
  <desc id="desc">三种结构示意：单项前提用一条推导线，共同依赖在共同线上明确标注前提组合，独立支持各自保留推导线。每一步推导分别保留理由、来源和个人立场。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#657982" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #20333e; }
      .title { font-size: 23px; font-weight: 500; }
      .section { font-size: 17px; font-weight: 500; }
      .label { font-size: 15px; }
      .meta { font-size: 13px; fill: #536873; }
      .note { font-size: 13px; fill: #536873; }
      .reason { font-size: 15px; fill: #276e68; }
      .claim { fill: #fff; stroke: #ced8dc; stroke-width: 1.2; rx: 7; }
      .link { fill: none; stroke: #657982; stroke-width: 1.5; }
      .divider { stroke: #e5ebed; stroke-width: 1; }
    </style>
  </defs>
  <rect width="790" height="790" fill="#f8faf9" rx="12"/>
  <g transform="translate(25 0)">
  <text x="26" y="42" class="title">主张是卡片，推导理由贴在线上</text>
  <text x="26" y="70" class="note">推导仍有自己的来源与立场；图上采用轻量文字标注。</text>

  <text x="26" y="114" class="section">单项前提</text>
  <rect class="claim" x="26" y="142" width="178" height="68"/>
  <text x="40" y="164" class="meta">前提</text>
  <text x="40" y="192" class="label">订单落地</text>
  <rect class="claim" x="536" y="142" width="178" height="68"/>
  <text x="550" y="164" class="meta">结论</text>
  <text x="550" y="192" class="label">营收有望增长</text>
  <path class="link" d="M204 176 H534" marker-end="url(#arrow)"/>
  <text x="370" y="158" text-anchor="middle" class="reason">订单有望转为营收</text>
  <text x="370" y="199" text-anchor="middle" class="meta">待研究 · 来源</text>
  <text x="26" y="239" class="note">点击线上的理由，查看这一步的来源、查证与编辑详情。</text>
  <path class="divider" d="M26 258 H714"/>

  <text x="26" y="290" class="section">共同依赖：一组前提，共用一步推导</text>
  <rect class="claim" x="26" y="316" width="178" height="58"/>
  <text x="40" y="339" class="meta">前提 A</text>
  <text x="40" y="361" class="label">量产条件具备</text>
  <rect class="claim" x="26" y="395" width="178" height="58"/>
  <text x="40" y="418" class="meta">前提 B</text>
  <text x="40" y="440" class="label">良率达到要求</text>
  <rect class="claim" x="536" y="351" width="178" height="68"/>
  <text x="550" y="373" class="meta">结论</text>
  <text x="550" y="401" class="label">外部订单预期</text>
  <path class="link" d="M204 345 H220 Q230 345 238 359 L254 385"/>
  <path class="link" d="M204 424 H220 Q230 424 238 410 L254 385"/>
  <circle cx="254" cy="385" r="3" fill="#657982"/>
  <path class="link" d="M254 385 H534" marker-end="url(#arrow)"/>
  <text x="394" y="343" text-anchor="middle" class="reason">共同依赖 · 2 项前提</text>
  <text x="394" y="365" text-anchor="middle" class="label">产能与质量共同提供支持</text>
  <text x="394" y="411" text-anchor="middle" class="meta">待研究 · 来源</text>
  <text x="26" y="484" class="note">假设一项前提不成立，这一步失去该组联合支持；结论仍可能有其他支持。</text>
  <path class="divider" d="M26 504 H714"/>

  <text x="26" y="536" class="section">独立支持：每条理由，各有一步推导</text>
  <rect class="claim" x="26" y="562" width="178" height="58"/>
  <text x="40" y="585" class="meta">前提 A</text>
  <text x="40" y="607" class="label">生产条件具备</text>
  <rect class="claim" x="26" y="649" width="178" height="58"/>
  <text x="40" y="672" class="meta">前提 B</text>
  <text x="40" y="694" class="label">客户希望分散供应商</text>
  <rect class="claim" x="536" y="600" width="178" height="68"/>
  <text x="550" y="622" class="meta">结论</text>
  <text x="550" y="650" class="label">外部订单预期</text>
  <path class="link" d="M204 591 H478 Q501 591 515 610 L534 624" marker-end="url(#arrow)"/>
  <path class="link" d="M204 678 H478 Q501 678 515 656 L534 645" marker-end="url(#arrow)"/>
  <text x="352" y="574" text-anchor="middle" class="reason">技术条件支持订单预期</text>
  <text x="352" y="612" text-anchor="middle" class="meta">待研究 · 来源</text>
  <text x="352" y="660" text-anchor="middle" class="reason">客户动机支持订单预期</text>
  <text x="352" y="701" text-anchor="middle" class="meta">待研究 · 来源</text>
  <text x="26" y="735" class="note">一条理由失去支持，不自动取消另一条推导。</text>
  <path class="divider" d="M26 753 H714"/>
  <text x="26" y="777" class="meta">本人推导 · 结构示例，不代表结论成立；查证结果不自动改变个人立场。</text>
  </g>
</svg>
