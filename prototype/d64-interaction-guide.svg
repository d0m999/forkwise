<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1320 790"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#47847c"/></marker></defs><rect width="1320" height="790" fill="#f5f7f6"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="42" y="49" font-size="30" fill="#263d38" font-weight="600">见岔 · 从选中对象开始操作</text><text x="42" y="84" font-size="20" fill="#647c74" font-weight="400">点卡片或连线上的理由，选一项操作，完成后回到原位置</text><rect x="42" y="125" width="360" height="214" rx="14" fill="#fff" stroke="#cad8d3"/><text x="64" y="158" font-size="22" fill="#263d38" font-weight="600">1  选中对象</text><rect x="66" y="182" width="306" height="127" rx="9" fill="#fff" stroke="#358279"/><text x="85" y="212" font-size="15" fill="#647c74" font-weight="400">内容起点  来源</text><text x="85" y="250" font-size="23" fill="#263d38" font-weight="500">18A 按期进入量产</text><text x="85" y="287" font-size="15" fill="#647c74" font-weight="400">我的立场：待研究     来源 2</text><rect x="468" y="125" width="810" height="214" rx="14" fill="#fff" stroke="#cad8d3"/><text x="490" y="158" font-size="22" fill="#263d38" font-weight="600">2  工具条就近出现</text><rect x="490" y="187" width="80" height="52" rx="9" fill="#eaf3ef" stroke="#a8c4b8"/><text x="507" y="220" font-size="21" fill="#263d38" font-weight="400">改写</text><rect x="582" y="187" width="80" height="52" rx="9" fill="#fff" stroke="#a8c4b8"/><text x="599" y="220" font-size="21" fill="#263d38" font-weight="400">立场</text><rect x="674" y="187" width="80" height="52" rx="9" fill="#fff" stroke="#a8c4b8"/><text x="691" y="220" font-size="21" fill="#263d38" font-weight="400">查证</text><rect x="766" y="187" width="80" height="52" rx="9" fill="#fff" stroke="#a8c4b8"/><text x="783" y="220" font-size="21" fill="#263d38" font-weight="400">来源</text><rect x="858" y="187" width="80" height="52" rx="9" fill="#fff" stroke="#a8c4b8"/><text x="875" y="220" font-size="21" fill="#263d38" font-weight="400">推导</text><rect x="950" y="187" width="65" height="52" rx="9" fill="#fff" stroke="#a8c4b8"/><text x="967" y="220" font-size="21" fill="#263d38" font-weight="400">AI</text><rect x="1027" y="187" width="85" height="52" rx="9" fill="#fff" stroke="#a8c4b8"/><text x="1044" y="220" font-size="21" fill="#263d38" font-weight="400">更多</text><text x="490" y="277" font-size="19" fill="#647c74" font-weight="400">「更多」：修改记录、样式、聚焦、删除</text><text x="490" y="307" font-size="18" fill="#647c74" font-weight="400">选中多项时，工具条显示作用范围与共同适用的操作。</text><path d="M411 238 L454 238" stroke="#47847c" stroke-width="2" marker-end="url(#arrow)"/><text x="42" y="388" font-size="24" fill="#263d38" font-weight="600">3  点哪项，就处理哪一件事</text><rect x="42" y="415" width="400" height="209" rx="14" fill="#fff" stroke="#cad8d3"/><text x="62" y="454" font-size="24" fill="#276e68" font-weight="600">改写</text><text x="62" y="490" font-size="20" fill="#263d38" font-weight="400">修改当前这句话</text><text x="62" y="536" font-size="17" fill="#647c74" font-weight="400">保存后，画布立即显示新文字</text><text x="62" y="570" font-size="17" fill="#647c74" font-weight="400">最近改动从「更多／修改记录」查看</text><rect x="460" y="415" width="400" height="209" rx="14" fill="#fff" stroke="#cad8d3"/><text x="480" y="454" font-size="24" fill="#276e68" font-weight="600">立场 / 查证 / 来源</text><text x="480" y="490" font-size="20" fill="#263d38" font-weight="400">各有单独入口</text><text x="480" y="536" font-size="17" fill="#647c74" font-weight="400">立场记录你的判断；查证展示依据</text><text x="480" y="570" font-size="17" fill="#647c74" font-weight="400">来源定位引用版本，读完返回画布</text><rect x="878" y="415" width="400" height="209" rx="14" fill="#fff" stroke="#cad8d3"/><text x="898" y="454" font-size="24" fill="#276e68" font-weight="600">AI</text><text x="898" y="490" font-size="20" fill="#263d38" font-weight="400">先讨论，再决定是否采用</text><text x="898" y="536" font-size="17" fill="#647c74" font-weight="400">先选任务、提问，得到演示回答</text><text x="898" y="570" font-size="17" fill="#647c74" font-weight="400">明确添加为 AI 候选卡才进入画布</text><rect x="42" y="661" width="1236" height="91" rx="14" fill="#eaf3ef" stroke="#bdd4ca"/><text x="65" y="696" font-size="23" fill="#263d38" font-weight="600">4  回到画布，看到操作结果；需要时撤销</text><text x="65" y="730" font-size="18" fill="#647c74" font-weight="400">聚焦只调整视口，可返回原视图。样式不改变起点、立场或正文历史。AI 当前为本地交互演示。</text></g></svg>