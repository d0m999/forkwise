<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="688" viewBox="0 0 1100 688">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L7 4.5 L0 8" fill="none" stroke="#2b7873" stroke-width="1.7"/></marker></defs>
<rect width="1100" height="688" fill="#f3f7f5"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#293e39">
  <text x="38" y="47" font-size="27" font-weight="600">推导直接在画布操作，移除专用关系窗口</text>
  <text x="38" y="78" font-size="15" fill="#73877e">D72 操作示意 · 模拟内容</text>
  <rect x="38" y="103" width="1024" height="373" rx="16" fill="#fff" stroke="#d0ddd6"/>
  <text x="62" y="139" font-size="16" font-weight="600">选中后，高亮相关前提、推导和结论</text>

  <g fill="none" stroke="#2b7873" stroke-width="2">
    <path d="M285 210 H360 V254 H425"/>
    <path d="M285 313 H360 V254"/>
    <path d="M702 254 H779" marker-end="url(#arrow)"/>
  </g>
  <rect x="66" y="169" width="219" height="81" rx="10" fill="#f8fcfa" stroke="#2b7873" stroke-width="1.5"/>
  <text x="84" y="196" font-size="13" fill="#7b8e85">前提 A</text><text x="84" y="224" font-size="19">生产能力达标</text>
  <rect x="66" y="272" width="219" height="81" rx="10" fill="#f8fcfa" stroke="#2b7873" stroke-width="1.5"/>
  <text x="84" y="299" font-size="13" fill="#7b8e85">前提 B</text><text x="84" y="327" font-size="19">产品通过客户认证</text>

  <rect x="423" y="173" width="280" height="135" rx="10" fill="#fff" stroke="#7770dc" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="442" y="201" font-size="13" fill="#2b7873">共同依赖 · 2 项前提</text>
  <text x="442" y="229" font-size="18" font-weight="600">两项齐备，才有接单基础</text>
  <line x1="423" y1="254" x2="703" y2="254" stroke="#2b7873" stroke-width="2"/>
  <text x="442" y="282" font-size="13" fill="#73877e">我的立场</text>
  <rect x="510" y="263" width="56" height="26" rx="6" fill="#fff0d7"/>
  <text x="526" y="281" font-size="13" fill="#966522">质疑</text>
  <text x="628" y="282" font-size="13" fill="#73877e">来源 2</text>
  <rect x="779" y="211" width="245" height="86" rx="10" fill="#f8fcfa" stroke="#2b7873" stroke-width="1.5"/>
  <text x="797" y="240" font-size="13" fill="#7b8e85">结论 C</text><text x="797" y="270" font-size="19">公司可以承接新增订单</text>

  <rect x="423" y="324" width="396" height="47" rx="9" fill="#eff4f1" stroke="#cbd9d1"/>
  <text x="440" y="354" font-size="15">改写</text><line x1="486" y1="336" x2="486" y2="359" stroke="#cfdbd4"/>
  <text x="501" y="354" font-size="15">查证与立场</text><line x1="591" y1="336" x2="591" y2="359" stroke="#cfdbd4"/>
  <text x="606" y="354" font-size="15">来源</text><line x1="651" y1="336" x2="651" y2="359" stroke="#cfdbd4"/>
  <text x="667" y="354" font-size="15">AI</text><line x1="701" y1="336" x2="701" y2="359" stroke="#cfdbd4"/><text x="717" y="354" font-size="15">更多 ···</text>
  <text x="427" y="395" font-size="14" fill="#73877e">工具出现在当前对象旁；这里不再提供「推导」窗口入口</text>
  <text x="62" y="447" font-size="15" fill="#567264">共同依赖保留汇合结构；两条独立支持分别保留各自的推导理由。</text>

  <rect x="38" y="497" width="326" height="142" rx="12" fill="#fff" stroke="#d0ddd6"/>
  <text x="58" y="528" font-size="18" font-weight="600">改结构 → 操作卡片和连线</text>
  <text x="58" y="558" font-size="15" fill="#687e72">拖子卡到父卡：新增推导</text>
  <text x="58" y="584" font-size="15" fill="#687e72">更多 → 删除这步推导：解除整步</text>
  <text x="58" y="610" font-size="15" fill="#687e72">前提和结论保留，可撤销</text>

  <rect x="387" y="497" width="326" height="142" rx="12" fill="#fff" stroke="#d0ddd6"/>
  <text x="407" y="528" font-size="18" font-weight="600">改推导理由 → 选线上文字</text>
  <text x="407" y="558" font-size="15" fill="#687e72">从对象旁的「改写」修改这句话</text>
  <text x="407" y="584" font-size="15" fill="#687e72">保存后在原处查看</text>
  <text x="407" y="610" font-size="15" fill="#687e72">修改记录继续放在「更多」</text>

  <rect x="736" y="497" width="326" height="142" rx="12" fill="#fff" stroke="#d0ddd6"/>
  <text x="756" y="528" font-size="18" font-weight="600">表达判断 → 查证与立场</text>
  <text x="756" y="558" font-size="15" fill="#687e72">查看依据、保存这一步的立场</text>
  <text x="756" y="584" font-size="15" fill="#687e72">立场变化仍在同一对象中回看</text>
  <text x="756" y="610" font-size="15" fill="#687e72">主张卡：更多 → 试一个假设</text>
  <text x="38" y="671" font-size="13" fill="#80938a">重接端点尚未实现；共同依赖合并、拆分手势待定。普通位移只改位置，新增推导保留旧连接。</text>
</g></svg>
