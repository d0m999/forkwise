<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
  <title>见岔项目导航布局提案</title>
  <desc>侧栏用短项目名称与紧凑列表切换研究，完整研究问题显示在主画布顶部。导航仍可收起或固定。此图为待确认提案，项目内容均为示例。</desc>
  <defs>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#263d38}
      .title{font-size:32px;font-weight:600}.heading{font-size:23px;font-weight:600}
      .body{font-size:21px}.small{font-size:18px}.muted{fill:#778780}
      .accent{fill:#276e68}.line{stroke:#dfe6e2;stroke-width:1.5}
      .note{font-size:20px;fill:#52665f}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#72968f"/></marker>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#dce5df"/></pattern>
  </defs>
  <rect width="1440" height="1080" fill="#fafbf9"/>
  <text x="48" y="55" class="title">把“找项目”和“做研究”分开</text>
  <text x="48" y="88" class="small muted">布局提案 · 示例项目与内容 · 搜索、重命名、独立项目名称尚待确认</text>
  <rect x="48" y="115" width="1344" height="650" rx="16" fill="#fff" stroke="#ccd8d1" stroke-width="2"/>
  <path d="M64 115H310V765H64Q48 765 48 749V131Q48 115 64 115Z" fill="#f3f5f3"/>
  <path d="M310 115V765" class="line"/>
  <path d="M78 141V181M78 159L100 143M78 159L104 177" fill="none" stroke="#276e68" stroke-width="3"/>
  <text x="119" y="170" class="heading">见岔</text>
  <text x="267" y="169" class="body muted">«</text>
  <rect x="66" y="205" width="226" height="43" rx="7" fill="#fff" stroke="#dfe6e2"/>
  <circle cx="84" cy="224" r="7" fill="none" stroke="#83918b" stroke-width="1.8"/><path d="M89 229L95 235" stroke="#83918b" stroke-width="1.8"/>
  <text x="106" y="233" class="small muted">搜索项目</text>
  <rect x="66" y="260" width="226" height="43" rx="7" fill="#e8efeb"/>
  <text x="81" y="289" class="body accent">＋ 新建研究</text>
  <text x="74" y="343" class="small muted">研究项目</text>
  <text x="238" y="343" class="small accent">固定</text>
  <rect x="62" y="361" width="234" height="47" rx="7" fill="#ddebe5"/>
  <path d="M67 371V398" stroke="#276e68" stroke-width="3"/>
  <text x="82" y="391" class="body">Intel 代工</text>
  <text x="263" y="386" class="body">…</text>
  <text x="82" y="441" class="body">Intel 资本开支</text>
  <text x="82" y="491" class="body">半导体设备</text>
  <text x="82" y="541" class="body">先进封装</text>
  <path d="M66 706H292" class="line"/>
  <text x="74" y="739" class="small muted">存档状态与说明</text>
  <text x="275" y="739" class="small muted">›</text>
  <text x="340" y="156" class="small muted">研究项目</text>
  <text x="340" y="196" class="title">Intel 代工</text>
  <rect x="970" y="142" width="76" height="36" rx="6" fill="#f3f5f3"/><text x="990" y="166" class="small">材料</text>
  <rect x="1056" y="142" width="76" height="36" rx="6" fill="#f3f5f3"/><text x="1076" y="166" class="small">查证</text>
  <text x="1151" y="166" class="small">对照原版</text><text x="1288" y="166" class="small">更多 ⋯</text>
  <text x="1345" y="215" text-anchor="end" class="small muted">存档状态 ›</text>
  <text x="340" y="230" class="small muted">研究问题</text>
  <text x="340" y="261" class="body">这位作者关于 Intel 代工的核心判断依赖哪些前提，我认可哪些、质疑哪些？</text>
  <path d="M310 285H1392" class="line"/>
  <rect x="311" y="286" width="1080" height="478" fill="url(#dots)"/>
  <rect x="706" y="308" width="290" height="42" rx="10" fill="#fff" stroke="#dfe6e2"/>
  <text x="731" y="337" class="small muted">选择　卡片　连线　文字</text>
  <path d="M630 449H735V505H770M630 611H735V505" fill="none" stroke="#72968f" stroke-width="2.5"/>
  <rect x="370" y="389" width="260" height="121" rx="10" fill="#fff" stroke="#cbdad1" stroke-width="1.5"/>
  <text x="390" y="420" class="small muted">主张</text><text x="390" y="457" class="body">18A 按期进入量产</text><text x="390" y="489" class="small accent">待研究</text>
  <rect x="370" y="551" width="260" height="121" rx="10" fill="#fff" stroke="#cbdad1" stroke-width="1.5"/>
  <text x="390" y="582" class="small muted">主张</text><text x="390" y="619" class="body">良率达到可比水平</text><text x="390" y="651" class="small accent">待研究</text>
  <rect x="770" y="474" width="210" height="60" rx="8" fill="#f7faf8" stroke="#a9c3b8"/>
  <text x="789" y="499" class="small accent">共同依赖 · 2 项前提</text><text x="789" y="521" class="small">满足条件才谈订单</text>
  <path d="M980 505H1050" fill="none" stroke="#72968f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1053" y="438" width="300" height="141" rx="10" fill="#fff" stroke="#cbdad1" stroke-width="1.5"/>
  <text x="1073" y="470" class="small muted">主张</text><text x="1073" y="507" class="body">外部客户下单 Intel Foundry</text><text x="1073" y="553" class="small accent">待研究</text>
  <text x="1349" y="735" text-anchor="end" class="small muted">当前研究画布</text>
  <text x="48" y="817" class="heading">进入研究后，导航仍默认收起；需要时展开或固定。</text>
  <rect x="48" y="837" width="1344" height="64" rx="10" fill="#fff" stroke="#ccd8d1"/>
  <text x="70" y="878" class="body accent">☰ 项目</text>
  <path d="M174 853V885" class="line"/>
  <text x="198" y="878" class="body">Intel 代工</text>
  <text x="854" y="878" class="small muted">存档状态 ›</text>
  <text x="1033" y="878" class="small">材料　　查证　　对照原版　　更多 ⋯</text>
  <text x="48" y="951" class="heading">① 短名称找项目</text>
  <text x="48" y="988" class="note">项目可重命名；列表不再重复</text><text x="48" y="1019" class="note">显示完整问题和“研究画布”。</text>
  <text x="506" y="951" class="heading">② 完整问题留在主区</text>
  <text x="506" y="988" class="note">长问题保留并可编辑；</text><text x="506" y="1019" class="note">切换项目后更新当前画布。</text>
  <text x="964" y="951" class="heading">③ 轻列表与就近操作</text>
  <text x="964" y="988" class="note">选中行高亮，行内 ⋯ 重命名；</text><text x="964" y="1019" class="note">长存档说明按需打开。</text>
</svg>
