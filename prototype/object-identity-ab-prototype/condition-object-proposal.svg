<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="442" viewBox="0 0 1140 442">
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#273a34}.muted{fill:#65776d}</style>
  <rect width="1140" height="442" rx="12" fill="#f6f7f3"/>
  <text x="28" y="40" font-size="24" font-weight="600">Q13 · 条件规则是附属字段，还是独立对象？</text>
  <text x="920" y="39" font-size="13" class="muted">A / B 对照 · 尚待选择</text>
  <rect x="24" y="70" width="532" height="318" rx="12" fill="#f9fbf8" stroke="#d6e0d8"/>
  <rect x="584" y="70" width="532" height="318" rx="12" fill="#f9fbf8" stroke="#d6e0d8"/>
  <text x="48" y="109" font-size="21" font-weight="600">A  条件嵌在各自对象里</text>
  <text x="608" y="109" font-size="21" font-weight="600">B  条件独立保存，供多处引用</text>
  <rect x="48" y="131" width="484" height="101" rx="10" fill="white" stroke="#cbd8cd"/>
  <text x="66" y="161" font-size="17" font-weight="550">陈述：公司具备持续增长能力</text>
  <text x="66" y="190" font-size="14">内含条件：未来两季营收同比均 ≥ 10%</text>
  <text x="66" y="214" font-size="12" class="muted">规则随这项陈述维护</text>
  <rect x="48" y="250" width="484" height="101" rx="10" fill="white" stroke="#cbd8cd"/>
  <text x="66" y="280" font-size="17" font-weight="550">推导：增长持续 → 扩产具有必要性</text>
  <text x="66" y="309" font-size="14">内含条件：未来两季营收同比均 ≥ 10%</text>
  <text x="66" y="333" font-size="12" class="muted">规则随这项推导维护</text>
  <rect x="608" y="131" width="484" height="105" rx="10" fill="#eaf3ee" stroke="#397566"/>
  <text x="628" y="159" font-size="13" class="muted">独立的条件规则</text>
  <text x="628" y="188" font-size="20" font-weight="550">未来两季营收同比均 ≥ 10%</text>
  <text x="628" y="215" font-size="12" class="muted">规则可单独编辑、保留历史；时间与口径须明确</text>
  <path d="M850 236 V268 H725 V289 M850 268 H975 V289" fill="none" stroke="#8aaa98" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="783" y="246" width="135" height="24" fill="#f9fbf8"/>
  <text x="850" y="263" text-anchor="middle" font-size="12" class="muted">引用同一条件</text>
  <rect x="608" y="289" width="234" height="74" rx="9" fill="white" stroke="#cbd8cd"/>
  <text x="624" y="313" font-size="12" class="muted">陈述</text>
  <text x="624" y="342" font-size="16">公司具备持续增长能力</text>
  <rect x="858" y="289" width="234" height="74" rx="9" fill="white" stroke="#cbd8cd"/>
  <text x="874" y="313" font-size="12" class="muted">推导</text>
  <text x="874" y="342" font-size="15">增长持续 → 扩产具有必要性</text>
  <text x="28" y="421" font-size="13" class="muted">数字与期间只是规则示例。条件满足与否、是否认可陈述或推导，分别记录；独立对象不要求独立画布卡片。</text>
</svg>
