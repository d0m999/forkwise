<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#273a34}.muted{fill:#65776d}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#789181" stroke-width="1.5"/></marker></defs>
  <rect width="1100" height="420" rx="12" fill="#f6f7f3"/>
  <text x="30" y="40" font-size="23" font-weight="600">Q11 · 新陈述是否沿用原有上游推导？</text>
  <text x="852" y="39" font-size="13" class="muted">B 方案示意 · 尚待确认</text>
  <path d="M270 147 H430" fill="none" stroke="#789181" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M670 147 H820" fill="none" stroke="#789181" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M670 310 H820" fill="none" stroke="#789181" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="292" y="130" width="116" height="30" rx="6" fill="white" stroke="#d6e0d8"/>
  <text x="350" y="150" text-anchor="middle" font-size="13">原有上游推导</text>
  <rect x="691" y="130" width="108" height="30" rx="6" fill="white" stroke="#d6e0d8"/>
  <text x="745" y="150" text-anchor="middle" font-size="13">备货推导</text>
  <rect x="691" y="294" width="108" height="30" rx="6" fill="#eaf3ee" stroke="#97ac9c"/>
  <text x="745" y="314" text-anchor="middle" font-size="13">收入推导</text>
  <path d="M550 191 V265" fill="none" stroke="#97ac9c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="568" y="232" font-size="13" class="muted">改写来历</text>
  <rect x="30" y="105" width="240" height="86" rx="10" fill="white" stroke="#cbd8cd"/>
  <text x="48" y="132" font-size="12" class="muted">原有前提</text>
  <text x="48" y="163" font-size="20" font-weight="550">市场需求增长</text>
  <rect x="430" y="105" width="240" height="86" rx="10" fill="white" stroke="#cbd8cd"/>
  <text x="448" y="132" font-size="12" class="muted">原陈述 · 原推导保留</text>
  <text x="448" y="163" font-size="20" font-weight="550">订单将增长</text>
  <rect x="820" y="105" width="250" height="86" rx="10" fill="white" stroke="#cbd8cd"/>
  <text x="838" y="132" font-size="12" class="muted">未选中的下游</text>
  <text x="838" y="163" font-size="20" font-weight="550">需要增加备货</text>
  <rect x="430" y="265" width="240" height="86" rx="10" fill="#eaf3ee" stroke="#397566" stroke-width="1.5"/>
  <text x="448" y="292" font-size="12" class="muted">派生的新陈述</text>
  <text x="448" y="323" font-size="20" font-weight="550">订单将持平</text>
  <rect x="820" y="265" width="250" height="86" rx="10" fill="white" stroke="#cbd8cd"/>
  <text x="838" y="292" font-size="12" class="muted">选中的下游 · 结论原文保留</text>
  <text x="838" y="323" font-size="20" font-weight="550">收入可能提高</text>
  <text x="30" y="302" font-size="17" fill="#397566">新陈述的上游理由</text>
  <text x="30" y="331" font-size="15" class="muted">由本人另行建立或明确复用</text>
  <text x="30" y="392" font-size="14" class="muted">已选中的下游推导仍按 D110 改接；本题只讨论是否自动复制原有上游推导。</text>
</svg>
