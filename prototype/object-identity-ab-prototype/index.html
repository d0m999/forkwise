<main>
  <header><div><h1>只改一处，画布怎么变？</h1><p>将“订单将增长”改为“订单将持平”，只用于收入推导。对照新对象与同一对象不同版本的前端呈现。</p></div><div class="mark">见岔 · 交互草图 · 两方案均待选</div></header>
  <nav class="controls" aria-label="同步演示控制">
    <div class="row"><label>演示情景</label><button data-scenario="local" class="active">只改收入推导</button><button data-scenario="all">更新全部引用</button><button data-scenario="cancel">取消改写</button></div>
    <div class="row steps"><label>同步查看</label><button data-phase="before">1 修改前</button><button data-phase="edit">2 编辑中</button><button data-phase="after" class="active">3 保存后</button></div>
    <button class="reset" id="restart">从头演示</button>

  <p class="footer"><strong>这张图只比较身份与版本的呈现。</strong> 原结论保留，供你继续检查推理。图中为虚构内容、内存演示；刷新即重置。查看版本不会改变任何推导的引用。</p>

<script id="identity-demo-model">
// PROTOTYPE: in-memory model for Q9 only; neither option is an adopted decision.
const IdentityDemo=(()=>{
  const original='订单将增长';
  const names={income:'收入推导',stock:'备货推导'};
  const seed=variant=>({variant,phase:'before',draft:'订单将持平',scope:[],savedText:'',savedScope:[],view:'current',notice:''});
  function reduce(s,a){
    if(a.type==='reset')return seed(s.variant);
    if(a.type==='edit')return {...seed(s.variant),phase:'edit'};
    if(a.type==='draft')return {...s,draft:a.text};
    if(a.type==='scope')return {...s,scope:a.checked?[...new Set([...s.scope,a.scope])]:s.scope.filter(x=>x!==a.scope)};
    if(a.type==='all')return {...s,scope:['income','stock']};
    if(a.type==='cancel')return {...seed(s.variant),notice:'已取消，内容与引用保持原样。'};
    if(a.type==='save'){
      if(s.phase!=='edit'||!s.scope.length||!s.draft.trim()||s.draft.trim()===original)return s;
      return {...s,phase:'after',savedText:s.draft.trim(),savedScope:[...s.scope],view:'current',notice:''};
    }
    if(a.type==='view')return {...s,view:a.view};
    return s;
  }
  function snapshot(s){
    const saved=s.phase==='after',local=saved&&s.savedScope.length===1;
    const entries=[{id:'order',versions:[{n:1,text:original}]}];
    if(saved&&local&&s.variant==='A')entries.push({id:'derived-order',versions:[{n:1,text:s.savedText}],from:{id:'order',version:1}});
    else if(saved)entries[0].versions.push({n:2,text:s.savedText});
    const uses=['income','stock'].map(key=>({key,label:names[key],id:local&&s.variant==='A'&&s.savedScope.includes(key)?'derived-order':'order',version:saved&&s.savedScope.includes(key)&&!(local&&s.variant==='A')?2:1,text:saved&&s.savedScope.includes(key)?s.savedText:original}));
    return {saved,local,entries,uses,statementIdentities:entries.length+2,displayCards:local?4:3};
  }
  function scenario(variant,kind,phase){
    let s=seed(variant);
    if(phase==='before')return s;
    s=reduce(s,{type:'edit'});
    if(kind==='all')s=reduce(s,{type:'all'});
    else s=reduce(s,{type:'scope',scope:'income',checked:true});
    if(phase==='edit')return s;
    return reduce(s,{type:kind==='cancel'?'cancel':'save'});
  }
  return {seed,reduce,snapshot,scenario,original,names};
})();
</script>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let scenarioName='local',phaseName='after';
let states={A:IdentityDemo.scenario('A','local','after'),B:IdentityDemo.scenario('B','local','after')};
const strokes={ink:'#273a34',muted:'#65776d',line:'#b9cdc1',accent:'#397566'};
function textLines(text,max=13){const chars=Array.from(text),lines=[];while(chars.length)lines.push(chars.splice(0,max).join(''));return lines;}
function card(x,y,w,title,meta,{changed=false,view='',footer='待研究',height=112}={}){
 const lines=textLines(title,Math.max(8,Math.floor((w-32)/17))),clipped=lines.slice(0,2);if(lines.length>2)clipped[1]=clipped[1].slice(0,-1)+'…';
 return `<g ${view?`data-view="${view}" role="button" tabindex="0" aria-label="${esc(meta+'：'+title)}"`:''}><rect x="${x}" y="${y}" width="${w}" height="${height}" rx="10" fill="${changed?'#f0f7f2':'#fff'}" stroke="${changed?'#397566':'#cbd8cd'}" stroke-width="${changed?1.7:1.2}"/><text x="${x+15}" y="${y+24}" font-size="12" fill="#65776d">${esc(meta)}</text>${clipped.map((line,i)=>`<text x="${x+15}" y="${y+51+i*22}" font-size="17" font-weight="550" fill="#273a34">${esc(line)}</text>`).join('')}<text x="${x+15}" y="${y+height-14}" font-size="11.5" fill="${changed?'#397566':'#65776d'}">${esc(footer)}</text></g>`;
}
function diagram(s){
 const m=IdentityDemo.snapshot(s),v=s.variant;
 let paths='',cards='',group='';
 const edge=(x,fromY,toX,changed,label)=>`<path d="M${x} ${fromY} V206 Q${x} 219 ${toX} 219 V306" fill="none" stroke="${changed?'#397566':'#82998d'}" stroke-width="2" marker-end="url(#arr${v})"/><rect x="${toX-85}" y="224" width="170" height="32" rx="7" fill="${changed?'#eaf3ee':'#fff'}" stroke="${changed?'#8bae9c':'#d6e0d8'}"/><text x="${toX}" y="245" text-anchor="middle" font-size="12.5" fill="#476759">${label}${changed?' · 内容已改':''}</text>`;
 if(m.local){
   if(v==='B')group=`<rect x="13" y="27" width="574" height="161" rx="16" fill="none" stroke="#8aaa98" stroke-dasharray="5 4"/><rect x="186" y="14" width="228" height="24" rx="8" fill="#f9fbf8"/><text x="300" y="31" text-anchor="middle" fill="#397566" font-size="12.5">同一陈述，在两处使用不同版本</text>`;
   const left=m.uses[0],right=m.uses[1];
   for(const [i,use]of m.uses.entries()){
     const x=i===0?25:323,changed=s.savedScope.includes(use.key);
     const meta=v==='A'?(changed?'用户 · 局部改写后的陈述':'用户 · 原陈述'):`用户 · ${changed?'版本 2':'版本 1'}`;
     cards+=card(x,59,252,use.text,meta,{changed,view:changed?'current':'original',footer:v==='A'?(changed?'待研究 · 查看改写来历':'待研究 · 保留原内容'):`用于${use.label} · 查看版本`});
     paths+=edge(x+126,171,x+126,changed,i===0?'推导① 收入':'推导② 备货');
   }
   if(v==='A')group=`<path d="M323 84 C303 35 297 35 277 84" fill="none" stroke="#90a899" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arr${v})"/><text x="300" y="31" text-anchor="middle" fill="#65776d" font-size="12">改写自</text>`;
 }else{
   const title=m.saved?s.savedText:IdentityDemo.original;
   cards+=card(164,52,272,title,m.saved?'用户 · 全部引用已更新':'用户 · 两处推导共用',{changed:m.saved,view:'current',footer:'待研究 · 同一陈述'});
   paths+=edge(245,164,151,m.saved,'推导① 收入')+edge(355,164,449,m.saved,'推导② 备货');
 }
 cards+=card(25,306,252,'收入可能提高','用户 · 结论',{height:104,footer:'待研究 · 结论原文保留'})+card(323,306,252,'需要增加备货','用户 · 结论',{height:104,footer:'待研究 · 结论原文保留'});
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 436" role="img" aria-label="方案${v}的陈述与推导画布" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><defs><marker id="arr${v}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#6d8d7c" stroke-width="1.5"/></marker><pattern id="dots${v}" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#d9e2d8"/></pattern></defs><rect width="600" height="436" fill="#f9fbf8"/><rect width="600" height="436" fill="url(#dots${v})"/>${paths}${group}${cards}</svg>`;
}
function inspector(s,m){
 if(!m.saved)return `<h3>当前只有一份共享内容</h3><div class="readout"><div><small>收入推导</small><strong>${IdentityDemo.original}</strong></div><div><small>备货推导</small><strong>${IdentityDemo.original}</strong></div></div><p class="caption">两步推导引用同一项陈述。${s.notice||'可以从“编辑中”开始体验范围选择。'}</p>`;
 if(!m.local)return `<h3>全部引用一起使用新内容</h3><div class="readout"><div><small>改写前</small><strong>${IdentityDemo.original}</strong></div><div class="selected"><small>改写后</small><strong>${esc(s.savedText)}</strong></div></div><p class="caption">本例展示共享更新：两步推导均使用改后内容，旧内容留在历史中。</p>`;
 if(s.variant==='A')return `<h3>改写来历</h3><div class="readout"><div class="${s.view==='original'?'selected':''}"><small>原陈述 · 保留</small><strong>${IdentityDemo.original}</strong><div class="meta">${IdentityDemo.names[s.savedScope[0]==='income'?'stock':'income']}继续引用</div></div><div class="${s.view!=='original'?'selected':''}"><small>派生的新陈述</small><strong>${esc(s.savedText)}</strong><div class="meta">${IdentityDemo.names[s.savedScope[0]]}已改接至此</div></div></div><p class="caption">“改写自”保留来历；此后是两项可分别研究的陈述。</p>`;
 const old=s.view==='original';
 return `<h3>同一陈述的所用版本</h3><div class="version-tabs"><button data-view="current" class="${old?'':'active'}">版本 2 · 改写后</button><button data-view="original" class="${old?'active':''}">版本 1 · 原内容</button></div><div class="version-box"><div><strong>${esc(old?IdentityDemo.original:s.savedText)}</strong><span>仍属于同一陈述</span></div><span class="uses">用于${IdentityDemo.names[old?(s.savedScope[0]==='income'?'stock':'income'):s.savedScope[0]]}</span></div><p class="caption">只切换这里的查看内容；画布引用保持各自所用版本。</p>`;
}
function renderPanel(v){
 const s=states[v],m=IdentityDemo.snapshot(s),name=v==='A'?'派生新对象':'同一对象的不同版本';
 const outcome=m.local?(v==='A'?'新增一项陈述，选定推导改接新内容':'原陈述保留两份版本，推导分别引用'):(m.saved?'全部引用已更新':'同一陈述正被两步推导引用');
 const edit=s.phase==='edit'?`<div class="edit"><h3>改写陈述</h3><textarea data-draft aria-label="方案${v}的新陈述内容" maxlength="64">${esc(s.draft)}</textarea><fieldset><legend>这次修改用于哪些推导？</legend>${['income','stock'].map(k=>`<label class="choice"><input type="checkbox" data-scope="${k}" ${s.scope.includes(k)?'checked':''}>${k==='income'?'推导①：收入可能提高':'推导②：需要增加备货'}</label>`).join('')}</fieldset><div class="hint">${!s.scope.length?'请选择范围后再保存。':s.scope.length===2?'两处均使用新内容。':`只改变${IdentityDemo.names[s.scope[0]]}所用内容。`}</div><div class="actions"><button data-action="cancel">取消</button><button data-action="all">选择全部</button><button class="primary" data-action="save" ${!s.scope.length||!s.draft.trim()||s.draft.trim()===IdentityDemo.original?'disabled':''}>保存修改</button></div></div>`:'';
 return `<section class="panel" data-variant="${v}" aria-label="方案${v} ${name}"><div class="panel-head"><span class="letter">${v}</span><div><h2>${name}</h2><p>${v==='A'?'用“改写自”连接两个陈述的来历':'在引用处辨认同一陈述所用的版本'}</p></div></div><div class="canvas">${diagram(s)}</div>${edit||`<div class="status"><div><strong>${outcome}</strong><small>${m.statementIdentities} 个陈述身份 · ${m.displayCards} 张展示卡 · 2 项推导</small></div><button data-action="${m.saved?'inspect':'edit'}">${m.saved?(v==='A'?'查看改写来历':'查看所用版本'):'改写订单陈述'}</button></div><div class="inspector">${inspector(s,m)}</div>`}<details class="state"><summary>对象与引用关系（评审辅助）</summary><dl><dt>当前阶段</dt><dd>${s.phase==='edit'?'未保存草稿':m.saved?'修改已在本示例保存':'修改前'}</dd><dt>修改范围</dt><dd>${(s.phase==='edit'?s.scope:s.savedScope).map(k=>IdentityDemo.names[k]).join('、')||'未选择'}</dd><dt>陈述身份</dt><dd>${m.entries.map(e=>e.id==='order'?'原陈述':'派生陈述').join('、')}，另有两项结论</dd></dl><table><thead><tr><th>推导</th><th>引用的陈述</th><th>内容版本</th></tr></thead><tbody>${m.uses.map(u=>`<tr><td>${u.label}</td><td>${u.id==='order'?'原陈述':'派生陈述'}</td><td>${u.version} · ${esc(u.text)}</td></tr>`).join('')}</tbody></table></details></section>`;
}
function render(){
 $('#compare').innerHTML=renderPanel('A')+renderPanel('B');
 document.querySelectorAll('[data-scenario]').forEach(b=>b.classList.toggle('active',b.dataset.scenario===scenarioName));
 document.querySelectorAll('[data-phase]').forEach(b=>{b.classList.toggle('active',b.dataset.phase===phaseName);if(b.dataset.phase==='after')b.textContent=scenarioName==='cancel'?'3 取消后':'3 保存后';});
 $('#phase-note').textContent=phaseName==='edit'?'当前为未保存草稿。可在任一方案中改内容、调整范围，再保存或取消。':phaseName==='before'?'修改前，两种方案完全相同：一项订单陈述同时参与两步推导。':phaseName==='custom'?'你正在分别操作两个方案。上方步骤可随时恢复同步对照。':scenarioName==='cancel'?'取消后，陈述与推导引用都保持原样。':'当前显示保存后的结果。点卡片或下方入口，查看来历与所用版本。';
}
function sync(phase){phaseName=phase;states={A:IdentityDemo.scenario('A',scenarioName,phase),B:IdentityDemo.scenario('B',scenarioName,phase)};render();}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-view]');if(!b)return;
 if(b.dataset.scenario){scenarioName=b.dataset.scenario;sync('before');return;}
 if(b.dataset.phase){sync(b.dataset.phase);return;}
 if(b.id==='restart'){sync('before');return;}
 const panel=b.closest('[data-variant]');if(!panel)return;const v=panel.dataset.variant;
 if(b.dataset.view){states[v]=IdentityDemo.reduce(states[v],{type:'view',view:b.dataset.view});render();return;}
 if(b.dataset.action==='inspect'){panel.querySelector('.inspector').scrollIntoView({block:'nearest'});return;}
 if(b.dataset.action){states[v]=IdentityDemo.reduce(states[v],{type:b.dataset.action});phaseName='custom';render();}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg [data-view]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('change',e=>{const p=e.target.closest('[data-variant]');if(p&&e.target.dataset.scope){states[p.dataset.variant]=IdentityDemo.reduce(states[p.dataset.variant],{type:'scope',scope:e.target.dataset.scope,checked:e.target.checked});phaseName='custom';render();}});
document.addEventListener('input',e=>{const p=e.target.closest('[data-variant]');if(!p||!e.target.matches('[data-draft]'))return;const v=p.dataset.variant;states[v]=IdentityDemo.reduce(states[v],{type:'draft',text:e.target.value});p.querySelector('[data-action=save]').disabled=!states[v].scope.length||!states[v].draft.trim()||states[v].draft.trim()===IdentityDemo.original;});
window.IdentityDemoUI={sync,states:()=>states,diagram,model:IdentityDemo};
render();
</script>
</html>
