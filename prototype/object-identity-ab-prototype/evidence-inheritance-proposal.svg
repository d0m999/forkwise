<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310">
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#273a34}.muted{fill:#65776d}</style>
  <rect width="1000" height="310" rx="12" fill="#f6f7f3"/>
  <text x="30" y="39" font-size="21" font-weight="600">下一问：原有证据怎样带给新陈述？</text>
  <text x="765" y="38" font-size="13" class="muted">B 方案示意 · 尚待确认</text>
  <rect x="30" y="65" width="420" height="76" rx="9" fill="white" stroke="#cbd8cd"/>
  <text x="49" y="91" font-size="13" class="muted">原陈述 · 保留</text>
  <text x="49" y="120" font-size="20" font-weight="550">订单将增长</text>
  <rect x="550" y="65" width="420" height="76" rx="9" fill="#eaf3ee" stroke="#397566"/>
  <text x="569" y="91" font-size="13" class="muted">派生的新陈述</text>
  <text x="569" y="120" font-size="20" font-weight="550">订单将持平</text>
  <path d="M450 103 H550" fill="none" stroke="#97ac9c" stroke-dasharray="4 4"/>
  <text x="500" y="91" text-anchor="middle" font-size="12" class="muted">改写来历</text>
  <path d="M240 141 V192" fill="none" stroke="#397566" stroke-width="2"/>
  <rect x="166" y="153" width="148" height="25" fill="#f6f7f3"/>
  <text x="240" y="171" text-anchor="middle" font-size="13">原有关联：支持</text>
  <path d="M760 141 V192" fill="none" stroke="#97ac9c" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="654" y="153" width="212" height="25" fill="#f6f7f3"/>
  <text x="760" y="171" text-anchor="middle" font-size="13">与新陈述的关系：待确认</text>
  <rect x="30" y="192" width="420" height="70" rx="9" fill="white" stroke="#cbd8cd"/>
  <text x="49" y="219" font-size="16">公司新增订单公告</text>
  <text x="49" y="244" font-size="12" class="muted">旧证据及其原有关联继续保留</text>
  <rect x="550" y="192" width="420" height="70" rx="9" fill="white" stroke="#97ac9c" stroke-dasharray="5 4"/>
  <text x="569" y="219" font-size="16">来自原陈述的参考：同一份公告</text>
  <text x="569" y="244" font-size="12" class="muted">查看原引用；确认前不建立对新陈述的支持／反驳关联</text>
  <text x="30" y="292" font-size="13" class="muted">虚构例子：材料仍可参考，它对不同陈述的作用需要分别判断。</text>
</svg>
