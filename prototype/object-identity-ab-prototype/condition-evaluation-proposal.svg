  <rect x="30" y="225" width="480" height="145" rx="10" fill="white" stroke="#cbd8cd"/>
  <text x="50" y="253" font-size="13" class="muted">评估① · 第 2 季度披露前</text>
  <text x="50" y="286" font-size="21" font-weight="550">计算结果：等待观察</text>
