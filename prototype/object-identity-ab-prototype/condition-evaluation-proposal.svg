  <path d="M520 161 V192 H270 V225 M520 192 H770 V225" fill="none" stroke="#8aaa98" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="407" y="177" width="226" height="27" fill="#f6f7f3"/>
