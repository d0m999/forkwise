  <style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#273a34}.muted{fill:#65776d}</style>
  <rect width="1040" height="420" rx="12" fill="#f6f7f3"/>
