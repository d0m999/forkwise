<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="890" viewBox="0 0 1400 890"><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="1400" height="890" fill="#f6f7f3"/><text x="36" y="55" font-size="30" fill="#273a34" font-weight="650">只改一处，画布怎么变？</text><text x="36" y="91" font-size="17" fill="#65776d" font-weight="400">将“订单将增长”改为“订单将持平”，只用于收入推导；备货推导继续保留原内容。</text><text x="1142" y="52" font-size="14" fill="#65776d" font-weight="400">见岔 · A / B 待选草图</text><rect x="32" y="126" width="656" height="690" rx="14" fill="#fff" stroke="#d6e0d8"/><text x="59" y="169" font-size="24" fill="#273a34" font-weight="650">A  派生新对象</text><text x="59" y="203" font-size="15" fill="#65776d" font-weight="400">两个陈述身份，以“改写自”保留来历</text><svg x="60" y="224" width="600" height="436" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 436" role="img" aria-label="方案A的陈述与推导画布" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><defs><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#6d8d7c" stroke-width="1.5"/></marker><pattern id="dotsA" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#d9e2d8"/></pattern></defs><rect width="600" height="436" fill="#f9fbf8"/><rect width="600" height="436" fill="url(#dotsA)"/><path d="M151 171 V206 Q151 219 151 219 V306" fill="none" stroke="#397566" stroke-width="2" marker-end="url(#arrA)"/><rect x="66" y="224" width="170" height="32" rx="7" fill="#eaf3ee" stroke="#8bae9c"/><text x="151" y="245" text-anchor="middle" font-size="12.5" fill="#476759">推导① 收入 · 内容已改</text><path d="M449 171 V206 Q449 219 449 219 V306" fill="none" stroke="#82998d" stroke-width="2" marker-end="url(#arrA)"/><rect x="364" y="224" width="170" height="32" rx="7" fill="#fff" stroke="#d6e0d8"/><text x="449" y="245" text-anchor="middle" font-size="12.5" fill="#476759">推导② 备货</text><path d="M323 84 C303 35 297 35 277 84" fill="none" stroke="#90a899" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrA)"/><text x="300" y="31" text-anchor="middle" fill="#65776d" font-size="12">改写自</text><g data-view="current" role="button" tabindex="0" aria-label="用户 · 局部改写后的陈述：订单将持平"><rect x="25" y="59" width="252" height="112" rx="10" fill="#f0f7f2" stroke="#397566" stroke-width="1.7"/><text x="40" y="83" font-size="12" fill="#65776d">用户 · 局部改写后的陈述</text><text x="40" y="110" font-size="17" font-weight="550" fill="#273a34">订单将持平</text><text x="40" y="157" font-size="11.5" fill="#397566">待研究 · 查看改写来历</text></g><g data-view="original" role="button" tabindex="0" aria-label="用户 · 原陈述：订单将增长"><rect x="323" y="59" width="252" height="112" rx="10" fill="#fff" stroke="#cbd8cd" stroke-width="1.2"/><text x="338" y="83" font-size="12" fill="#65776d">用户 · 原陈述</text><text x="338" y="110" font-size="17" font-weight="550" fill="#273a34">订单将增长</text><text x="338" y="157" font-size="11.5" fill="#65776d">待研究 · 保留原内容</text></g><g ><rect x="25" y="306" width="252" height="104" rx="10" fill="#fff" stroke="#cbd8cd" stroke-width="1.2"/><text x="40" y="330" font-size="12" fill="#65776d">用户 · 结论</text><text x="40" y="357" font-size="17" font-weight="550" fill="#273a34">收入可能提高</text><text x="40" y="396" font-size="11.5" fill="#65776d">待研究 · 结论原文保留</text></g><g ><rect x="323" y="306" width="252" height="104" rx="10" fill="#fff" stroke="#cbd8cd" stroke-width="1.2"/><text x="338" y="330" font-size="12" fill="#65776d">用户 · 结论</text><text x="338" y="357" font-size="17" font-weight="550" fill="#273a34">需要增加备货</text><text x="338" y="396" font-size="11.5" fill="#65776d">待研究 · 结论原文保留</text></g></svg><line x1="59" y1="677" x2="661" y2="677" stroke="#d6e0d8"/><text x="59" y="710" font-size="18" fill="#273a34" font-weight="600">查看改写来历</text><text x="59" y="743" font-size="16" fill="#273a34" font-weight="400">原陈述 → 改写后的新陈述</text><text x="59" y="775" font-size="15" fill="#65776d" font-weight="400">此后分别研究；两个结论仍保留原文。</text><rect x="712" y="126" width="656" height="690" rx="14" fill="#fff" stroke="#d6e0d8"/><text x="739" y="169" font-size="24" fill="#273a34" font-weight="650">B  同一对象的不同版本</text><text x="739" y="203" font-size="15" fill="#65776d" font-weight="400">一个陈述身份，两步推导分别引用所用版本</text><svg x="740" y="224" width="600" height="436" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 436" role="img" aria-label="方案B的陈述与推导画布" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#6d8d7c" stroke-width="1.5"/></marker><pattern id="dotsB" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#d9e2d8"/></pattern></defs><rect width="600" height="436" fill="#f9fbf8"/><rect width="600" height="436" fill="url(#dotsB)"/><path d="M151 171 V206 Q151 219 151 219 V306" fill="none" stroke="#397566" stroke-width="2" marker-end="url(#arrB)"/><rect x="66" y="224" width="170" height="32" rx="7" fill="#eaf3ee" stroke="#8bae9c"/><text x="151" y="245" text-anchor="middle" font-size="12.5" fill="#476759">推导① 收入 · 内容已改</text><path d="M449 171 V206 Q449 219 449 219 V306" fill="none" stroke="#82998d" stroke-width="2" marker-end="url(#arrB)"/><rect x="364" y="224" width="170" height="32" rx="7" fill="#fff" stroke="#d6e0d8"/><text x="449" y="245" text-anchor="middle" font-size="12.5" fill="#476759">推导② 备货</text><rect x="13" y="27" width="574" height="161" rx="16" fill="none" stroke="#8aaa98" stroke-dasharray="5 4"/><rect x="186" y="14" width="228" height="24" rx="8" fill="#f9fbf8"/><text x="300" y="31" text-anchor="middle" fill="#397566" font-size="12.5">同一陈述，在两处使用不同版本</text><g data-view="current" role="button" tabindex="0" aria-label="用户 · 版本 2：订单将持平"><rect x="25" y="59" width="252" height="112" rx="10" fill="#f0f7f2" stroke="#397566" stroke-width="1.7"/><text x="40" y="83" font-size="12" fill="#65776d">用户 · 版本 2</text><text x="40" y="110" font-size="17" font-weight="550" fill="#273a34">订单将持平</text><text x="40" y="157" font-size="11.5" fill="#397566">用于收入推导 · 查看版本</text></g><g data-view="original" role="button" tabindex="0" aria-label="用户 · 版本 1：订单将增长"><rect x="323" y="59" width="252" height="112" rx="10" fill="#fff" stroke="#cbd8cd" stroke-width="1.2"/><text x="338" y="83" font-size="12" fill="#65776d">用户 · 版本 1</text><text x="338" y="110" font-size="17" font-weight="550" fill="#273a34">订单将增长</text><text x="338" y="157" font-size="11.5" fill="#65776d">用于备货推导 · 查看版本</text></g><g ><rect x="25" y="306" width="252" height="104" rx="10" fill="#fff" stroke="#cbd8cd" stroke-width="1.2"/><text x="40" y="330" font-size="12" fill="#65776d">用户 · 结论</text><text x="40" y="357" font-size="17" font-weight="550" fill="#273a34">收入可能提高</text><text x="40" y="396" font-size="11.5" fill="#65776d">待研究 · 结论原文保留</text></g><g ><rect x="323" y="306" width="252" height="104" rx="10" fill="#fff" stroke="#cbd8cd" stroke-width="1.2"/><text x="338" y="330" font-size="12" fill="#65776d">用户 · 结论</text><text x="338" y="357" font-size="17" font-weight="550" fill="#273a34">需要增加备货</text><text x="338" y="396" font-size="11.5" fill="#65776d">待研究 · 结论原文保留</text></g></svg><line x1="739" y1="677" x2="1341" y2="677" stroke="#d6e0d8"/><text x="739" y="710" font-size="18" fill="#273a34" font-weight="600">查看所用版本</text><text x="739" y="743" font-size="16" fill="#273a34" font-weight="400">版本 1「订单将增长」→ 用于备货推导</text><text x="739" y="775" font-size="15" fill="#65776d" font-weight="400">版本 2「订单将持平」→ 用于收入推导</text><text x="36" y="853" font-size="17" fill="#397566" font-weight="550">两种方案都可以显示两张内容卡。区别在于：它们是两项陈述，还是同一陈述的两份版本。</text></svg>