<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480">
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#273a34}.muted{fill:#65776d}</style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#8aaa98" stroke-width="1.5"/></marker></defs>
  <rect width="1100" height="480" rx="12" fill="#f6f7f3"/>
  <text x="30" y="42" font-size="24" font-weight="600">条件评估：判断标准可以是数值，也可以是文字</text>
  <text x="841" y="40" font-size="13" class="muted">Q17 · 执行分工提案，尚待确认</text>
  <text x="30" y="73" font-size="14" class="muted">条件对象保存本人定义的标准；评估过程负责依据材料判断，形成可追溯的记录。</text>
  <rect x="30" y="98" width="332" height="199" rx="12" fill="white" stroke="#d6e0d8"/>
  <rect x="384" y="98" width="332" height="199" rx="12" fill="white" stroke="#d6e0d8"/>
  <rect x="738" y="98" width="332" height="199" rx="12" fill="white" stroke="#d6e0d8"/>
  <text x="50" y="132" font-size="15" class="muted">明确的数值标准</text>
  <text x="404" y="132" font-size="15" class="muted">需要理解材料的标准</text>
  <text x="758" y="132" font-size="15" class="muted">两者结合的标准</text>
  <text x="50" y="167" font-size="19" font-weight="550">两季营收同比均 ≥ 10%</text>
  <text x="404" y="167" font-size="19" font-weight="550">主要客户是否出现转单迹象</text>
  <text x="758" y="167" font-size="19" font-weight="550">收入增长且竞争优势未削弱</text>
  <path d="M196 181 V205 M550 181 V205 M904 181 V205" stroke="#8aaa98" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="196" y="236" text-anchor="middle" font-size="21" font-weight="600">确定性工具</text>
  <text x="550" y="236" text-anchor="middle" font-size="21" font-weight="600">Agent 评估</text>
  <text x="904" y="236" text-anchor="middle" font-size="21" font-weight="600">Agent + 计算工具</text>
  <text x="196" y="271" text-anchor="middle" font-size="14" class="muted">校验口径、计算、比较</text>
  <text x="550" y="271" text-anchor="middle" font-size="14" class="muted">检查材料，解释依据与缺口</text>
  <text x="904" y="271" text-anchor="middle" font-size="14" class="muted">数值由工具算，综合意见由 Agent 提出</text>
  <path d="M196 297 V317 H904 V297 M550 297 V336" fill="none" stroke="#8aaa98" stroke-width="1.5"/>
  <path d="M550 322 V338" stroke="#8aaa98" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="160" y="347" width="780" height="67" rx="10" fill="#eaf3ee" stroke="#b3c9bb"/>
  <text x="550" y="375" text-anchor="middle" font-size="19" font-weight="550">独立评估记录：标准版本 · 材料引用 · 结果 · 理由 · 缺口</text>
  <text x="550" y="399" text-anchor="middle" font-size="14" class="muted">工具或 Agent 的结果待本人确认；本人也可直接作人工评估。</text>
  <text x="30" y="450" font-size="13" class="muted">标准不清晰时保留待澄清，不由 Agent 自行发明阈值。此图不决定 Agent 自动触发或数据访问范围。</text>
</svg>
