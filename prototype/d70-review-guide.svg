<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940">
  <title>查证与立场在同一窗口完成的交互建议</title>
  <desc>选中卡片打开查证与立场窗口，左侧查看查证摘要和按需展开的依据，右侧选择个人立场并填写理由。明确保存后返回画布，卡片立场标签更新。图中使用原型模拟材料，示例选择不代表实际用户判断。</desc>
  <defs>
    <style>
      text {font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#283c39;}
      .title {font-size:30px;font-weight:650;}
      .heading {font-size:24px;font-weight:650;}
      .body {font-size:20px;}
      .small {font-size:17px;fill:#677b76;}
      .label {font-size:18px;font-weight:600;}
      .arrow {stroke:#7d9f97;stroke-width:2;fill:none;marker-end:url(#arrow);}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7d9f97"/></marker>
  </defs>
  <rect width="1280" height="940" fill="#fafcfb"/>
  <text x="38" y="48" class="title">看依据、表达立场，在同一个窗口完成</text>
  <text x="38" y="80" class="small">操作示意 · 图中使用原型模拟材料，示例选择尚未保存</text>

  <rect x="38" y="103" width="220" height="52" rx="11" fill="#eef3f1"/>
  <text x="148" y="136" text-anchor="middle" class="body">① 选中卡片或推导</text>
  <path d="M270 129H310" class="arrow"/>
  <rect x="324" y="103" width="180" height="52" rx="11" fill="#256e66"/>
  <text x="414" y="136" text-anchor="middle" class="body" style="fill:#fff">查证与立场</text>
  <text x="532" y="136" class="small">直接点击卡片上的立场标签，也进入同一窗口。</text>

  <rect x="38" y="177" width="1204" height="608" rx="20" fill="#fff" stroke="#b4cbc4" stroke-width="2"/>
  <path d="M39 254H1241" stroke="#d9e4df"/>
  <text x="65" y="223" class="heading">② 查证与立场</text>
  <text x="1211" y="224" text-anchor="end" class="heading">×</text>
  <text x="65" y="290" class="small">当前对象</text>
  <text x="65" y="324" class="heading">外部大客户会把订单交给 Intel Foundry</text>
  <path d="M65 349H1215" stroke="#e1e8e4"/>
  <path d="M767 374V752" stroke="#e1e8e4"/>

  <text x="65" y="390" class="heading">查证发现了什么</text>
  <rect x="262" y="370" width="118" height="27" rx="6" fill="#eef3f1"/>
  <text x="321" y="389" text-anchor="middle" class="small">AI · 模拟</text>
  <rect x="65" y="415" width="674" height="119" rx="12" fill="#f0f5f3"/>
  <text x="85" y="449" class="heading">尚未确认，等待观察</text>
  <text x="85" y="483" class="body">当前材料尚无正式订单承诺，</text>
  <text x="85" y="512" class="body">不能确认这个预测已经落地。</text>

  <rect x="65" y="550" width="674" height="113" rx="12" fill="#fff" stroke="#d6e2dc"/>
  <text x="85" y="580" class="label">资料缺口 · 摘要</text>
  <text x="85" y="614" class="body">“外部客户尚未形成正式订单承诺。”</text>
  <text x="85" y="644" class="small">模拟官方季度披露</text>
  <rect x="569" y="622" width="150" height="29" rx="6" fill="#eef5f2"/>
  <text x="644" y="643" text-anchor="middle" class="small" style="fill:#256e66">查看来源原文 ↗</text>

  <text x="85" y="698" class="body">▸ 展开其他依据、范围和时间</text>
  <rect x="65" y="719" width="143" height="37" rx="8" fill="#fff" stroke="#bbd0c8"/>
  <text x="136" y="744" text-anchor="middle" class="small" style="fill:#256e66">重新查证</text>
  <text x="229" y="744" class="small">依据区可滚动，右侧立场区保持可见。</text>

  <text x="794" y="390" class="heading">我怎么看</text>
  <text x="794" y="425" class="small">已保存的立场</text>
  <rect x="942" y="404" width="93" height="29" rx="8" fill="#edf0f3"/>
  <text x="988" y="425" text-anchor="middle" class="small">待研究</text>
  <text x="794" y="459" class="label">本次选择（未保存）</text>

  <rect x="794" y="475" width="200" height="45" rx="10" fill="#fff" stroke="#d3ded9"/>
  <text x="894" y="504" text-anchor="middle" class="body" style="fill:#647382">待研究</text>
  <rect x="1006" y="475" width="200" height="45" rx="10" fill="#fff" stroke="#d3ded9"/>
  <text x="1106" y="504" text-anchor="middle" class="body" style="fill:#286c4b">认可</text>
  <rect x="794" y="531" width="200" height="45" rx="10" fill="#fff1dd" stroke="#bc7b25" stroke-width="2"/>
  <text x="894" y="560" text-anchor="middle" class="body" style="fill:#915c15">✓ 质疑</text>
  <rect x="1006" y="531" width="200" height="45" rx="10" fill="#fff" stroke="#d3ded9"/>
  <text x="1106" y="560" text-anchor="middle" class="body" style="fill:#a04747">不认可</text>

  <text x="794" y="606" class="label">我具体质疑什么（必填）</text>
  <rect x="794" y="620" width="412" height="72" rx="10" fill="#fff" stroke="#bdcec6"/>
  <text x="811" y="649" class="body">还没有正式订单承诺，</text>
  <text x="811" y="677" class="body">我想继续观察客户公告。</text>

  <rect x="941" y="719" width="88" height="40" rx="9" fill="#fff" stroke="#c4d3cc"/>
  <text x="985" y="746" text-anchor="middle" class="body">取消</text>
  <rect x="1041" y="719" width="165" height="40" rx="9" fill="#256e66"/>
  <text x="1123" y="746" text-anchor="middle" class="body" style="fill:#fff">保存立场</text>

  <path d="M1123 791V817H983" class="arrow"/>
  <rect x="642" y="807" width="326" height="58" rx="12" fill="#fff" stroke="#bbd0c8"/>
  <text x="662" y="843" class="body">③ 回画布，标签更新为</text>
  <rect x="879" y="821" width="70" height="30" rx="8" fill="#fff1dd"/>
  <text x="914" y="842" text-anchor="middle" class="small" style="fill:#915c15">质疑</text>
  <text x="38" y="834" class="body">可以只看查证，也可以直接表达立场。</text>
  <text x="38" y="904" class="small">查证结果与个人立场分别记录；新结果出现时，保留你已保存的立场及未保存的输入。</text>
</svg>
