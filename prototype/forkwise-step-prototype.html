<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>见岔（Forkwise）｜一次研究的交互原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='6'%20fill='%23ffffff'/%3E%3Cpath%20d='M11%208%20v16%20M11%2016%20l10%20-6%20M11%2016%20l10%206'%20stroke='%23276e68'%20stroke-width='2.4'%20fill='none'%20stroke-linecap='round'/%3E%3C/svg%3E">
<!--
  临时交互原型：默认观点自动重建、公开资料查证、审阅编辑。预设四场景为次级演示。
  验证用户能否从材料组织自己的主张、推导、判断与依据。不是生产实现。
  Design plan: cool paper / white / slate / teal / ochre; PingFang SC body;
  D55–D59: collapsible project navigation, central input, persistent research entries,
  one free canvas with on-demand source/check/history/baseline windows.
  The graph is the visual center; source and object windows never reserve columns.
  Reviewed against brief: no dashboard metrics, decorative gradients or card grid.
  Inline icon paths use a small Lucide-style subset. Excalidraw and its assets are
  bundled locally. Production React / React Flow selection remains unchanged.
-->
<style>
:root {
  --paper:#f2f5f7; --white:#ffffff; --ink:#253749; --muted:#687b8e;
  --line:#dce4eb; --line-strong:#bbc9d6; --accent:#276e68; --accent-soft:#eaf4f1;
  --ochre:#926219; --ochre-soft:#fbf3e3; --slate-soft:#edf1f7; --danger:#a44846;
  --dot:#d4dfe7; --overlay:rgba(25,43,59,.3); --shadow:0 12px 48px rgba(25,43,59,.14);
  --r:8px; --r-lg:12px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --tiny:11px; --small:12px; --body:13px; --large:16px; --title:22px;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:var(--body)/1.65 var(--font);background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:var(--r);background:var(--white);padding:7px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button.primary{background:var(--accent);color:var(--white);border-color:var(--accent)}
button.primary:hover:not(:disabled){background:var(--ink)}
button.quiet{border-color:transparent;background:transparent}
button.small{font-size:var(--small);padding:4px 8px}
svg.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.badge svg.icon{width:16px;height:16px}
h1,h2,h3,p{margin:0} h1{font-size:var(--title);font-weight:600;line-height:1.5}
h2{font-size:var(--large);font-weight:600} h3{font-size:var(--body);font-weight:600}
.muted{color:var(--muted)} .tiny{font-size:var(--tiny)} .smalltext{font-size:var(--small)}
.row{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.between{justify-content:space-between} .stack{display:grid;gap:var(--s3)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:4px;background:var(--slate-soft);padding:2px 6px;font-size:var(--tiny);line-height:1.6}
.badge.ai,.badge.warning{color:var(--ochre);background:var(--ochre-soft)}
.badge.mine,.badge.selected{color:var(--accent);background:var(--accent-soft)}
.notice{padding:var(--s3);border-left:3px solid var(--ochre);background:var(--ochre-soft);font-size:var(--small)}
.notice.teal{border-color:var(--accent);background:var(--accent-soft)}
.topbar{height:58px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 var(--s5);gap:var(--s4)}
.brand{font-size:19px;font-weight:600;letter-spacing:1px;display:flex;align-items:center;gap:10px}
.brand span{font-family:Georgia,serif;font-size:17px;letter-spacing:0;font-weight:400;color:var(--muted)}
.brandmark{width:24px;height:26px;display:block;position:relative;border-left:2px solid var(--accent)}
.brandmark:before,.brandmark:after{content:"";position:absolute;width:15px;height:12px;border-top:2px solid var(--accent);left:0;top:12px;transform:rotate(-32deg);transform-origin:left}
.brandmark:after{transform:rotate(32deg)}
.prototype-label{font-size:var(--small);color:var(--muted)}
.scenario-bar{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:7px var(--s5);border-bottom:1px solid var(--line);background:var(--white)}
.reading-key{display:flex;align-items:center;gap:var(--s4);font-size:var(--small);color:var(--muted)}
.reading-key b{color:var(--ink);font-weight:500}
.scenario-tabs{display:flex;gap:var(--s2);flex-wrap:wrap}
.scenario{padding:5px 12px;background:transparent;border-color:transparent;color:var(--muted)}
.scenario.active{background:var(--white);border-color:var(--line-strong);color:var(--ink)}
.scenario .number{border:1px solid var(--line-strong);border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:var(--tiny)}
.scenario.active .number{background:var(--accent);border-color:var(--accent);color:var(--white)}
.workspace{display:grid;grid-template-columns:202px minmax(420px,1fr) 344px;height:calc(100dvh - 112px);min-height:640px}
.sidebar{border-right:1px solid var(--line);padding:var(--s5) var(--s4);display:flex;flex-direction:column;gap:var(--s5);background:var(--white);overflow:auto}
.side-heading{font-size:var(--tiny);color:var(--muted);margin-bottom:var(--s2)}
.project{display:block;text-align:left;padding:var(--s3);width:100%;border-color:var(--line);background:var(--slate-soft)}
.project strong{display:block;font-weight:600}
.nav-item{display:flex;text-align:left;justify-content:space-between;width:100%;margin:2px 0;padding:8px;background:transparent;border:1px solid transparent}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item .icon{width:20px}
.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:var(--s4)}
.side-bottom p{margin-top:8px}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.research-header{padding:var(--s4) var(--s5) var(--s3);border-bottom:1px solid var(--line);background:var(--white)}
.research-header .row{margin-top:var(--s3)}
.research-header .subtitle{margin-top:4px;max-width:64ch;color:var(--muted);font-size:var(--small)}
.canvas-shell{display:flex;flex-direction:column;min-height:0;flex:1;position:relative}
.canvas-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);padding:10px var(--s4);font-size:var(--small)}
.legend{display:flex;gap:var(--s2);flex-wrap:wrap}
.viewport{position:relative;flex:1;min-height:250px;overflow:hidden;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:20px 20px;touch-action:none;cursor:grab}
.world{position:absolute;width:980px;height:600px;transform-origin:0 0;cursor:default}
.connections{position:absolute;inset:0;width:980px;height:600px;overflow:visible}
.connections path{fill:none;stroke:var(--line-strong);stroke-width:2}
.connections path.independent{stroke:var(--accent);stroke-dasharray:5 4}
.connections path.affected{stroke:var(--ochre);stroke-dasharray:6 5}
.edge-label{fill:var(--muted);font:12px var(--font)}
.graph-node{position:absolute;width:230px;min-height:124px;padding:13px 15px;text-align:left;display:block;white-space:normal;border:1px solid var(--line-strong);border-radius:var(--r-lg);background:var(--white)}
.graph-node:hover:not(:disabled){background:var(--white)}
.graph-node.is-selected{border:2px solid var(--accent);padding:12px 14px}
.graph-node.inference{width:204px;min-height:96px;border-style:dashed;border-radius:var(--r);background:var(--slate-soft)}
.graph-node.inference.is-selected{border-style:solid}
.graph-node.result{width:242px;border-left:4px solid var(--accent)}
.graph-node.result.is-selected{border-left-width:4px;padding-left:12px}
.graph-node.affected{border-color:var(--ochre);background:var(--ochre-soft)}
.graph-node.dim{opacity:.38}
.node-head{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:13px;color:var(--muted);margin-bottom:7px}
.node-head .badge{font-size:12px}
.node-title{font-size:18px;font-weight:500;line-height:1.55;margin:0 0 10px}
.node-foot{display:flex;align-items:center;justify-content:space-between;gap:3px;font-size:12px;color:var(--muted)}
.coach-target{outline:3px solid var(--accent);outline-offset:5px}
.node-hint{position:absolute;left:0;top:-34px;background:var(--accent);color:var(--white);font-size:14px;line-height:1.6;padding:3px 10px;border-radius:var(--r);white-space:nowrap}
.node-foot .badge{background:transparent;padding:0}
.graph-group{position:absolute;left:22px;top:53px;width:274px;height:336px;border:1px dashed var(--line-strong);border-radius:var(--r-lg);pointer-events:none}
.graph-group span{position:absolute;top:-11px;left:12px;background:var(--paper);font-size:var(--small);padding:0 8px;color:var(--muted)}
.canvas-toolbar{position:absolute;left:var(--s4);bottom:var(--s3);display:flex;gap:3px;padding:4px;border:1px solid var(--line);border-radius:var(--r);background:var(--white)}
.canvas-toolbar button{padding:4px 7px;border-color:transparent}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}
.empty-inner{background:var(--white);border:1px solid var(--line);padding:var(--s6);width:390px;border-radius:var(--r-lg)}
.empty-inner h2{font-size:20px;margin-bottom:var(--s2)} .empty-inner p{margin-bottom:var(--s5)}
.preview-banner,.history-banner{margin:0 var(--s4) var(--s2);display:flex;align-items:center;justify-content:space-between;gap:var(--s3);font-size:var(--small);background:var(--ochre-soft);border:1px solid var(--line);padding:10px 12px;border-radius:var(--r)}
.history-banner{background:var(--slate-soft)}
.guide{border-bottom:1px solid var(--line);border-left:4px solid var(--accent);background:var(--accent-soft);padding:var(--s3) var(--s5);max-height:200px;overflow:auto;flex-shrink:0}
.guide h3{font-size:var(--large)}
.guide .guide-text{margin:4px 0 0;color:var(--ink);font-size:var(--body)}
.coach-row{display:flex;justify-content:space-between;align-items:center;gap:var(--s4)}
.coach-copy{max-width:54ch}.coach-next{flex-shrink:0;padding:10px 16px}
.inline-result{margin-top:4px;color:var(--accent);font-size:var(--small)}
.panel-section details,.panel-content>details{border-top:1px solid var(--line);padding-top:var(--s3)}
.panel-content>details>summary{color:var(--ink);font-size:var(--body)}
.panel-content>details[open]{display:grid;gap:var(--s2)}
.explore-tools{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.explore-tools button{white-space:normal}
.guide .checks{display:flex;gap:var(--s4);flex-wrap:wrap;margin:8px 0;color:var(--muted);font-size:var(--small)}
.guide .checks span{border-bottom:1px solid var(--line);padding-bottom:4px}
.state-line{border-top:1px solid var(--line);padding:6px var(--s4);font-size:var(--tiny);display:flex;justify-content:space-between;gap:10px;background:var(--white)}
.inspector{background:var(--white);border-left:1px solid var(--line);overflow:hidden;min-width:0;display:flex;flex-direction:column}
.inspector-header{padding:var(--s5) var(--s5) var(--s4);flex-shrink:0}
.inspector-header h2{font-size:18px;line-height:1.6;margin:8px 0}
.panel-tabs{display:flex;border-bottom:1px solid var(--line);padding:0 var(--s4);gap:var(--s2);flex-shrink:0}
.panel-tabs button{border:0;border-radius:0;padding:10px 12px;background:transparent;color:var(--muted);border-bottom:2px solid transparent}
.panel-tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.panel-content{padding:var(--s5);display:grid;gap:var(--s5);overflow:auto;min-height:0}
.panel-section{display:grid;gap:var(--s2)}
.field-label{font-size:var(--small);color:var(--muted);display:block;margin:0 0 4px}
textarea,input[type=text],select{width:100%;border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 10px;background:var(--white)}
textarea{min-height:78px;resize:vertical;line-height:1.65}
.stance-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stance-grid button{padding:6px 2px;font-size:var(--small)}
.stance-grid button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.evidence-card{border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);display:grid;gap:7px}
.evidence-card p{font-size:var(--small)}
.evidence-card .quote{border-left:2px solid var(--line-strong);padding-left:10px}
.error{color:var(--danger);font-size:var(--small)}
.history-row{border-left:2px solid var(--line);padding-left:var(--s3);display:grid;gap:5px;margin-bottom:var(--s4)}
.question{border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);display:grid;gap:6px}
.question p{font-size:var(--small)}
.hidden{display:none!important}
dialog{border:1px solid var(--line);border-radius:var(--r-lg);padding:0;max-width:calc(100vw - 40px);width:780px;max-height:86dvh;box-shadow:var(--shadow)}
dialog::backdrop{background:var(--overlay)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:var(--s4) var(--s5);border-bottom:1px solid var(--line);gap:var(--s3)}
.dialog-body{padding:var(--s5);overflow:auto;max-height:70dvh}
.dialog-body>p{margin-bottom:var(--s4)}
.dialog-foot{border-top:1px solid var(--line);padding:var(--s4) var(--s5);display:flex;justify-content:flex-end;gap:var(--s2)}
.source-page{border:1px solid var(--line);padding:var(--s5);background:var(--paper);margin:var(--s4) 0}
.source-page p{margin:var(--s3) 0;font-size:14px;line-height:1.9}
mark{background:var(--ochre-soft);color:var(--ink);padding:2px}
.metadata{display:grid;grid-template-columns:130px 1fr;gap:6px;font-size:var(--small)}
.metadata dt{color:var(--muted)}.metadata dd{margin:0}
.compare-table{border-collapse:collapse;width:100%;font-size:var(--small)}
.compare-table th,.compare-table td{border-bottom:1px solid var(--line);padding:12px;text-align:left;vertical-align:top}
.compare-table th{background:var(--paper);font-weight:500}
.compare-table th:first-child{width:100px}
.diff{color:var(--ochre);background:var(--ochre-soft)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:10px 18px;border-radius:var(--r);box-shadow:var(--shadow);max-width:80vw;z-index:10}
details summary{cursor:pointer;color:var(--muted);font-size:var(--small)}

@media(max-width:880px){.workspace{grid-template-columns:minmax(0,1fr);height:auto;min-height:0}.sidebar{display:none}.stage{min-height:720px}.inspector{border-left:0;border-top:1px solid var(--line)}.viewport{min-height:350px}.topbar{padding:0 var(--s4)}.scenario-bar{padding:8px var(--s3);flex-wrap:wrap}.brand span{display:none}.scenario-tabs{gap:0}.scenario{font-size:var(--small)}.research-header{padding-top:var(--s4)}.prototype-label{font-size:var(--tiny)}.guide{max-height:none}.panel-content{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.state-line{flex-wrap:wrap}}

@media(max-width:880px){.coach-row{align-items:flex-start;flex-wrap:wrap}.coach-next{width:100%}.reading-key{gap:8px;flex-wrap:wrap}.guide{max-height:none}.prototype-label{display:none}.empty-inner{max-width:calc(100% - 32px)}}

        target.title=pair[1].trim();target.origin=target.title===pair[0]?'AI 推断':'我的改写';
        target.version++;target.stance='待研究';target.reason='';target.checked=false;target.stanceAt=null;
      }
      for(const id of ['p2','i1','c1'])s.branches.b[id].evidence=s.branches.b[id].evidence.map(e=>({...e,rel:'尚待判断',why:'源版本引用已保留，新假设下的作用待审阅；原关系为 '+e.rel+'。'}));
      s.branch='b';s.preview=null;s.walkStep=7;saveEdit(s,'保存临时假设为个人条件路径 B',a.at);s.message='另一条路径已保存，原路径 A 保留。现在可以并排比较它们。';break;
    case 'branch':
      if(s.branches[a.branch]){s.branch=a.branch;s.preview=null;s.selected='p2';}
      break;
    case 'view-branch':if(s.view?.snapshot.branches[a.branch])s.view.snapshot.branch=a.branch;break;
    case 'collapse':s.collapsed=!s.collapsed;break;
    case 'ai-question':
      if(!s.imported)break;
      if(!s.questions.some(q=>q.target===s.selected&&q.version===n.version&&q.branch===s.branch))
        s.questions.push({target:s.selected,version:n.version,branch:s.branch,status:'检查问题',at:a.at,origin:'AI（模拟）',text:s.selected==='p3'?'库存余额下降来自销售回款、跌价还是转销？还缺现金影响的勾稽资料。':'收入兑现是否也带来当期回款？资本开支与营运资金变化的条件是否齐全？',basis:s.selected==='p3'?['e3']:['e1','e2']});
      s.guide=true;s.message='已显示模拟 AI 检查问题，未改变立场与核对状态。';break;
    case 'defer-question':
      const q=s.questions[a.index];if(q)q.status='待查问题';s.message='问题留待查，可继续研究；跳过不表示已核对或认可。';break;
    case 'import-report':
      if(!editable(s))break;
      if(!s.newReport){s.newReport=true;s.walkStep=9;s.branch='a';s.selected='p2';s.inspecting=true;s.materials.push('e4');s.review.p2=true;s.review.i1=true;s.tab='updates';s.message='新报告已加入，资本开支前提需要重新看看；你的原判断还没变。';}
      else s.message='这份模拟报告已导入，不重复生成事件。';break;
    case 'accept-evidence':
      if(!editable(s)||!s.newReport||s.accepted)break;
      mutateReady(s);
      s.branches.a.p2.evidence.push({id:'e4',rel:'限定',why:'一期比例升至 18%，削弱稳定假设的依据；仍缺连续观察期间。'});
      s.accepted=true;s.walkStep=10;saveEdit(s,'将模拟新报告关联到路径 A 前提，立场不变',a.at);
      s.message='只采用了证据关联；个人立场、条件结论与两项复核仍待本人处理。';break;
    case 'confirm-condition':
      if(!editable(s)||!s.newReport)break;
      mutateReady(s);s.conditions.a={status:'等待观察',by:'本人确认；复用 AI（模拟）理由',at:a.at,reason:'仅有一期高于模拟阈值 15%，仍缺另一连续期间。',basis:['e2','e4']};
      saveEdit(s,'人工确认路径 A 条件需等待观察',a.at);s.message='已记录人工条件结论；不改变主张或推导的个人立场。';break;
    case 'finish-review':
      if(!editable(s)||!s.newReport)break;
      if(a.result==='稍后处理'){s.reviewResults[a.target]={result:a.result,reason:a.reason,at:a.at};s.message='稍后处理：这项需复核提醒继续保留。';break;}
      if(!a.reason.trim()){s.error='完成复核需填写本次维持或修订的具体理由。';break;}
      if(a.result==='修订判断'&&['质疑','不认可'].includes(a.stance)&&!a.reason.trim())break;
      mutateReady(s);
      if(a.result==='修订判断'){const target=s.branches.a[a.target];target.stance=a.stance;target.reason=a.reason.trim();target.stanceAt=a.at;}
      s.review[a.target]=false;s.reviewResults[a.target]={result:a.result,reason:a.reason.trim(),at:a.at};
      saveEdit(s,'完成 '+a.target+' 的复核：'+a.result,a.at);s.message='仅完成这一项复核；其他待复核项继续保留。';break;
    case 'record':
      if(!editable(s))break;
      s.judgments.push({name:'历史判断 '+(s.judgments.length+1),at:a.at,reason:a.reason.trim()||'本人主动记录当前研究判断',snapshot:snapshot(s)});
      s.message='已主动记录这次判断；当时的内容、立场和材料版本固定保存于本次页面。';break;
    case 'view-edit':s.view=copy(s.edits[a.index]);s.preview=null;s.selected='p2';s.inspecting=true;if(s.walkStep===10)s.walkStep=11;break;
    case 'view-judgment':s.view=copy(s.judgments[a.index]);s.preview=null;s.selected='p2';break;
    case 'exit-history':s.view=null;if(s.walkStep===11)s.walkStep=12;break;
    case 'move':
      if(!editable(s))break;
      mutateReady(s);s.branches[s.branch][a.id].x=a.x;s.branches[s.branch][a.id].y=a.y;
      saveEdit(s,'调整当前路径的画布布局',a.at);break;
    case 'undo':
      if(!editable(s)||!s.undo.length)break;
      const acquired=copy(s.materials),hadReport=s.newReport,previous=s.undo.pop();
      Object.assign(s,previous);s.materials=[...new Set([...s.materials,...acquired])];
      if(hadReport&&!previous.newReport){s.newReport=true;s.review={p2:true,i1:true};s.reviewResults={};}
      saveEdit(s,'撤销上一次研究修改',a.at);s.preview=null;s.message='已撤销上一次修改，已取得材料与历史判断记录仍保留。';break;
  }
  return s;
}
</script>
<script>
// Thin rendering shell. All state-changing research actions go through reduce().
let state=seed(),camera={x:20,y:20,scale:.8},modal=null,toastTimer=null,drag=null,inspectorContext='';
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>'<svg class="icon" aria-hidden="true"><use href="#i-'+name+'"></use></svg>';
const btn=(label,action,extra='',cls='')=>'<button class="'+cls+'" data-action="'+action+'" '+extra+'>'+label+'</button>';
const now=()=>new Date().toLocaleString('zh-CN',{hour12:false});
const activeNode=()=>graph(state)[state.selected];
const canEdit=()=>editable(state);
const statusIcon=value=>value==='认可'?'check':value==='待研究'?'circle':'help';
function dispatch(action){
  state=reduce(state,{at:now(),...action});render();
  if(state.message)toast(state.message);
}
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),5200);}
function render(){
  const d=displayed(state),g=graph(state),n=g[state.selected],disabled=!canEdit()?'disabled':'';
  $('sidebar').innerHTML='<section><div class="side-heading">研究项目</div>'+btn('<strong>INTC · 现金流</strong><span class="tiny muted">模拟研究案例</span>','fit','','project')+'</section>'+
    '<section><div class="side-heading">研究资料</div>'+btn(icon('file')+'<span>已导入材料</span><span class="tiny">'+d.materials.length+'</span>','materials','','nav-item')+'</section>'+
    (state.adopted?'<section><div class="side-heading">我的研究路径</div>'+btn(icon('branch')+'A · 原来的假设',state.view?'view-branch':'branch','data-branch="a"','nav-item'+(d.branch==='a'?' active':''))+
    (d.branches.b?btn(icon('branch')+'B · 另一种可能',state.view?'view-branch':'branch','data-branch="b"','nav-item'+(d.branch==='b'?' active':'')):'<p class="tiny muted">保存另一种可能后出现在这里。</p>')+'</section>':'')+
    (state.adopted?'<section><div class="side-heading">研究记录</div>'+btn(icon('clock')+'查看旧版本','history','','nav-item')+(d.questions.length?btn(icon('help')+'待查问题 <span class="tiny">'+d.questions.filter(q=>q.status==='待查问题').length+'</span>','questions','','nav-item'):'')+'</section>':'')+
    '<div class="side-bottom"><span class="badge warning">受控模拟材料</span><p class="tiny muted">沿用研究标的，论证、数字及作者文本均为编写示例。</p><p class="tiny muted">本原型只保留本次页面中的状态，关闭或刷新后重置。</p></div>';
  $('research-tools').innerHTML='<span class="smalltext muted">'+(state.view?'正在查看旧版本':state.adopted?'我的研究 · '+(d.branch==='a'?'原路径 A':'另一条路径 B'):state.imported?'从材料整理出的图，还没有表达我的态度':'先读材料，再看它怎样变成推理图')+'</span>'+
    (d.branches.b?btn('比较两条路径','compare','','small'):'');
  $('toggle-guide').innerHTML=state.guide?'收起提示，自由操作':'开启操作提示';
  $('toggle-guide').disabled=!state.imported;
  $('canvas-caption').textContent=state.view?'历史回看 · 当时的材料版本':state.adopted?'个人草稿 · '+(state.branch==='a'?'路径 A':'路径 B'):state.imported?'作者候选图 · 待审阅':'自由画布';
  $('view-banner').innerHTML=state.view?'<div class="history-banner"><span>'+esc(state.view.name)+'：'+esc(state.view.why||state.view.reason)+'<br><span class="muted">后来的报告不倒灌；此视图只读。</span></span>'+btn('返回当前研究','exit-history','','small')+'</div>':
    state.preview?'<div class="preview-banner"><span><strong>假设预览，尚未保存</strong>：原判断没变。<br>资本开支这一项支持受影响；库存路径仍保留。</span><div class="row">'+btn('退出预览','exit-preview','','small')+(!state.guide?btn('审阅并保存路径 B','branch-dialog',disabled,'primary small'):'')+'</div></div>':'';
  renderGraph();
  $('empty').classList.toggle('hidden',state.imported);
  $('empty').innerHTML='<div class="empty-inner"><h2>跟着做一遍研究</h2><p class="muted">先读一段作者观点，再把它变成图。<br>你会点图查依据、试一种不同假设，<br>最后看新报告影响了什么。</p>'+btn('开始这次研究','start-research','','primary')+'<p class="tiny muted" style="margin:14px 0 0">使用模拟材料；每一步都有具体操作提示。</p></div>';
  $('canvas-toolbar').innerHTML=btn('−','zoom-out','aria-label="缩小"','small')+'<span class="tiny muted" style="padding:5px">'+Math.round(camera.scale*100)+'%</span>'+btn('+','zoom-in','aria-label="放大"','small')+btn('全图','fit','','small')+btn(state.collapsed?'展开前提':'折叠前提','collapse',state.imported?'':'disabled','small')+btn('撤销','undo',canEdit()&&state.undo.length?'':'disabled','small');
  $('canvas-toolbar').classList.toggle('hidden',!state.imported);
  renderGuide();
  $('guide').classList.toggle('hidden',!state.guide||!state.imported);
  $('state-line').innerHTML='<span>'+esc(state.view?'历史只读 · 当时 '+d.materials.length+' 份材料':state.adopted?'草稿保存在本次页面中':state.imported?'候选尚未收录':'等待导入')+(state.view?'':' · '+state.edits.length+' 个编辑版本 · '+state.judgments.length+' 次主动判断记录')+'</span><span>拖动空白平移，选中主张或整步推导</span>';
  renderInspector();
}
function curve(x1,y1,x2,y2){return 'M '+x1+' '+y1+' C '+(x1+70)+' '+y1+', '+(x2-70)+' '+y2+', '+x2+' '+y2;}
function renderGraph(){
  if(!state.imported){$('world').innerHTML='';return;}
  const g=graph(state),p=g.p1,q=g.p2,j=g.i1,c=g.c1,r=g.p3,k=g.i2;
  const links=[
    [p.x+230,p.y+50,j.x,j.y+40,''],[q.x+230,q.y+50,j.x,j.y+60,''],
    [j.x+204,j.y+50,c.x,c.y+48,state.preview?'affected':''],
    [r.x+230,r.y+50,k.x,k.y+40,'independent'],[k.x+204,k.y+40,c.x+70,c.y+112,'independent']
  ];
  let svg='<svg class="connections" viewBox="0 0 980 600" aria-hidden="true"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" style="fill:var(--line-strong);stroke:none"/></marker></defs>';
  links.forEach((l,i)=>{if(state.collapsed&&i<2)return;svg+='<path d="'+curve(...l.slice(0,4))+'" class="'+l[4]+'" marker-end="url(#arrow)"/>';});
  svg+='<text class="edge-label" x="'+(j.x+215)+'" y="'+(j.y+35)+'">'+(state.preview?'联合支持受影响':'可能支持')+'</text><text class="edge-label" x="'+(k.x+215)+'" y="'+(k.y+23)+'">独立支持仍保留</text></svg>';
  let html=svg+(state.collapsed?'':'<div class="graph-group" aria-hidden="true"></div>');
  Object.values(g).forEach(n=>{
    if(state.collapsed&&['p1','p2'].includes(n.id))return;
    const affected=state.preview&&['p2','i1'].includes(n.id);
    const target=state.guide&&!state.walkDone&&!state.view&&(state.walkStep===1?'p1':state.walkStep===3?'i1':state.walkStep===5?'p2':null);
    const cls='graph-node'+(n.kind.includes('推导')?' inference':'')+(n.kind==='结论'?' result':'')+(state.inspecting&&state.selected===n.id?' is-selected':'')+(affected?' affected':'')+(n.id===target?' coach-target':'');
    const evidence=n.evidence.length;
    html+='<button class="'+cls+'" data-action="select" data-id="'+n.id+'" data-node="'+n.id+'" style="left:'+n.x+'px;top:'+n.y+'px" aria-label="'+esc(n.kind+'：'+n.title)+'" aria-pressed="'+(state.selected===n.id)+'">'+
      (n.id===target?'<div class="node-hint">'+(state.walkStep===1?'先点这句话':state.walkStep===3?'再点这一步推导':'试着改变这项假设')+'</div>':'')+
      '<div class="node-head"><span>'+esc(n.kind==='前提'?'理由 / 前提':n.kind==='结论'?'可能的结果':n.kind)+'</span><span class="badge '+(n.origin==='AI 推断'?'ai':n.origin==='我的改写'?'mine':'')+'">'+esc(n.origin)+'</span></div>'+
      '<div class="node-title">'+esc(n.title)+'</div><div class="node-foot">'+(state.adopted?'<span class="badge">'+icon(statusIcon(n.stance))+esc(n.stance)+'</span>':'<span>点击查看依据</span>')+'<span>'+evidence+' 条证据</span></div>'+
      (affected?'<div class="tiny" style="color:var(--ochre);margin-top:7px">假设范围 · 原立场未变</div>':'')+
      (displayed(state).branch==='a'&&displayed(state).review[n.id]?'<div class="tiny" style="color:var(--ochre);margin-top:7px">需复核 · 独立于个人立场</div>':'')+'</button>';
  });
  $('world').innerHTML=html;applyCamera();
}
function renderGuide(){
  const step=state.walkStep;
  let title='',text='',label='',action='',extra='';
  const tasks={
    1:['现在，点图中左上角那句话','点“新增订单能够兑现为收入”。右侧会显示它来自哪份材料。','点选这句话','select','data-id="p1"'],
    2:['这句话的依据在哪里？','右侧显示作者的原话。打开原文，看看它表达的是预期，还是已经发生的事实。','打开对应原文','source','data-evidence="e1"'],
    3:['再看：两项理由怎样推到结论','点图中间的“联合推导”。这次右侧检查的是整步推导，不是单独一句话。','点选中间的推导','select','data-id="i1"'],
    4:['这一步仍有需要查证的地方','右侧显示：这段推导由 AI 补足，没有直接证据。可以保留缺口，再纳入个人研究；这不表示你认可它。',state.adopted?'继续：试一种不同假设':'纳入我的研究，保留待研究',state.adopted?'walk-next':'adopt',state.adopted?'data-step="5"':''],
    5:['如果资本开支持续上升呢？','暂时把“资本开支不持续上升”这个前提拿掉。图会指出受影响的支持，你原来的判断不会改变。',state.branches.b?'比较已经保存的两条路径':'试一下：前提不成立',state.branches.b?'compare':'preview',''],
    6:['看图：一条支持变了，另一条还在','黄色部分表示联合支持受影响；下方库存路径仍保留。先审阅拟改的三句话，再决定是否保存另一种可能。','审阅并保存另一种可能','branch-dialog',''],
    7:['另一条路径已经保存','左侧多了路径 B，路径 A 保留。现在并排看：前提、推导、结果和证据分别有什么不同。','并排比较两条路径','compare',''],
    8:['接下来，加入一份新报告','手动导入模拟报告。右侧会显示资本开支从 13% 到 18% 的变化，并提示哪些内容需要重新检查。','手动导入新报告','import-report',''],
    9:['新报告影响的是这项前提','右侧列出变化和出处。你可以把新证据关联到原路径的资本开支前提，暂时保留原判断。','把新证据挂到这项前提','accept-evidence',''],
    10:['新证据已加上，个人判断没有变','条件仍未确认，前提和推导仍需复核。先看更新前的版本，确认旧内容与旧材料还保留着。','查看更新前的版本','oldest',''],
    11:['这是更新前的版本','左侧只有当时的材料，前提没有新报告引用。返回后，可以继续处理条件与个人判断，或自由编辑图。','返回当前研究','exit-history',''],
    12:['核心操作演示到这里','点任何方框，右侧看依据；点“内容”可修改或表达态度。新证据、条件确认和个人判断各自处理。','收起提示，自己探索','end-walk','']
  };
  if(state.view&&step!==11){title='正在回看旧版本';text='现在展示的是当时的内容和材料。返回当前研究后才能继续修改。';label='返回当前研究';action='exit-history';}
  else if(state.walkDone){
    title='自由操作：点一句话，看依据或改内容';text='右侧“依据”回查原文，“内容”修改这句话或表达态度。点中间推导时，研究的是整步如何推出结论。';
    label='检查所选内容（模拟 AI）';action='ai-question';
  }else if(tasks[step]){[title,text,label,action,extra]=tasks[step];}
  if(!state.view&&!state.walkDone&&step===2){
    const n=activeNode(),e=n.evidence[0];
    if(e){title='这句话的依据在哪里？';text='右侧是你选中内容的依据。打开原文，看看这段材料具体支持或限定了什么。';label='打开这项依据的原文';action='source';extra='data-evidence="'+e.id+'"';}
    else{title='你选的这一步还没有直接证据';text='缺口会保留在右侧。可以继续看看这步推导，再决定如何纳入研究。';label='继续检查这一步';action='walk-next';extra='data-step="4"';}
  }
  if(!state.view&&!state.walkDone&&step===4&&state.selected!=='i1'){
    title='回到刚才要检查的整步推导';text='你现在选中了别的内容。先回到图中间的联合推导，看看它的依据和缺口。';label='回到中间的联合推导';action='select';extra='data-id="i1"';
  }
  if(!state.view&&!state.walkDone&&step===6&&!state.preview){
    title='临时预览已经退出';text='原来的路径保留。可以重新查看原假设的影响，也可以继续编辑当前内容。';
    const available=state.branch==='a'&&state.branches.a.p2.version===1;
    label=available?'重新预览原假设':'继续自由操作';action=available?'preview':'end-walk';extra='';
  }
  if(!state.view&&!state.walkDone&&step===7&&!state.branches.b){
    title='另一条路径尚未保存';text='刚才的操作已被撤销。重新预览并明确保存后，才能比较两条路径。';label='重新预览另一种可能';action='preview';extra='';
  }
  if(!state.view&&!state.walkDone&&step===9&&(state.branch!=='a'||state.selected!=='p2'||state.tab!=='updates')){
    title='先回到新报告影响的前提';text='这份更新针对原路径 A 的资本开支前提。先选中它并显示新变化，再决定是否关联证据。';label='查看资本开支前提的新变化';action='focus-update';extra='';
  }
  if(!state.view&&!state.walkDone&&step===10){

  if(a==='branch-dialog'){openDialog('branch');return;}

  if(a==='view-edit'||a==='view-judgment'){dispatch({type:a,index:Number(b.dataset.index)});$('dialog').close();fit();return;}

$('viewport').addEventListener('pointerdown',event=>{

$('viewport').addEventListener('pointermove',event=>{
  if(!drag)return;
  const dx=event.clientX-drag.x,dy=event.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>6&&!drag.moved){drag.moved=true;$('viewport').setPointerCapture(event.pointerId);}
  if(drag.node){
    const nodeEl=document.querySelector('[data-node="'+drag.node+'"]');

  }else{camera.x=drag.camera.x+dx;camera.y=drag.camera.y+dy;applyCamera();}
});
$('viewport').addEventListener('pointerup',event=>{
  if(!drag)return;
  if(drag.node&&drag.moved){const nodeEl=document.querySelector('[data-node="'+drag.node+'"]');dispatch({type:'move',id:drag.node,x:parseFloat(nodeEl.style.left),y:parseFloat(nodeEl.style.top)});}
  drag=null;
});
$('viewport').addEventListener('pointercancel',()=>{drag=null;renderGraph();});
window.addEventListener('resize',fit);
render();requestAnimationFrame(fit);

      }
    }

  }

})();

  function positionTour(){
    if(!tourOpen)return;
    const s=TOUR[tourIndex];if(!s)return;
    const ring=el('fw-tour-ring'),card=el('fw-tour-card'),vw=window.innerWidth,vh=window.innerHeight,m=12;
    const cw=card.offsetWidth||340,ch=card.offsetHeight||420;
    const t=s.target();let r=null;
    if(t&&t.getClientRects().length&&t.offsetParent!==null){
      const b=t.getBoundingClientRect(),frame=el('lab-sdk-frame').getBoundingClientRect(),dx=t.ownerDocument===document?0:frame.left,dy=t.ownerDocument===document?0:frame.top;
      r={left:b.left+dx,top:b.top+dy,right:b.right+dx,bottom:b.bottom+dy,width:b.width,height:b.height};
    }
    if(r&&r.width>4&&r.height>4){
      const pad=6;ring.classList.remove('missing');
      ring.style.left=(r.left-pad)+'px';ring.style.top=(r.top-pad)+'px';ring.style.width=(r.width+pad*2)+'px';ring.style.height=(r.height+pad*2)+'px';
    }else{
      ring.classList.add('missing');
      const cx=vw/2-120,cy=vh/2-60;r={left:cx,top:cy,right:cx+240,bottom:cy+120,width:240,height:120};
    }
    const sides={
      bottom:{left:r.left+r.width/2-cw/2,top:r.bottom+14},
      top:{left:r.left+r.width/2-cw/2,top:r.top-14-ch},
      right:{left:r.right+14,top:r.top+r.height/2-ch/2},
      left:{left:r.left-14-cw,top:r.top+r.height/2-ch/2}
    };
    const order=({bottom:['bottom','top','right','left'],top:['top','bottom','right','left'],right:['right','left','bottom','top'],left:['left','right','bottom','top']})[s.place||'bottom'];
    const overlap=(a,b)=>Math.max(0,Math.min(a.left+cw,b.right)-Math.max(a.left,b.left))*Math.max(0,Math.min(a.top+ch,b.bottom)-Math.max(a.top,b.top));
    const obstacles=[r];
    document.querySelectorAll('.lab-window:not(.hidden),.lab-context:not(.hidden)').forEach(w=>obstacles.push(w.getBoundingClientRect()));
    const pop=nativeGuide('.research-popover');
    if(pop){const b=pop.getBoundingClientRect(),f=el('lab-sdk-frame').getBoundingClientRect();obstacles.push({left:b.left+f.left,top:b.top+f.top,right:b.right+f.left,bottom:b.bottom+f.top});}
    const candidates=order.map(k=>sides[k]).concat([{left:m,top:m},{left:vw-cw-m,top:m},{left:m,top:vh-ch-m},{left:vw-cw-m,top:vh-ch-m}]).map(p=>({left:Math.max(m,Math.min(p.left,vw-cw-m)),top:Math.max(m,Math.min(p.top,vh-ch-m))}));
    const score=p=>overlap(p,r)*4+obstacles.slice(1).reduce((sum,b)=>sum+overlap(p,b),0);
    const p=candidates.reduce((best,p)=>score(p)<score(best)?p:best,candidates[0]);
    card.style.left=p.left+'px';card.style.top=p.top+'px';
  }

        const payload=saved.payload;migrated=payload.projects.some(([,p])=>p.name===undefined||!p.study.directCanvas||[...p.timeline.past,...p.timeline.future].some(entry=>!entry.before.study.directCanvas||!entry.after.study.directCanvas));const upgraded={...payload,projects:payload.projects.map(([id,p])=>[id,upgradeProject(p,id)])};validateWorkspace(upgraded);projects.clear();upgraded.projects.forEach(([id,p])=>projects.set(id,p));
        projectId=payload.activeProjectId;openProjectIds=payload.openProjectIds??[projectId];projectSerial=payload.projectSerial;navPinned=!!payload.navPinned;navOpen=navPinned||!openProjectIds.length;
        ({name:projectName,study,view,formCache,inspectorView,composer,readerDraft,canvasState,timeline}=projects.get(projectId));
        study.undo=[];canvasSession=++sessionSerial;canvasRestoreRevision++;restored=true;
        for(const entry of payload.aiThreads||[])if(Array.isArray(entry)&&entry.length===2&&typeof entry[0]==='string')aiThreads.set(entry[0],entry[1]);
        if(saved.recoveredFromBackup)recoveryNotice='最新存档无法读取，当前恢复的是上一份有效存档，最近一段修改可能未包含。';
        setSaveStatus(saved.recoveredFromBackup?'recovered':'saved',saved.recoveredFromBackup?'已从上一份有效存档恢复':'已恢复本机研究',null,saved.savedAt);
      }else setSaveStatus('empty','本机自动保存已开启');
      storageReady=true;
    }catch(error){storageReady=true;saveBlocked=true;setSaveStatus('error','存档无法读取 · 点击处理',error);}
    el('open-research').inert=false;render();switchEngine(false);if(migrated&&!saveBlocked)scheduleSave();
    if(!restored)requestAnimationFrame(()=>{fitLab();if(!saveBlocked)openTour(0);});
  }
  startWorkspace();
})();

</script>
