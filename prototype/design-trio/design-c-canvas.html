<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>见岔 · 设计 C｜画布优先 + 语义层</title>
<style>
:root{--bg:#FBFAF8;--surface:#fff;--s2:#F4F2ED;--s3:#EDEBE4;--bd:#E3E0D8;--bd2:#C9C5BA;--tx:#24231F;--tx2:#6B675E;--tx3:#968F83;--ac:#2F6FB5;--acS:#E8F1FA;--ok:#3F7A2E;--okS:#E7F2E1;--wn:#9A6A16;--wnS:#FBF0DC;--bd3:#B23B3B;--bdS:#FBE9E9;--id:#6B675E;--idS:#F0EEE8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.6 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--bd);border-radius:8px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--bd2)}
button.primary{background:var(--ac);border-color:var(--ac);color:#fff}
button.primary:disabled{background:var(--bd2);border-color:var(--bd2);cursor:not-allowed}
button.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
button.ghost:hover{background:var(--s2);border-color:var(--bd)}
textarea{font:inherit;border:1px solid var(--bd);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--tx);width:100%}
.top{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--bd);position:relative;z-index:20}
.brand{font-weight:500;letter-spacing:.5px}
.spacer{flex:1}
.save{font-size:12px;color:var(--tx2)}
.sw{display:flex;gap:2px;background:var(--s2);border-radius:8px;padding:2px}
.sw button{border:0;background:transparent;padding:3px 9px;font-size:12px;color:var(--tx2);border-radius:6px}
.sw button.on{background:var(--surface);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.den{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2)}
.den .sw button{padding:3px 8px}

.stage{flex:1;position:relative;overflow:auto;background:var(--bg)}
#canvas{position:relative;width:1060px;height:640px;margin:16px;background-image:radial-gradient(var(--bd2) 1px,transparent 1px);background-size:22px 22px}
svg.wires{position:absolute;inset:0;width:1060px;height:640px;pointer-events:none}
.card{position:absolute;background:var(--surface);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;cursor:pointer;transition:box-shadow .15s}
.card:hover{border-color:var(--bd2)}
.card.sel{border-color:var(--ac);box-shadow:0 0 0 3px var(--acS)}
.card.intrack{border-color:#9FC0E4;background:#FCFDFE}
.card.affected{border-color:#EDC7C7;background:var(--bdS)}
.card.retained{border-color:#C6DDB8;background:var(--okS)}
.card.local{border-style:dashed;border-color:#E8D3A8;background:var(--wnS)}
.card .ct{font-size:12.5px;line-height:1.55}
.card .mt{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.card .cs{font-size:11px;color:var(--tx3);margin-top:4px}
.step{position:absolute;background:var(--acS);border:1px solid var(--ac);border-radius:10px;padding:8px 10px;cursor:pointer}
.step.sel{box-shadow:0 0 0 3px var(--acS)}
.step .lb{font-size:11px;color:var(--ac);margin-bottom:2px}
.step .rs{font-size:11px;color:#1B4E85;margin-top:3px}
.note{position:absolute;background:var(--s2);border:1px dashed var(--bd2);border-radius:8px;padding:7px 9px;font-size:11.5px;color:var(--tx2);width:180px}
.laneTag{position:absolute;font-size:11px;color:var(--tx3);letter-spacing:.4px}
.pill{font-size:11px;border-radius:5px;padding:1px 6px;border:1px solid}
.p-origin{background:var(--s2);color:var(--tx2);border-color:var(--bd)}
.p-ai{background:var(--wnS);color:var(--wn);border-color:#E8D3A8}
.p-user{background:var(--acS);color:var(--ac);border-color:#BFD6EE}
.p-local{background:var(--wnS);color:var(--wn);border-color:#E8D3A8;border-style:dashed}
.p-ref{background:var(--s2);color:var(--tx2);border-color:var(--bd)}
.p-aic{background:var(--wnS);color:var(--wn);border-color:#E8D3A8;border-style:dashed}
.p-mine{background:var(--acS);color:var(--ac);border-color:#BFD6EE}
.p-edited{background:#EFEDE7;color:#5F5E5A;border-color:var(--bd2)}
.p-corrected{background:var(--s3);color:var(--tx2);border-color:var(--bd)}
.legend{font-size:11px;color:var(--tx3);padding:6px 14px 8px;border-bottom:1px solid var(--bd);background:var(--bg)}
.legend b{font-weight:500;color:var(--tx2)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0}
.duo>div{padding:10px 12px}
.duo>div+div{border-left:1px solid var(--bd)}
.duo .h{font-size:12px;color:var(--tx2);margin-bottom:8px}
.evscroll{max-height:260px;overflow:auto}
.fold{margin-top:12px;border-top:1px solid var(--bd);padding-top:10px}
.fold .hd{font-size:12px;color:var(--tx2);cursor:pointer}
.cbl{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:8px}
.cbl.on{border-color:var(--ac);background:var(--acS)}
.s-待研究{background:var(--idS);color:var(--id);border-color:var(--bd)}
.s-认可{background:var(--okS);color:var(--ok);border-color:#C6DDB8}
.s-质疑{background:var(--wnS);color:var(--wn);border-color:#E8D3A8}
.s-不认可{background:var(--bdS);color:var(--bd3);border-color:#EDC7C7}

.tb{position:absolute;z-index:15;display:flex;gap:4px;background:var(--surface);border:1px solid var(--bd2);border-radius:9px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.tb button{font-size:12px;padding:3px 9px;border-color:transparent}
.tb button:hover{background:var(--s2);border-color:var(--bd)}
.menu{position:absolute;z-index:16;background:var(--surface);border:1px solid var(--bd2);border-radius:9px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:150px}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;font-size:12px;padding:5px 9px;border-radius:6px}
.menu button:hover{background:var(--s2)}
.menu .sep{height:1px;background:var(--bd);margin:3px 0}

#drawer{position:fixed;top:48px;right:0;bottom:0;width:380px;background:var(--surface);border-left:1px solid var(--bd);z-index:30;display:none;flex-direction:column}
#drawer.on{display:flex}
.dh{padding:12px 14px;border-bottom:1px solid var(--bd)}
.dh .k{font-size:11px;color:var(--tx3)}
.dh .t{font-size:13.5px;margin-top:2px;line-height:1.5}
.dh .x{position:absolute;top:10px;right:12px}
.dtabs{display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--bd)}
.dtabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--tx2);padding:5px 10px}
.dtabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.dbody{padding:12px 14px;overflow:auto;flex:1}
.evl{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12px}
.evl .qt{color:var(--tx2);border-left:2px solid var(--bd);padding-left:8px;margin-top:4px}
.evl .src{font-size:11px;color:var(--tx3);margin-top:4px}
.tag{font-size:11px;border-radius:5px;padding:1px 6px;border:1px solid}
.t-支持{background:var(--okS);color:var(--ok);border-color:#C6DDB8}
.t-相反{background:var(--bdS);color:var(--bd3);border-color:#EDC7C7}
.t-缺口,.t-待查,.t-未查证{background:var(--wnS);color:var(--wn);border-color:#E8D3A8}
.t-限定{background:var(--acS);color:var(--ac);border-color:#BFD6EE}
.stances{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stances button{padding:8px 4px;text-align:center}
.stances button.on{outline:2px solid var(--ac)}
.field{margin-top:10px}
.field label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.row{display:flex;gap:6px;margin-top:10px}
.note2{font-size:11.5px;color:var(--tx3);margin-top:10px;line-height:1.7}
.hbanner{margin:0 16px 10px;padding:9px 12px;border-radius:10px;background:var(--wnS);border:1px solid #E8D3A8;font-size:12.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hbanner .r{margin-left:auto;display:flex;gap:6px}
.mask{position:fixed;inset:0;background:rgba(30,28,24,.45);z-index:800;display:none;align-items:center;justify-content:center;padding:24px}
.mask.on{display:flex}
.modal{background:var(--surface);border-radius:12px;max-width:660px;width:100%;max-height:80vh;overflow:auto;border:1px solid var(--bd)}
.mh{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.mh .t{font-weight:500}.mh .x{margin-left:auto}
.mb{padding:14px 16px}
#ring{position:fixed;border:2px solid var(--ac);border-radius:10px;box-shadow:0 0 0 9999px rgba(28,26,22,.45);pointer-events:none;z-index:900;display:none;transition:all .22s ease}
#tour{position:fixed;z-index:901;width:335px;background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.14)}
#tour.on,#ring.on{display:block}
#tour .st{font-size:11px;color:var(--ac)}
#tour p{margin:0 0 8px;font-size:12.5px;color:var(--tx2);line-height:1.65}
#tour .act{font-size:12px;background:var(--acS);border:1px solid #BFD6EE;border-radius:7px;padding:6px 8px;color:#1B4E85}
#tour .warn{font-size:12px;background:var(--wnS);border:1px solid #E8D3A8;border-radius:7px;padding:6px 8px;color:var(--wn)}
#tour .btns{display:flex;gap:6px;margin-top:10px;align-items:center}
#tour .btns .sp{flex:1}
</style>
</head>
<body>
<header class="top">
  <div class="brand">见岔</div>
  <span style="font-size:12px;color:var(--tx2)">Intel 代工前提 · 这位 KOL 的核心判断依赖哪些前提，我认可哪些、质疑哪些？</span>
  <div class="spacer"></div>
  <div class="den">语义密度
    <div class="sw" id="den">
      <button data-d="0">L0 草稿</button><button data-d="1">L1 归属</button><button class="on" data-d="2">L2 判断</button><button data-d="3">L3 全开</button>
    </div>
  </div>
  <button class="ghost" id="btnBase">对照整理原版</button>
  <span class="save" id="saveState">已保存</span>
  <div class="sw">
    <button onclick="location.href='design-a-lineage.html'">列表</button>
    <button onclick="location.href='design-b-review.html'">审阅台</button>
    <button class="on">画布</button>
  </div>
  <button class="primary" id="btnTour">引导</button>
</header>

<div id="hypoWrap"></div>
<div class="stage"><div id="canvas"><svg class="wires" id="wires"></svg></div></div>

<div id="drawer">
  <div class="dh"><button class="ghost x" onclick="closeDrawer()">关闭</button><div class="k" id="dK"></div><div class="t" id="dT"></div></div>
  <div class="legend"><b>内容起点</b> 来源／用户／AI　·　<b>研究参与</b> 参考内容／AI 候选／个人研究项　·　<b>我已编辑</b>　——　看到不等于采用</div>
  <div class="dbody" id="dbody"></div>
</div>

<div class="mask" id="baseMask"><div class="modal"><div class="mh"><span class="t">对照整理原版</span><button class="ghost x" onclick="closeBase()">关闭</button></div><div class="mb" id="baseB"></div></div></div>
<div class="mask" id="rngMask"><div class="modal"><div class="mh"><span class="t">选择作用范围（D66）</span><button class="ghost x" onclick="closeRange()">关闭</button></div><div class="mb" id="rngB"></div></div></div>
<div id="ring"></div>
<div id="tour"><div class="st" id="tSt"></div><p id="tP"></p><div id="tA"></div>
  <div class="btns"><button class="ghost" id="tPrev">上一步</button><span class="sp"></span><button class="ghost" id="tSkip">跳过引导</button><button class="primary" id="tNext">下一步</button></div></div>

<script>
const DATA={
 claims:{c1:{text:'Intel 18A 会拿到外部大客户订单',origin:'来源',kind:'结论',x:480,y:88,w:190},
  p1:{text:'18A 按期量产（2025 年内进入风险试产）',origin:'来源',x:30,y:44,w:190},
  p2:{text:'良率达到可比水平',origin:'来源',x:30,y:160,w:190},
  p3:{text:'客户有动机扶持第二家先进制程供应商',origin:'来源',x:30,y:296,w:190},
  c2:{text:'代工业务亏损将在 2026 收窄',origin:'来源',kind:'结论',x:480,y:412,w:190},
  p4:{text:'资本开支已见顶',origin:'AI',x:30,y:412,w:190}},
 steps:[{id:'i1',to:'c1',from:['p1','p2'],combo:'共同依赖',origin:'来源',x:250,y:88,w:200,h:72},
  {id:'i2',to:'c1',from:['p3'],combo:'独立支持',origin:'来源',x:250,y:296,w:200,h:56},
  {id:'i3',to:'c2',from:['p1','p4'],combo:'共同依赖',origin:'AI',x:250,y:404,w:200,h:72}],
 evidence:{c1:[{t:'限定',s:'M2 · Intel 2025 Q2 财报 P24',q:'外部客户承诺取决于 18A 进度',a:'P24 §代工'}],
  p1:[{t:'支持',s:'M2 · Intel 2025 Q2 财报 P24',q:'18A remains on track for risk production in 2025',a:'P24 §代工'},
      {t:'相反',s:'M3 · 新闻 2025-09-02',q:'两名知情人士称良率仍低于内部目标',a:'正文第 3 段'},
      {t:'缺口',s:'—',q:'量产具体日期未公开披露',a:'—'}],
  p2:[{t:'缺口',s:'—',q:'未找到可比良率的公开披露，无法核验',a:'—'}],
  p3:[{t:'支持',s:'M1 · X 归档 2025-08-14',q:'没有一家客户愿意只剩一个先进制程来源',a:'主帖第 4 段'}],
  i2:[{t:'支持',s:'M1 · X 归档 2025-08-14',q:'（同一段，作为独立支持）',a:'主帖第 4 段'}],
  c2:[{t:'待查',s:'—',q:'尚未发起查证',a:'—'}],
  i1:[{t:'未查证',s:'—',q:'尚未发起查证',a:'—'}],
  i3:[{t:'待查',s:'—',q:'尚未发起查证',a:'—'}],
  p4:[{t:'未查证',s:'—',q:'AI 推断，原文未表达',a:'—'}]}
};
const STANCES=['待研究','认可','质疑','不认可'];
const S={sel:null,den:2,denTried:new Set(),stance:{},reason:{},draft:{},part:{},edited:{},corrected:{},hypo:null,paths:[],revisions:[],openedEv:false,sawBase:false,menu:null};
Object.keys(DATA.claims).forEach(id=>{S.stance[id]='待研究';S.part[id]=DATA.claims[id].origin==='AI'?'AI 候选':'参考内容';});
DATA.steps.forEach(s=>{S.stance[s.id]='待研究';S.part[s.id]=s.origin==='AI'?'AI 候选':'参考内容';});
const partCls=p=>p==='AI 候选'?'p-aic':p==='个人研究项'?'p-mine':'p-ref';
function marks(id){let h=`<span class="pill ${partCls(S.part[id])}">${S.part[id]}</span>`;
  if(S.edited[id])h+='<span class="pill p-edited">我已编辑</span>';
  if(S.corrected[id])h+='<span class="pill p-corrected">已校正</span>';return h;}
const affectedSteps=()=>S.hypo?DATA.steps.filter(s=>s.from.includes(S.hypo)):[];
const retainedSteps=()=>{const a=affectedSteps();return a.length?DATA.steps.filter(s=>!s.from.includes(S.hypo)&&a.some(x=>x.to===s.to)):[];};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const isStep=id=>DATA.steps.some(s=>s.id===id);
const stepOf=id=>DATA.steps.find(s=>s.id===id);
function vsum(id){
  const ev=DATA.evidence[id]||[];const n=k=>ev.filter(e=>e.t===k).length;
  if(!ev.length)return '未查证';
  const p=[];if(n('支持'))p.push('支持 '+n('支持'));if(n('相反'))p.push('相反 '+n('相反'));
  if(n('缺口'))p.push('缺口 '+n('缺口'));if(n('待查'))p.push('待查');if(n('未查证'))p.push('未查证');if(n('限定'))p.push('限定');
  return p.join(' · ');
}
function wires(){
  const P=[];
  const c=id=>DATA.claims[id],s=id=>stepOf(id);
  const link=(x1,y1,x2,y2,dash)=>P.push(`<path d="M${x1} ${y1} C${x1+40} ${y1} ${x2-40} ${y2} ${x2} ${y2}" fill="none" stroke="${dash?'#9A6A16':'#8B877C'}" stroke-width="1.5" ${dash?'stroke-dasharray="4 3"':''} marker-end="url(#a)"/>`);
  link(220,70,250,118);link(220,186,250,132);link(450,124,480,124);
  link(220,322,250,318);link(450,318,480,150);
  link(125,110,250,432,true);link(220,448,250,452);link(450,440,480,440);
  $('#wires').innerHTML='<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/></marker></defs>'+P.join('');
}
function cardHTML(id){
  const c=DATA.claims[id],d=S.den;
  let h=`<div class="ct">${esc(c.text)}</div>`;
  if(d>=1)h+=`<div class="mt"><span class="pill p-${c.origin==='AI'?'ai':c.origin==='来源'?'origin':'user'}">${c.origin}</span>`;
  if(d>=2){h+=marks(id)+`<span class="pill s-${S.stance[id]}">${S.stance[id]}</span></div>`;h+=`<div class="cs">查证：${esc(vsum(id))}</div>`;}
  else if(d>=1)h+=marks(id)+`</div>`;
  if(d>=3)h+=`<div class="cs">来源 → 已保存摘录 · ${esc((DATA.evidence[id]||[])[0]?DATA.evidence[id][0].a:'无锚点')}</div>`;
  return h;
}
function stepHTML(s){
  const d=S.den;
  let h=`<div class="lb">${s.combo==='共同依赖'?'[&amp;] 共同依赖':'[|] 独立支持'} · 整步</div>`;
  h+=`<div class="mt"><span class="pill p-${s.origin==='AI'?'ai':'origin'}">${s.origin}</span>${marks(s.id)}</div>`;
  h+=`<div style="font-size:12px">→ ${esc(DATA.claims[s.to].text)}</div>`;
  if(d>=2)h+=`<div class="rs">立场：${S.stance[s.id]}${S.reason[s.id]?' · '+esc(S.reason[s.id]):''}</div>`;
  return h;
}
function render(){
  const cv=$('#canvas');
  $$('.card,.step,.note,.laneTag,.tb,.menu').forEach(e=>e.remove());
  wires();
  cv.insertAdjacentHTML('beforeend',`<div class="laneTag" style="left:30px;top:20px">论证轨道 · C1</div><div class="laneTag" style="left:30px;top:376px">论证轨道 · C2</div>`);
  Object.keys(DATA.claims).forEach(id=>{
    const c=DATA.claims[id],el=document.createElement('div');
    el.className='card'+(S.sel===id?' sel':'')+(trackOf(id)?' intrack':'')+(S.hypo===id?' affected':'');
    el.style.left=c.x+'px';el.style.top=c.y+'px';el.style.width=c.w+'px';
    el.dataset.id=id;el.innerHTML=cardHTML(id);
    el.onclick=e=>{e.stopPropagation();select(id);};
    cv.appendChild(el);
  });
  DATA.steps.forEach(s=>{
    const el=document.createElement('div');
    el.className='step'+(S.sel===s.id?' sel':'')+(S.hypo&&s.from.includes(S.hypo)?' affected':'')+(retainedSteps().includes(s)?' retained':'');
    el.style.left=s.x+'px';el.style.top=s.y+'px';el.style.width=s.w+'px';el.style.height=s.h+'px';
    el.dataset.id=s.id;el.innerHTML=stepHTML(s);
    el.onclick=e=>{e.stopPropagation();select(s.id);};
    cv.appendChild(el);
  });
  S.paths.forEach((p,i)=>{
    const el=document.createElement('div');
    el.className='card local';el.style.left='30px';el.style.top=(540+i*78)+'px';el.style.width='200px';
    el.innerHTML=`<div class="ct">${esc(p.text)}</div><div class="mt"><span class="pill p-local">本路径局部</span></div><div class="cs">${esc(p.path)}</div>`;
    cv.appendChild(el);
  });
  const n=document.createElement('div');
  n.className='note';n.style.left='730px';n.style.top='60px';
  n.innerHTML='自由批注（绘图层）<br>「客户集中度是不是 Risic 要考虑」<br><span style="color:var(--tx3)">批注不自动成为主张或依据</span>';
  cv.appendChild(n);
  if(S.sel)drawToolbar();
  $('#hypoWrap').innerHTML=S.hypo?`<div class="hbanner"><b>假设预览：</b>「${esc(DATA.claims[S.hypo].text)}」不成立 · 受影响 ${DATA.steps.filter(s=>s.from.includes(S.hypo)).map(s=>s.id.toUpperCase()).join('、')} · 仍保留 ${DATA.steps.filter(s=>!s.from.includes(S.hypo)).map(s=>s.id.toUpperCase()).join('、')} · 退出后原判断不变<div class="r"><button class="primary" onclick="savePath()">保存为我的路径</button><button onclick="exitHypo()">退出假设</button></div></div>`:'';
  $('#saveState').textContent=S.dirty?'保存中…':'已保存';
}
function aff(id){return DATA.steps.some(s=>s.from.includes(id)&&s.from.includes(S.hypo))||id===S.hypo;}
function ret(id){return DATA.steps.some(s=>s.from.includes(id)&&!s.from.includes(S.hypo));}
function trackOf(id){
  if(!S.sel)return false;
  if(isStep(S.sel)){const s=stepOf(S.sel);return id===s.to||s.from.includes(id);}
  if(DATA.claims[S.sel]&&DATA.claims[S.sel].kind==='结论'){return DATA.steps.filter(s=>s.to===S.sel).some(s=>s.from.includes(id));}
  return DATA.steps.some(s=>s.from.includes(id)&&s.to===S.sel)||DATA.steps.some(s=>s.from.includes(S.sel)&&s.to===id);
}
function select(id){S.sel=id;S.menu=null;render();tick();}
function drawToolbar(){
  const el=$(`.card[data-id="${S.sel}"],.step[data-id="${S.sel}"]`);if(!el)return;
  const st=isStep(S.sel);
  const t=document.createElement('div');t.className='tb';
  t.style.left=el.offsetLeft+'px';t.style.top=(el.offsetTop-38)+'px';
  t.innerHTML=st
    ?`<button onclick="openDrawer()">说明</button><button onclick="openDrawer()">查证与立场</button><button onclick="more(event)">更多</button>`
    :`<button onclick="rewrite()">改写</button><button onclick="openDrawer()">查证与立场</button><button onclick="more(event)">更多</button>`;
  $('#canvas').appendChild(t);
}
function more(e){
  e.stopPropagation();
  const el=$(`.card[data-id="${S.sel}"],.step[data-id="${S.sel}"]`);
  const m=document.createElement('div');m.className='menu';
  m.style.left=el.offsetLeft+'px';m.style.top=(el.offsetTop+el.offsetHeight+8)+'px';
  const st=isStep(S.sel);
  const extra=st?'':`<button onclick="hypo()">试一个假设</button>`;
  const corr=(!st&&DATA.claims[S.sel].origin==='来源'&&!S.edited[S.sel])?'<button onclick="correct()">校正整理结果</button>':'';
  m.innerHTML=`${extra}${corr}<div class="sep"></div><button onclick="src()">来源与材料</button><button onclick="ai()">AI 讨论</button><button onclick="todo()">待查问题</button><button onclick="revs()">修改记录</button><div class="sep"></div><button onclick="style_()">样式</button><button onclick="focus_()">聚焦这步推导</button>`;
  $('#canvas').appendChild(m);
}
document.addEventListener('click',e=>{if(!e.target.closest('.tb,.menu')){$$('.menu').forEach(m=>m.remove());}});
function rewrite(){alert('就地改写主张正文并保存。普通改写不填修改理由，改前改后、编辑者与时间自动记录。');S.dirty=false;render();}
function src(){alert('来源与材料：单列列表 → 同窗阅读 → 返回。添加文件直接归入本对象，不自动成为支持依据。');}
function ai(){alert('本地模拟：先给回答，只有本人显式操作才新增 AI／待研究候选，不自动连线。');}
function todo(){alert('待查问题：跳过后缺口仍可见，切换对象后仍能找到；不改变核对状态、立场或条件结论。');}
function revs(){alert('修改记录：按对象折叠，先看最近一次；同值保存不新增，只改理由也保留。已在抽屉底部「修改记录」中展开。');}
function style_(){alert('样式只调整描边、背景、线宽与线型，不改正文版本、起点、立场、核对或查证状态。');}
function focus_(){alert('聚焦只调整视口到选中项与直接相邻对象，不改变图结构、不隐藏其他支持路径。');}
function correct(){S.corrected[S.sel]=true;$$('.menu').forEach(m=>m.remove());alert('仅校正未个人改写的来源对象：误读、字句与日期。不改原始材料与初始基线；正文校正后旧查证留在旧版本。校正记录与「我已编辑」分别保留。');render();}
function hypo(){
  const id=S.sel;
  if(!DATA.steps.some(s=>s.from.includes(id))){alert('这项主张尚未作为前提用于任何推导。');return;}
  S.hypo=id;$$('.menu').forEach(m=>m.remove());render();tick();
}
function exitHypo(){S.hypo=null;render();tick();}
function savePath(){if(S.hypo)openRange();}
function openRange(){
  const steps=affectedSteps();
  $('#rngB').innerHTML=`<p style="font-size:12.5px;color:var(--tx2);margin:0 0 10px">「${esc(DATA.claims[S.hypo].text)}」被 <b>${steps.length}</b> 步推导共用。按 D66，没有明确范围不得静默写入全部引用——请勾选要生成本路径局部版本的推导。</p>
   ${steps.map((s,i)=>`<div class="cbl" data-i="${i}" onclick="this.classList.toggle('on')"><span class="combo">${s.id.toUpperCase()}</span><span style="font-size:12px">→ ${esc(DATA.claims[s.to].text)}</span><span class="pill ${partCls(S.part[s.id])}">${S.part[s.id]}</span></div>`).join('')}
   <p style="font-size:11.5px;color:var(--tx3);margin:8px 0 0">未勾选的推导继续保留原前提；新版本默认「待研究」（D32）。</p>
   <div class="row"><button class="primary" onclick="applyRange(false)">只改所选</button><button onclick="applyRange(true)">全部 ${steps.length} 步</button><button class="ghost" onclick="closeRange()">取消</button></div>`;
  $('#rngMask').classList.add('on');
}
function applyRange(all){
  const steps=affectedSteps();
  const sel=all?steps:[...document.querySelectorAll('#rngB .cbl.on')].map(e=>steps[+e.dataset.i]);
  if(!sel.length){alert('请至少勾选一步推导，或明确选择「全部」。');return;}
  const name='路径 A · 良率不及预期';
  sel.forEach(s=>S.paths.push({step:s.id,path:name,text:'（本路径局部）'+DATA.claims[S.hypo].text+' 不成立 · 新版本默认待研究'}));
  S.revisions.unshift({id:S.hypo,tm:'2026-10-06 00:0'+(S.revisions.length+1),ch:'实质改写：为 '+sel.map(s=>s.id.toUpperCase()).join('、')+' 生成「'+name+'」局部版本；其余推导保留原前提'});
  S.hypo=null;S.dirty=false;closeRange();render();tick();
}
function closeRange(){$('#rngMask').classList.remove('on');}
function openDrawer(){
  const id=S.sel,st=isStep(id);
  $('#dK').textContent=st?('推导关系 · '+stepOf(id).combo+' · 整步为一个标注单位'):('主张 · '+(DATA.claims[id].kind||'前提'));
  $('#dT').textContent=st?(stepOf(id).from.map(f=>DATA.claims[f].text).join(' ＋ ')+' → '+DATA.claims[stepOf(id).to].text):DATA.claims[id].text;
  $('#drawer').classList.add('on');renderBody();tick();
}
function closeDrawer(){$('#drawer').classList.remove('on');S.sel=S.sel;tick();}
function renderBody(){
  const id=S.sel,b=$('#dbody'),d=S.draft[id],ev=DATA.evidence[id]||[],rv=S.revisions.filter(r=>r.id===id);
  b.innerHTML=`<div class="duo">
   <div><div class="h">依据 · 查证摘要（左）</div><div class="evscroll">${
     ev.length?ev.map(e=>`<div class="evl"><span class="tag t-${e.t}">${e.t}</span> <span style="font-size:12px">${esc(e.s==='—'?'未取得资料':e.s)}</span><div class="qt">${esc(e.q)}</div><div class="src">锚点：${esc(e.a)}　·　引用锁定已保存版本</div></div>`).join('')
     :'<div style="font-size:12px;color:var(--tx3)">暂无依据</div>'}</div></div>
   <div><div class="h">个人立场与判断（右）${d?' · 草稿未保存':''}</div>
     <div class="stances">${STANCES.map(s=>`<button class="${(d||S.stance[id])===s?'on':''}" onclick="pick('${s}')">${s}</button>`).join('')}</div>
     <div class="field"><label>理由${(d==='质疑'||d==='不认可')?'（必填）':'（认可选填）'}</label><textarea id="rsn" rows="3" placeholder="写一句具体疑问或依据">${esc(S.reason[id]||'')}</textarea></div>
     <div class="row"><button class="primary" onclick="saveStance()">保存立场</button><button class="ghost" onclick="cancelStance()">取消草稿</button></div>
     <p class="note2">选择只形成草稿，明确保存后才更新卡片；该对象同时从「参考内容」变为「个人研究项」。</p>
   </div></div>
   <div class="fold"><div class="hd" onclick="var n=this.nextElementSibling;n.style.display=n.style.display==='none'?'block':'none'">修改记录（${rv.length}）· 点击展开</div>
   <div style="display:none">${rv.length?rv.map(r=>`<div style="border-left:2px solid var(--bd);padding-left:10px;margin-bottom:8px"><div style="font-size:11px;color:var(--tx3)">${r.tm}</div><div style="font-size:12px">${esc(r.ch)}</div></div>`).join(''):'<div style="font-size:12px;color:var(--tx3)">尚无修改记录</div>'}</div></div>`;
  S.openedEv=true;tick();
}
function pick(s){S.draft[S.sel]=s;renderBody();tick();}
function saveStance(){
  const id=S.sel,v=S.draft[id],r=$('#rsn')?$('#rsn').value.trim():'';
  if(!v){alert('先选择一个立场。');return;}
  if((v==='质疑'||v==='不认可')&&!r){alert('质疑或不认可必须填写一句具体理由。');return;}
  const prev=S.stance[id],prevR=S.reason[id]||'';
  S.stance[id]=v;S.reason[id]=r;delete S.draft[id];
  if(prev!==v||prevR!==r){S.revisions.unshift({id,tm:'2026-10-06 00:0'+(S.revisions.length+1),ch:'立场：'+prev+' → '+v+(r?'（理由：'+r+'）':'')});}
  S.part[id]='个人研究项';S.dirty=false;render();renderBody();tick();
}
function cancelStance(){delete S.draft[S.sel];renderBody();}
function openBase(){
  S.sawBase=true;
  $('#baseB').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
   <div style="border:1px solid var(--bd);border-radius:8px;padding:10px"><div style="font-size:12px;color:var(--tx2);margin-bottom:6px">作者原版（整理基线）</div>
   <div style="font-size:12.5px;line-height:1.9">18A 按期量产 ＋ 良率达可比水平<br>[&amp;] 共同依赖 → Intel 18A 会拿到外部大客户订单<br>客户有动机扶持第二供应商 [|] 独立支持 → 同一结论</div></div>
   <div style="border:1px solid var(--bd);border-radius:8px;padding:10px"><div style="font-size:12px;color:var(--tx2);margin-bottom:6px">我的路径</div>
   <div style="font-size:12.5px;line-height:1.9">${S.paths.length?S.paths.map(p=>esc(p.path)+'：<br>'+esc(p.text)).join('<br>'):'尚未保存个人条件路径'}</div>
   <div style="margin-top:8px">整步推导 I1：${S.stance.i1}${S.reason.i1?'（'+esc(S.reason.i1)+'）':''}</div></div></div>
   <p style="font-size:11.5px;color:var(--tx3);margin-top:12px">基线在自动整理时保留，不随后续整理或作者更新自动替换。</p>`;
  $('#baseMask').classList.add('on');tick();
}
function closeBase(){$('#baseMask').classList.remove('on');}
$('#btnBase').onclick=openBase;
$$('#den button').forEach(b=>b.onclick=()=>{$$('#den button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.den=+b.dataset.d;S.denTried.add(+b.dataset.d);render();tick();});

const TOUR=[
 {t:'1 / 6 · 画布上有两张结论卡',p:'默认工作在自由画布上。先用顶栏的语义密度切到 L0 再切回 L2，看同一张卡能承载多少信息——这是让 100 个节点不炸掉的关键。',a:'点顶栏 L0 / L1 / L2 / L3 各一次，再回到 L2',
  tgt:()=>'#den',ok:()=>S.denTried.size>=3&&S.den===2},
 {t:'2 / 6 · 选中结论，展开论证轨道',p:'点结论卡 C1，它依赖的前提与推导会一起进入轨道高亮，工具条就近出现。推导不再是连线窄条，而是可点击的块。',a:'点「Intel 18A 会拿到外部大客户订单」这张卡',
  tgt:()=>'.card[data-id="c1"]',ok:()=>S.sel==='c1'},
 {t:'3 / 6 · 对整步推导表态',p:'点 [&] 共同依赖那个块，开「查证与立场」：抽屉左边依据、右边判断。选「质疑」只形成<b>草稿</b>，画布上的块不变；点「保存立场」后才更新，同时该对象从「参考内容」变「个人研究项」。',a:'点 [&amp;] 推导块 → 查证与立场 → 质疑 → 填理由 → 保存',
  tgt:()=>'.step[data-id="i1"]',ok:()=>S.stance.i1==='质疑'&&!!S.reason.i1},
 {t:'4 / 6 · 试一个假设',p:'选 P2「良率达到可比水平」，工具条「更多 → 试一个假设」。受影响标在<b>整步推导块</b>上（I1 失去这组前提的联合支持），保留标在<b>独立支持同一结论的 I2</b> 上；前提卡本身不标红。',a:'点 P2 → 更多 → 试一个假设',
  tgt:()=>'.card[data-id="p2"]',ok:()=>S.hypo==='p2'},
 {t:'5 / 6 · 选作用范围，保存为我的路径',p:'这项前提被 I1、I3 两步共用。按 D66 不得静默写入全部引用——先勾选要改的推导（或明确点「全部 2 步」），再生成局部版本。落盘后画布下方出现虚线框的「本路径局部」副本。',a:'点横幅「保存为我的路径」→ 勾选 I1 → 只改所选',
  tgt:()=>'#hypoWrap',ok:()=>S.paths.length>0},
 {t:'6 / 6 · 与作者原版逐项对照',p:'顶栏「对照整理原版」并排显示基线与你的路径，并保留整步推导的立场与理由。',a:'点顶栏「对照整理原版」',
  tgt:()=>'#btnBase',ok:()=>S.sawBase}
];
let ti=0;
function showTour(){
  const s=TOUR[ti],ring=$('#ring'),card=$('#tour');
  $('#tSt').textContent=s.t;$('#tP').textContent=s.p;
  const ok=s.ok();
  $('#tA').innerHTML=`<div class="${ok?'act':'warn'}">${ok?'已完成这一步 · 点「下一步」继续':'要做的：'+s.a}</div>`;
  $('#tNext').disabled=!ok;$('#tNext').textContent=ti===TOUR.length-1?'完成':(ok?'下一步':'待完成');
  $('#tPrev').style.visibility=ti?'visible':'hidden';
  const el=$(s.tgt());
  if(el){el.scrollIntoView({block:'center',behavior:'smooth'});
    setTimeout(()=>{const r=el.getBoundingClientRect();
      ring.style.left=(r.left-6)+'px';ring.style.top=(r.top-6)+'px';ring.style.width=(r.width+12)+'px';ring.style.height=(r.height+12)+'px';
      card.style.top=Math.max(12,Math.min(r.bottom+14,window.innerHeight-card.offsetHeight-16))+'px';
      card.style.left=Math.max(12,Math.min(r.left,window.innerWidth-350))+'px';},40);}
  ring.classList.add('on');card.classList.add('on');
}
function tick(){if($('#tour').classList.contains('on'))showTour();}
$('#btnTour').onclick=()=>{ti=0;showTour();};
$('#tNext').onclick=()=>{if(ti<TOUR.length-1){ti++;showTour();}else{$('#ring').classList.remove('on');$('#tour').classList.remove('on');alert('引导结束。这是设计 C：画布为主研究空间，语义密度可调、整步推导升格为可点击的块。右上角可切换到 A 列表或 B 审阅台，走同一条任务序列。');}};
$('#tPrev').onclick=()=>{if(ti>0){ti--;showTour();}};
$('#tSkip').onclick=()=>{$('#ring').classList.remove('on');$('#tour').classList.remove('on');};
window.addEventListener('resize',tick);
render();
setTimeout(()=>$('#btnTour').click(),300);
</script>
</body>
</html>
