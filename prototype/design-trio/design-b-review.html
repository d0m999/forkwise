<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>见岔 · 设计 B｜判断优先（审阅台）</title>
<style>
:root{--bg:#FBFAF8;--surface:#fff;--s2:#F4F2ED;--s3:#EDEBE4;--bd:#E3E0D8;--bd2:#C9C5BA;--tx:#24231F;--tx2:#6B675E;--tx3:#968F83;--ac:#2F6FB5;--acS:#E8F1FA;--ok:#3F7A2E;--okS:#E7F2E1;--wn:#9A6A16;--wnS:#FBF0DC;--bd3:#B23B3B;--bdS:#FBE9E9;--id:#6B675E;--idS:#F0EEE8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.6 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--bd);border-radius:8px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--bd2)}
button.primary{background:var(--ac);border-color:var(--ac);color:#fff}
button.primary:disabled{background:var(--bd2);border-color:var(--bd2);cursor:not-allowed}
button.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
button.ghost:hover{background:var(--s2);border-color:var(--bd)}
textarea{font:inherit;border:1px solid var(--bd);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--tx);width:100%}
textarea:focus{outline:2px solid var(--acS);border-color:var(--ac)}

.top{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--bd)}
.brand{font-weight:500;letter-spacing:.5px}
.spacer{flex:1}
.save{font-size:12px;color:var(--tx2)}
.sw{display:flex;gap:2px;background:var(--s2);border-radius:8px;padding:2px}
.sw button{border:0;background:transparent;padding:3px 9px;font-size:12px;color:var(--tx2);border-radius:6px}
.sw button.on{background:var(--surface);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.06)}

.strip{margin:14px 16px 0;padding:10px 14px;border-radius:10px;background:var(--wnS);border:1px solid #E8D3A8;font-size:12.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.strip b{font-weight:500}
.strip .r{margin-left:auto;display:flex;gap:8px;color:var(--wn)}
.chipb{background:var(--surface);border:1px solid #E8D3A8;border-radius:6px;padding:1px 7px}

.wrap{max-width:940px;margin:0 auto;padding:14px 16px 0}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.cbody{display:grid;grid-template-columns:1.05fr 1fr 0.95fr}
.cside{padding:14px 16px}
.cside+.cside{border-left:1px solid var(--bd)}
.legend{font-size:11px;color:var(--tx3);padding:6px 16px 8px;border-bottom:1px solid var(--bd)}
.legend b{font-weight:500;color:var(--tx2)}
.p-ref{background:var(--s2);color:var(--tx2);border-color:var(--bd)}
.p-aic{background:var(--wnS);color:var(--wn);border-color:#E8D3A8;border-style:dashed}
.p-mine{background:var(--acS);color:var(--ac);border-color:#BFD6EE}
.p-edited{background:#EFEDE7;color:#5F5E5A;border-color:var(--bd2)}
.p-corrected{background:var(--s3);color:var(--tx2);border-color:var(--bd)}
.evscroll{max-height:300px;overflow:auto}
.fold{margin-top:12px;border-top:1px solid var(--bd);padding-top:10px}
.cbl{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:8px}
.cbl.on{border-color:var(--ac);background:var(--acS)}
.kind{font-size:11px;color:var(--tx3)}
.big{font-size:15px;line-height:1.6;margin:6px 0 10px}
.prem{border:1px solid var(--bd);border-radius:8px;background:var(--s2);padding:8px 10px;margin-bottom:6px;font-size:12.5px}
.arrow{text-align:center;color:var(--tx3);font-size:12px;margin:2px 0 6px}
.concl{border:1px solid var(--ac);border-radius:8px;background:var(--acS);padding:8px 10px;font-size:12.5px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.pill{font-size:11px;border-radius:5px;padding:1px 6px;border:1px solid}
.p-origin{background:var(--s2);color:var(--tx2);border-color:var(--bd)}
.p-ai{background:var(--wnS);color:var(--wn);border-color:#E8D3A8}
.p-user{background:var(--acS);color:var(--ac);border-color:#BFD6EE}
.p-local{background:var(--wnS);color:var(--wn);border-color:#E8D3A8;border-style:dashed}
.s-待研究{background:var(--idS);color:var(--id);border-color:var(--bd)}
.s-认可{background:var(--okS);color:var(--ok);border-color:#C6DDB8}
.s-质疑{background:var(--wnS);color:var(--wn);border-color:#E8D3A8}
.s-不认可{background:var(--bdS);color:var(--bd3);border-color:#EDC7C7}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts button{font-size:12px;padding:3px 8px}
.anchor{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:var(--s2);font-size:12px;color:var(--tx2);margin-top:10px}
.evh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.evh .c{margin-left:auto;font-size:11px;color:var(--tx3)}
.evl{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12px;cursor:pointer}
.evl:hover{border-color:var(--bd2)}
.evl .qt{color:var(--tx2);border-left:2px solid var(--bd);padding-left:8px;margin-top:4px}
.evl .src{font-size:11px;color:var(--tx3);margin-top:4px}
.tag{font-size:11px;border-radius:5px;padding:1px 6px;border:1px solid}
.t-支持{background:var(--okS);color:var(--ok);border-color:#C6DDB8}
.t-相反{background:var(--bdS);color:var(--bd3);border-color:#EDC7C7}
.t-缺口,.t-待查,.t-未查证{background:var(--wnS);color:var(--wn);border-color:#E8D3A8}
.t-限定{background:var(--acS);color:var(--ac);border-color:#BFD6EE}
.stances{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.stances button{padding:9px 4px;text-align:center;position:relative}
.stances button.on{outline:2px solid var(--ac)}
.kbd{position:absolute;top:2px;left:5px;font-size:10px;color:var(--tx3)}
.field{margin-top:10px}
.field label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.row{display:flex;gap:6px;margin-top:10px}
.note{font-size:11.5px;color:var(--tx3);margin-top:10px;line-height:1.7}
.foot{max-width:940px;margin:0 auto;padding:12px 16px 20px;display:flex;align-items:center;gap:10px}
.foot .pg{font-size:12px;color:var(--tx2)}
.foot .sp{flex:1}
.k{font-size:11px;color:var(--tx3);border:1px solid var(--bd);border-radius:5px;padding:1px 5px;background:var(--s2)}
.hypo{margin:14px 16px 0;padding:10px 14px;border-radius:10px;background:var(--wnS);border:1px solid #E8D3A8;font-size:12.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hypo ul{margin:6px 0 0;padding-left:18px;color:var(--wn)}
.mask{position:fixed;inset:0;background:rgba(30,28,24,.45);z-index:800;display:none;align-items:center;justify-content:center;padding:24px}
.mask.on{display:flex}
.modal{background:var(--surface);border-radius:12px;max-width:760px;width:100%;max-height:84vh;overflow:auto;border:1px solid var(--bd)}
.mh{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.mh .t{font-weight:500}.mh .x{margin-left:auto}
.mb{padding:16px}
.lane{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px;background:var(--s2)}
.lane .ttl{font-size:12px;color:var(--tx2);margin-bottom:8px}
.trk{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.blk{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:12px;min-width:120px}
.blk.step{border-color:var(--ac);background:var(--acS);min-width:150px}
.blk.ev{border-color:#E8D3A8;background:var(--wnS);min-width:120px}
.blk .lb{font-size:11px;color:var(--tx3);margin-bottom:3px}
.conn{display:flex;align-items:center;color:var(--tx3)}
#ring{position:fixed;border:2px solid var(--ac);border-radius:10px;box-shadow:0 0 0 9999px rgba(28,26,22,.45);pointer-events:none;z-index:900;display:none;transition:all .22s ease}
#tour{position:fixed;z-index:901;width:330px;background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.14)}
#tour.on,#ring.on{display:block}
#tour .st{font-size:11px;color:var(--ac)}
#tour h3{margin:2px 0 6px;font-size:14px;font-weight:500}
#tour p{margin:0 0 8px;font-size:12.5px;color:var(--tx2);line-height:1.65}
#tour .act{font-size:12px;background:var(--acS);border:1px solid #BFD6EE;border-radius:7px;padding:6px 8px;color:#1B4E85}
#tour .warn{font-size:12px;background:var(--wnS);border:1px solid #E8D3A8;border-radius:7px;padding:6px 8px;color:var(--wn)}
#tour .btns{display:flex;gap:6px;margin-top:10px;align-items:center}
#tour .btns .sp{flex:1}
</style>
</head>
<body>
<header class="top">
  <div class="brand">见岔</div>
  <span style="font-size:12px;color:var(--tx2)">Intel 代工前提 · 这位 KOL 的核心判断依赖哪些前提，我认可哪些、质疑哪些？</span>
  <div class="spacer"></div>
  <button class="ghost" id="btnBase">对照整理原版</button>
  <span class="save" id="saveState">已保存</span>
  <div class="sw">
    <button onclick="location.href='design-a-lineage.html'">列表</button>
    <button onclick="location.href='design-c-canvas.html'">画布</button>
    <button class="on">审阅台</button>
  </div>
  <button class="primary" id="btnTour">引导</button>
</header>

<div class="strip">
  <b>本轮整理</b> 6 主张 / 3 步推导
  <div class="r">
    <span class="chipb">已查证 2</span><span class="chipb">证据不足 1</span><span class="chipb">待核对 3</span><span class="chipb">未查证 2</span>
  </div>
</div>

<div id="hypoBox"></div>

<div class="wrap">
  <div class="card">
    <div class="legend"><b>内容起点</b> 来源／用户／AI　·　<b>研究参与</b> 参考内容／AI 候选／个人研究项　·　<b>我已编辑</b>　——　两组维度分开，看到不等于采用</div>
    <div class="cbody">
      <div class="cside" id="left"></div>
      <div class="cside" id="mid"></div>
      <div class="cside" id="right"></div>
    </div>
  </div>
</div>

<div class="foot">
  <button id="bPrev">上一项</button>
  <span class="pg" id="pg"></span>
  <button id="bNext">下一项</button>
  <span class="sp"></span>
  <span class="k">J</span><span class="k">K</span> 切换　<span class="k">1</span><span class="k">2</span><span class="k">3</span><span class="k">4</span> 表态　<span class="k">⏎</span> 保存并进下一条
  <button class="primary" id="bGraph">G · 看图</button>
</div>

<div class="mask" id="srcMask"><div class="modal"><div class="mh"><span class="t" id="srcT"></span><button class="ghost x" onclick="closeSrc()">关闭</button></div><div class="mb" id="srcB"></div></div></div>
<div class="mask" id="gMask"><div class="modal"><div class="mh"><span class="t">全图（派生视图）</span><button class="ghost x" onclick="closeG()">关闭</button></div><div class="mb" id="gB"></div></div></div>
<div class="mask" id="baseMask"><div class="modal"><div class="mh"><span class="t">对照整理原版</span><button class="ghost x" onclick="closeBase()">关闭</button></div><div class="mb" id="baseB"></div></div></div>
<div class="mask" id="rngMask"><div class="modal"><div class="mh"><span class="t">选择作用范围（D66）</span><button class="ghost x" onclick="closeRange()">关闭</button></div><div class="mb" id="rngB"></div></div></div>

<div id="ring"></div>
<div id="tour"><div class="st" id="tSt"></div><h3 id="tT"></h3><p id="tP"></p><div id="tA"></div>
  <div class="btns"><button class="ghost" id="tPrev">上一步</button><span class="sp"></span><button class="ghost" id="tSkip">跳过引导</button><button class="primary" id="tNext">下一步</button></div></div>

<script>
const DATA={
 materials:[{id:'M1',t:'X 归档 · @ShanghaoJin 主帖',m:'发布 2025-08-14 · 摘录'},
  {id:'M2',t:'Intel 2025 Q2 财报',m:'业务期间 2025 Q2 · 摘录 P24'},
  {id:'M3',t:'新闻 · 良率传闻',m:'发布 2025-09-02 · 摘录'}],
 claims:{c1:{text:'Intel 18A 会拿到外部大客户订单',origin:'来源',kind:'结论'},
  p1:{text:'18A 按期量产（2025 年内进入风险试产）',origin:'来源'},
  p2:{text:'良率达到可比水平',origin:'来源'},
  p3:{text:'客户有动机扶持第二家先进制程供应商',origin:'来源'},
  c2:{text:'代工业务亏损将在 2026 收窄',origin:'来源',kind:'结论'},
  p4:{text:'资本开支已见顶',origin:'AI'}},
 steps:[{id:'i1',to:'c1',from:['p1','p2'],combo:'共同依赖',origin:'来源'},
  {id:'i2',to:'c1',from:['p3'],combo:'独立支持',origin:'来源'},
  {id:'i3',to:'c2',from:['p1','p4'],combo:'共同依赖',origin:'AI'}],
 evidence:{c1:[{t:'限定',s:'M2 · Intel 2025 Q2 财报 P24',q:'外部客户承诺取决于 18A 进度',a:'P24 §代工'}],
  p1:[{t:'支持',s:'M2 · Intel 2025 Q2 财报 P24',q:'18A remains on track for risk production in 2025',a:'P24 §代工'},
      {t:'相反',s:'M3 · 新闻 2025-09-02',q:'两名知情人士称良率仍低于内部目标',a:'正文第 3 段'},
      {t:'缺口',s:'—',q:'量产具体日期未公开披露',a:'—'}],
  p2:[{t:'缺口',s:'—',q:'未找到可比良率的公开披露，无法核验',a:'—'}],
  p3:[{t:'支持',s:'M1 · X 归档 2025-08-14',q:'没有一家客户愿意只剩一个先进制程来源',a:'主帖第 4 段'}],
  i2:[{t:'支持',s:'M1 · X 归档 2025-08-14',q:'（同一段，作为独立支持）',a:'主帖第 4 段'}],
  c2:[{t:'待查',s:'—',q:'尚未发起查证',a:'—'}],
  i1:[{t:'未查证',s:'—',q:'尚未发起查证',a:'—'}],
  i3:[{t:'待查',s:'—',q:'尚未发起查证',a:'—'}],
  p4:[{t:'未查证',s:'—',q:'AI 推断，原文未表达',a:'—'}]}
};
const QUEUE=['c1','i1','p1','p2','i2','p3','c2','i3','p4'];
const STANCES=['待研究','认可','质疑','不认可'];
const S={i:0,stance:{},reason:{},draft:{},part:{},edited:{},corrected:{},revisions:[],hypo:null,paths:[],openedEv:false,sawGraph:false,sawBase:false,dirty:false,nav:0};
QUEUE.forEach(id=>{S.stance[id]='待研究';
  const st=DATA.steps.find(s=>s.id===id);
  S.part[id]=st?(st.origin==='AI'?'AI 候选':'参考内容'):(DATA.claims[id].origin==='AI'?'AI 候选':'参考内容');});
const partCls=p=>p==='AI 候选'?'p-aic':p==='个人研究项'?'p-mine':'p-ref';
function marks(id){let h=`<span class="pill ${partCls(S.part[id])}">${S.part[id]}</span>`;
  if(S.edited[id])h+='<span class="pill p-edited">我已编辑</span>';
  if(S.corrected[id])h+='<span class="pill p-corrected">已校正</span>';return h;}
const affectedSteps=()=>S.hypo?DATA.steps.filter(s=>s.from.includes(S.hypo)):[];
const retainedSteps=()=>{const a=affectedSteps();return a.length?DATA.steps.filter(s=>!s.from.includes(S.hypo)&&a.some(x=>x.to===s.to)):[];};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cur=()=>QUEUE[S.i], isStep=()=>DATA.steps.some(s=>s.id===cur()), curStep=()=>DATA.steps.find(s=>s.id===cur());

function render(){
  const id=cur(),L=$('#left'),R=$('#right');
  if(isStep()){
    const s=curStep();
    L.innerHTML=`<div class="kind">推导关系 · ${s.combo} · 整步为一个标注单位</div>
      <div class="big">${s.from.map(f=>DATA.claims[f].text).join(' ＋ ')}</div>
      <div class="arrow">↓ 这一步推导</div>
      <div class="concl">${esc(DATA.claims[s.to].text)}</div>
      <div class="badges"><span class="pill p-${s.origin==='AI'?'ai':'origin'}">${s.origin}</span>${marks(id)}<span class="pill s-${S.stance[id]}">整步立场：${S.stance[id]}</span></div>
      <div class="acts"><button onclick="askAI()">检查这一步</button><button onclick="openSrc()">查看已保存摘录</button></div>
      <div class="anchor">前提组合：${s.combo}　·　未说明组合关系时不自动判定，AI 补充标为 AI 推断</div>`;
  }else{
    const c=DATA.claims[id];
    L.innerHTML=`<div class="kind">主张 · ${c.kind||'前提'}</div>
      <div class="big">${esc(c.text)}</div>
      <div class="badges"><span class="pill p-${c.origin==='AI'?'ai':c.origin==='来源'?'origin':'user'}">${c.origin}</span>${marks(id)}<span class="pill s-${S.stance[id]}">${S.stance[id]}</span></div>
      <div class="acts"><button onclick="rewrite()">改写</button><button onclick="openSrc()">查看已保存摘录</button>${c.origin==='来源'?'<button onclick="correct()">校正整理结果</button>':''}<button onclick="hypo()">试一个假设</button></div>
      <div class="anchor">原文锚点：${esc((DATA.evidence[id]||[]).map(e=>e.a).filter(a=>a!=='—').join('、')||'尚无已保存锚点')}</div>`;
  }
  const ev=DATA.evidence[id]||[];
  const n=k=>ev.filter(e=>e.t===k).length;
  const M=$('#mid');
  M.innerHTML=`<div class="evh"><span style="font-size:12px;color:var(--tx2)">依据 · 查证摘要（左）</span><span class="c">支持 ${n('支持')} · 相反 ${n('相反')} · 缺口/待查 ${n('缺口')+n('待查')+n('未查证')}</span></div>
    <div class="evscroll">${ev.length?ev.map((e,i)=>`<div class="evl" onclick="openSrc(${i})"><span class="tag t-${e.t}">${e.t}</span> <span style="font-size:12px">${esc(e.s==='—'?'未取得资料':e.s)}</span><div class="qt">${esc(e.q)}</div><div class="src">锚点：${esc(e.a)}</div></div>`).join(''):'<div style="font-size:12px;color:var(--tx3)">暂无依据</div>'}</div>`;
  const d=S.draft[id],rv=S.revisions.filter(r=>r.id===id);
  R.innerHTML=`<div class="evh"><span style="font-size:12px;color:var(--tx2)">个人立场与判断（右）</span>${d?'<span class="c">草稿未保存</span>':''}</div>
    <div class="stances">${STANCES.map((s,k)=>`<button class="${(d||S.stance[id])===s?'on':''}" onclick="pick('${s}')"><span class="kbd">${k+1}</span>${s}</button>`).join('')}</div>
    <div class="field"><label>理由${(d==='质疑'||d==='不认可')?'（必填）':'（认可选填）'}</label><textarea id="rsn" rows="3" placeholder="写一句具体疑问或依据">${esc(S.reason[id]||'')}</textarea></div>
    <div class="row"><button class="primary" onclick="saveStance()">保存立场</button><button class="ghost" onclick="cancelStance()">取消草稿</button></div>
    <p class="note">选择只形成草稿，明确保存后才更新卡片；该对象同时从「参考内容」变为「个人研究项」。尚未查证、失败或资料不足时也能先表达立场。</p>
    <div class="fold"><div style="font-size:12px;color:var(--tx2);cursor:pointer" onclick="var n=this.nextElementSibling;n.style.display=n.style.display==='none'?'block':'none'">修改记录（${rv.length}）· 点击展开</div>
    <div style="display:none">${rv.length?rv.map(r=>`<div style="border-left:2px solid var(--bd);padding-left:10px;margin-bottom:8px"><div style="font-size:11px;color:var(--tx3)">${r.tm}</div><div style="font-size:12px">${esc(r.ch)}</div></div>`).join(''):'<div style="font-size:12px;color:var(--tx3)">尚无修改记录</div>'}</div></div>`;
  $('#pg').textContent=`第 ${S.i+1} / ${QUEUE.length} 项 · ${isStep()?'整步推导 '+cur().toUpperCase():'主张 '+cur().toUpperCase()}`;
  const aff=affectedSteps(),ret=retainedSteps();
  $('#hypoBox').innerHTML=S.hypo?`<div class="hypo"><b>假设预览：</b>「${esc(DATA.claims[S.hypo].text)}」不成立
    <ul><li>受影响（整步推导）：${aff.map(s=>s.id.toUpperCase()+' · 失去这组前提的联合支持').join('、')||'无'}</li>
    <li>仍保留（独立支持同一结论）：${ret.map(s=>s.id.toUpperCase()+' → '+esc(DATA.claims[s.to].text)).join('、')||'无'}</li>
    <li>前提本身不标红；结论未被证伪；退出后原判断与立场不变</li></ul>
    <div style="margin-left:auto;display:flex;gap:6px"><button class="primary" onclick="savePath()">保存为我的路径</button><button onclick="exitHypo()">退出假设</button></div></div>`:'';
  $('#saveState').textContent=S.dirty?'保存中…':'已保存';
}
function pick(s){const id=cur();S.draft[id]=s;render();tick();}
function saveStance(){
  const id=cur(),v=S.draft[id],r=$('#rsn').value.trim();
  if(!v){alert('先选择一个立场。');return;}
  if((v==='质疑'||v==='不认可')&&!r){alert('质疑或不认可必须填写一句具体理由。');return;}
  const prev=S.stance[id],prevR=S.reason[id]||'';
  S.stance[id]=v;S.reason[id]=r;delete S.draft[id];
  if(prev!==v||prevR!==r){S.revisions.unshift({id,tm:'2026-10-06 00:0'+(S.revisions.length+1),ch:'立场：'+prev+' → '+v+(r?'（理由：'+r+'）':'')});}
  S.part[id]='个人研究项';S.dirty=false;render();tick();
  if(S.i<QUEUE.length-1){S.i++;render();tick();}
}
function cancelStance(){delete S.draft[cur()];render();}
function rewrite(){
  const id=cur();if(isStep()){alert('推导关系的编辑走「说明」入口。');return;}
  const v=prompt('改写这项主张的正文（普通改写不填修改理由，改前改后自动记录）：',DATA.claims[id].text);
  if(v===null||!v.trim())return;
  DATA.claims[id].text=v.trim();S.edited[id]=true;S.part[id]='个人研究项';S.dirty=false;render();tick();
}
function openSrc(i){
  const id=cur(),ev=DATA.evidence[id]||[];const e=ev[i||0];
  if(!e){alert('当前对象没有已保存摘录。');return;}
  S.openedEv=true;
  $('#srcT').textContent='已保存摘录 · '+e.s;
  $('#srcB').innerHTML=`<div style="font-size:12px;color:var(--tx2);margin-bottom:8px">范围：摘录（完整原文未提供）· 获取时间 2025-09-10 · 引用锁定该版本</div>
   <div style="border:1px solid var(--bd);border-radius:8px;padding:12px;background:var(--s2);font-size:13px;line-height:1.8">${esc(e.q)}</div>
   <div style="margin-top:10px;font-size:12px;color:var(--tx3)">锚点：${esc(e.a)}</div>
   <div class="row"><button class="ghost" onclick="alert('原始网页需本人主动在新标签打开；它是网站当前内容，不等于引用时的版本。')">打开原始网页</button><button class="primary" onclick="closeSrc()">返回审阅卡</button></div>`;
  $('#srcMask').classList.add('on');tick();
}
function closeSrc(){$('#srcMask').classList.remove('on');}
function correct(){S.corrected[cur()]=true;alert('仅校正未个人改写的来源对象：误读、字句与日期。不改原始材料与初始基线；正文校正后旧查证留在旧版本。校正记录与「我已编辑」分别保留。');render();}
function askAI(){alert('固定检查框架：前提完整性 / 推导依据 / 证据支持 / 反例。AI 只提问题，不改判断；未解问题可留待查。');}
function hypo(){
  const id=cur();
  if(!DATA.steps.some(s=>s.from.includes(id))){alert('这项主张尚未作为前提用于任何推导。');return;}
  S.hypo=id;render();tick();
}
function exitHypo(){S.hypo=null;render();tick();}
function savePath(){if(S.hypo)openRange();}
function openRange(){
  const steps=affectedSteps();
  $('#rngB').innerHTML=`<p style="font-size:12.5px;color:var(--tx2);margin:0 0 10px">「${esc(DATA.claims[S.hypo].text)}」被 <b>${steps.length}</b> 步推导共用。按 D66，没有明确范围不得静默写入全部引用——请勾选要生成本路径局部版本的推导。</p>
   ${steps.map((s,i)=>`<div class="cbl" data-i="${i}" onclick="this.classList.toggle('on')"><span class="combo">${s.id.toUpperCase()}</span><span style="font-size:12px">→ ${esc(DATA.claims[s.to].text)}</span><span class="pill ${partCls(S.part[s.id])}">${S.part[s.id]}</span></div>`).join('')}
   <p style="font-size:11.5px;color:var(--tx3);margin:8px 0 0">未勾选的推导继续保留原前提；新版本默认「待研究」（D32）。</p>
   <div class="row"><button class="primary" onclick="applyRange(false)">只改所选</button><button onclick="applyRange(true)">全部 ${steps.length} 步</button><button class="ghost" onclick="closeRange()">取消</button></div>`;
  $('#rngMask').classList.add('on');
}
function applyRange(all){
  const steps=affectedSteps();
  const sel=all?steps:[...document.querySelectorAll('#rngB .cbl.on')].map(e=>steps[+e.dataset.i]);
  if(!sel.length){alert('请至少勾选一步推导，或明确选择「全部」。');return;}
  const name='路径 A · 良率不及预期';
  sel.forEach(s=>S.paths.push({step:s.id,path:name,text:'（本路径局部）'+DATA.claims[S.hypo].text+' 不成立 · 新版本默认待研究'}));
  S.revisions.unshift({id:S.hypo,tm:'2026-10-06 00:0'+(S.revisions.length+1),ch:'实质改写：为 '+sel.map(s=>s.id.toUpperCase()).join('、')+' 生成「'+name+'」局部版本；其余推导保留原前提'});
  S.hypo=null;S.dirty=false;closeRange();render();tick();
}
function closeRange(){$('#rngMask').classList.remove('on');}
function openG(){
  S.sawGraph=true;
  const lane=s=>`<div class="lane"><div class="ttl">${s.id.toUpperCase()} · ${s.combo}</div><div class="trk">
    <div class="blk"><div class="lb">前提组</div>${s.from.map(f=>esc(DATA.claims[f].text)).join('<br>')}</div>
    <div class="conn">→</div>
    <div class="blk step"><div class="lb">整步推导 · ${S.stance[s.id]}</div>${S.reason[s.id]?esc(S.reason[s.id]):'（无理由）'}</div>
    <div class="conn">→</div>
    <div class="blk"><div class="lb">结论</div>${esc(DATA.claims[s.to].text)}</div></div></div>`;
  $('#gB').innerHTML=DATA.steps.map(lane).join('')+
   (S.paths.length?`<div class="lane" style="background:var(--wnS);border-color:#E8D3A8"><div class="ttl">我的路径</div>${S.paths.map(p=>esc(p.path)+'：'+esc(p.text)).join('<br>')}</div>`:'');
  $('#gMask').classList.add('on');tick();
}
function closeG(){$('#gMask').classList.remove('on');}
function openBase(){
  S.sawBase=true;
  $('#baseB').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
   <div style="border:1px solid var(--bd);border-radius:8px;padding:10px"><div style="font-size:12px;color:var(--tx2);margin-bottom:6px">作者原版（整理基线）</div>
   <div style="font-size:12.5px;line-height:1.9">18A 按期量产 ＋ 良率达可比水平<br>[&amp;] 共同依赖 → Intel 18A 会拿到外部大客户订单<br>客户有动机扶持第二供应商 [|] 独立支持 → 同一结论</div></div>
   <div style="border:1px solid var(--bd);border-radius:8px;padding:10px"><div style="font-size:12px;color:var(--tx2);margin-bottom:6px">我的路径</div>
   <div style="font-size:12.5px;line-height:1.9">${S.paths.length?S.paths.map(p=>esc(p.path)+'：<br>'+esc(p.text)).join('<br>'):'尚未保存个人条件路径'}</div>
   <div style="margin-top:8px">整步推导 I1：${S.stance.i1}${S.reason.i1?'（'+esc(S.reason.i1)+'）':''}</div></div></div>
   <p style="font-size:11.5px;color:var(--tx3);margin-top:12px">基线在自动整理时保留，不随后续整理或作者更新自动替换。</p>`;
  $('#baseMask').classList.add('on');tick();
}
function closeBase(){$('#baseMask').classList.remove('on');}
$('#btnBase').onclick=openBase;$('#bGraph').onclick=openG;
$('#bPrev').onclick=()=>{if(S.i>0){S.i--;S.nav++;render();tick();}};
$('#bNext').onclick=()=>{if(S.i<QUEUE.length-1){S.i++;S.nav++;render();tick();}};
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==='j'||e.key==='J'){S.i=Math.min(QUEUE.length-1,S.i+1);S.nav++;render();tick();}
  if(e.key==='k'||e.key==='K'){S.i=Math.max(0,S.i-1);S.nav++;render();tick();}
  if(['1','2','3','4'].includes(e.key)){pick(STANCES[+e.key-1]);}
  if(e.key==='g'||e.key==='G'){openG();}
  if(e.key==='Enter'&&$('#rsn')){saveStance();}
});

const TOUR=[
 {t:'1 / 6 · 第一张卡是作者的结论',p:'流程从 AI 整理的结果开始，所以第一屏是待处理队列，不是空画布。队列按 J/K 走，一次只审一个对象。',a:'确认当前是第 1 项（结论 C1），点「下一项」或按 J 进入整步推导 I1 再按 K 回来',
  tgt:()=>'.card',ok:()=>S.nav>=2&&S.i===0},
 {t:'2 / 6 · 回查原文锚点',p:'用 J 走到 P1「18A 按期量产」，左侧列出支持、相反与缺口。点任意一条依据，看已保存摘录与锚点——支持与相反依据并存，不压成通过或失败。',a:'按 J 两次到 P1，点右侧一条依据',
  tgt:()=>'#left',ok:()=>cur()==='p1'&&S.openedEv},
 {t:'3 / 6 · 对整步推导表态',p:'回到 I1（共同依赖那一步）。右侧是判断区：按 3 选「质疑」只形成<b>草稿</b>，卡片上的立场标签不变；填理由后点「保存立场」才更新，同时该对象从「参考内容」变「个人研究项」。',a:'按 3 → 填理由 → 保存立场',
  tgt:()=>'#right',ok:()=>S.stance.i1==='质疑'&&!!S.reason.i1},
 {t:'4 / 6 · 试一个假设',p:'走到 P2「良率达到可比水平」，点「试一个假设」。横幅只标<b>整步推导</b>：受影响的 I1 失去这组前提的联合支持，仍保留的 I2 是独立支持同一结论的那一步。',a:'点左下「试一个假设」',
  tgt:()=>'#hypoBox',ok:()=>S.hypo==='p2'},
 {t:'5 / 6 · 选作用范围，保存为我的路径',p:'这项前提被 I1、I3 两步共用。按 D66 不得静默写入全部引用——先勾选要改的推导（或明确点「全部 2 步」），再生成局部版本。',a:'点横幅「保存为我的路径」→ 勾选 I1 → 只改所选',
  tgt:()=>'#hypoBox',ok:()=>S.paths.length>0},
 {t:'6 / 6 · 看图，并与原版对照',p:'按 G 打开全图：在审阅台里图是派生视图，只在需要看整体和比较多条路径时才出现。再用顶栏「对照整理原版」逐项比较。',a:'按 G 看图，再点顶栏「对照整理原版」',
  tgt:()=>'#bGraph',ok:()=>S.sawGraph&&S.sawBase}
];
let ti=0;
function showTour(){
  const s=TOUR[ti],ring=$('#ring'),card=$('#tour');
  $('#tSt').textContent=s.t;$('#tP').textContent=s.p;
  const ok=s.ok();
  $('#tA').innerHTML=`<div class="${ok?'act':'warn'}">${ok?'已完成这一步 · 点「下一步」继续':'要做的：'+s.a}</div>`;
  $('#tNext').disabled=!ok;$('#tNext').textContent=ti===TOUR.length-1?'完成':(ok?'下一步':'待完成');
  $('#tPrev').style.visibility=ti?'visible':'hidden';
  const el=$(s.tgt());
  if(el){el.scrollIntoView({block:'center',behavior:'smooth'});
    setTimeout(()=>{const r=el.getBoundingClientRect();
      ring.style.left=(r.left-6)+'px';ring.style.top=(r.top-6)+'px';ring.style.width=(r.width+12)+'px';ring.style.height=(r.height+12)+'px';
      card.style.top=Math.max(12,Math.min(r.bottom+14,window.innerHeight-card.offsetHeight-16))+'px';
      card.style.left=Math.min(r.left,window.innerWidth-350)+'px';},40);}
  ring.classList.add('on');card.classList.add('on');
}
function tick(){if($('#tour').classList.contains('on'))showTour();}
$('#btnTour').onclick=()=>{ti=0;showTour();};
$('#tNext').onclick=()=>{if(ti<TOUR.length-1){ti++;showTour();}else{$('#ring').classList.remove('on');$('#tour').classList.remove('on');alert('引导结束。这是设计 B：审阅台为入口，全图为派生视图。右上角可切换到 A 列表或 C 画布语义层，走同一条任务序列。');}};
$('#tPrev').onclick=()=>{if(ti>0){ti--;showTour();}};
$('#tSkip').onclick=()=>{$('#ring').classList.remove('on');$('#tour').classList.remove('on');};
window.addEventListener('resize',tick);
render();
setTimeout(()=>$('#btnTour').click(),300);
</script>
</body>
