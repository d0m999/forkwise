<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>见岔 · 设计 A｜论证脉络（三栏溯源工作台）</title>
<style>
:root{--bg:#FBFAF8;--surface:#fff;--s2:#F4F2ED;--s3:#EDEBE4;--bd:#E3E0D8;--bd2:#C9C5BA;--tx:#24231F;--tx2:#6B675E;--tx3:#968F83;--ac:#2F6FB5;--acS:#E8F1FA;--ok:#3F7A2E;--okS:#E7F2E1;--wn:#9A6A16;--wnS:#FBF0DC;--bd3:#B23B3B;--bdS:#FBE9E9;--id:#6B675E;--idS:#F0EEE8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.6 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--bd);border-radius:8px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--bd2)}
button.primary{background:var(--ac);border-color:var(--ac);color:#fff}
button.primary:disabled{background:var(--bd2);border-color:var(--bd2);cursor:not-allowed}
button.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
button.ghost:hover{background:var(--s2);border-color:var(--bd)}
input,textarea{font:inherit;border:1px solid var(--bd);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--tx);width:100%}
input:focus,textarea:focus{outline:2px solid var(--acS);border-color:var(--ac)}

.top{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--bd)}
.brand{font-weight:500;letter-spacing:.5px}
.proj{display:flex;align-items:baseline;gap:8px;max-width:420px;text-align:left;border-color:transparent}
.proj .nm{font-weight:500}
.proj .q{color:var(--tx3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px}
.spacer{flex:1}
.save{font-size:12px;color:var(--tx2)}
.sw{display:flex;gap:2px;background:var(--s2);border-radius:8px;padding:2px}
.sw button{border:0;background:transparent;padding:3px 9px;font-size:12px;color:var(--tx2);border-radius:6px}
.sw button.on{background:var(--surface);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.06)}

main{display:grid;grid-template-columns:236px 1fr 320px;gap:0;height:calc(100% - 48px)}
.col{overflow:auto;border-right:1px solid var(--bd);display:flex;flex-direction:column}
.col:last-child{border-right:0}
.colhead{padding:10px 14px 8px;font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);z-index:2}
.colhead .hint{margin-left:auto;color:var(--tx3);font-size:11px}
.pad{padding:0 10px 12px}

.mi{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:var(--surface)}
.mi .t{font-size:12.5px}
.mi .m{font-size:11px;color:var(--tx3);margin-top:2px}

.tr{padding:4px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid transparent}
.tr:hover{background:var(--s2)}
.tr.sel{background:var(--acS);border-color:var(--ac)}
.tr.lv1{padding-left:26px}
.tr.lv2{padding-left:46px}
.tr .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr.concl .tx{font-weight:500}
.combo{font-size:11px;color:var(--tx2);border:1px solid var(--bd);border-radius:5px;padding:0 5px;flex:none;background:var(--s2)}
.pill{font-size:11px;border-radius:5px;padding:1px 6px;flex:none;border:1px solid}
.p-origin{background:var(--s2);color:var(--tx2);border-color:var(--bd)}
.p-ai{background:var(--wnS);color:var(--wn);border-color:#E8D3A8}
.p-user{background:var(--acS);color:var(--ac);border-color:#BFD6EE}
.p-local{background:var(--wnS);color:var(--wn);border-color:#E8D3A8;border-style:dashed}
.s-待研究{background:var(--idS);color:var(--id);border-color:var(--bd)}
.s-认可{background:var(--okS);color:var(--ok);border-color:#C6DDB8}
.s-质疑{background:var(--wnS);color:var(--wn);border-color:#E8D3A8}
.s-不认可{background:var(--bdS);color:var(--bd3);border-color:#EDC7C7}
.tr.affected{background:var(--bdS);border-color:#EDC7C7}
.tr.retained{background:var(--okS);border-color:#C6DDB8}
.tr .flag{font-size:11px;color:var(--tx3);flex:none}
.tr.sel .tx{white-space:normal;text-overflow:clip;overflow:visible}
.p-ref{background:var(--s2);color:var(--tx2);border-color:var(--bd)}
.p-aic{background:var(--wnS);color:var(--wn);border-color:#E8D3A8;border-style:dashed}
.p-mine{background:var(--acS);color:var(--ac);border-color:#BFD6EE}
.p-edited{background:#EFEDE7;color:#5F5E5A;border-color:var(--bd2)}
.p-corrected{background:var(--s3);color:var(--tx2);border-color:var(--bd)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0}
.duo>div{padding:12px 14px}
.duo>div+div{border-left:1px solid var(--bd)}
.duo .h{font-size:12px;color:var(--tx2);margin-bottom:8px}
.evscroll{max-height:280px;overflow:auto}
.fold{margin-top:14px;border-top:1px solid var(--bd);padding-top:10px}
.legend{font-size:11px;color:var(--tx3);padding:6px 10px 8px;border-bottom:1px solid var(--bd);background:var(--bg)}
.legend b{font-weight:500;color:var(--tx2)}
.cbl{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:8px}
.cbl.on{border-color:var(--ac);background:var(--acS)}

.banner{margin:6px 10px 0;padding:8px 10px;border-radius:8px;background:var(--wnS);border:1px solid #E8D3A8;font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.banner b{font-weight:500}
.banner .r{margin-left:auto;display:flex;gap:6px}

.phead{padding:10px 14px;border-bottom:1px solid var(--bd)}
.phead .kind{font-size:11px;color:var(--tx3)}
.phead .txt{font-size:13.5px;margin:2px 0 6px;line-height:1.5}
.phead .acts{display:flex;gap:6px;flex-wrap:wrap}
.phead .acts button{font-size:12px;padding:3px 8px}
.tabs{display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--bd)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--tx2);padding:5px 10px}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.pbody{padding:12px 14px;flex:1}
.ev{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:7px;background:var(--surface);cursor:pointer}
.ev:hover{border-color:var(--bd2)}
.ev .h{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.ev .src{font-size:11px;color:var(--tx3);margin-top:3px}
.ev .qt{font-size:12px;color:var(--tx2);border-left:2px solid var(--bd);padding-left:8px;margin-top:4px}
.tag{font-size:11px;border-radius:5px;padding:1px 6px;border:1px solid}
.t-支持{background:var(--okS);color:var(--ok);border-color:#C6DDB8}
.t-相反{background:var(--bdS);color:var(--bd3);border-color:#EDC7C7}
.t-缺口,.t-待查,.t-未查证{background:var(--wnS);color:var(--wn);border-color:#E8D3A8}
.t-限定{background:var(--acS);color:var(--ac);border-color:#BFD6EE}
.empty{color:var(--tx3);font-size:12px;padding:14px 0;text-align:center}
.stances{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stances button{padding:8px 4px;text-align:center}
.stances button.on{outline:2px solid var(--ac)}
.field{margin-top:10px}
.field label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.row{display:flex;gap:6px;margin-top:10px}
.hist{border-left:2px solid var(--bd);padding-left:10px;margin-bottom:10px}
.hist .tm{font-size:11px;color:var(--tx3)}
.hist .ch{font-size:12px;margin-top:2px}

.mask{position:fixed;inset:0;background:rgba(30,28,24,.42);z-index:800;display:none;align-items:center;justify-content:center;padding:24px}
.mask.on{display:flex}
.modal{background:var(--surface);border-radius:12px;max-width:640px;width:100%;max-height:80vh;overflow:auto;border:1px solid var(--bd)}
.mh{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.mh .t{font-weight:500}
.mh .x{margin-left:auto}
.mb{padding:14px 16px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp>div{border:1px solid var(--bd);border-radius:8px;padding:10px}
.cmp h4{margin:0 0 6px;font-size:12px;color:var(--tx2);font-weight:500}

#ring{position:fixed;border:2px solid var(--ac);border-radius:10px;box-shadow:0 0 0 9999px rgba(28,26,22,.45);pointer-events:none;z-index:900;display:none;transition:all .22s ease}
#tour{position:fixed;z-index:901;width:330px;background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.14)}
#tour.on,#ring.on{display:block}
#tour .st{font-size:11px;color:var(--ac)}
#tour h3{margin:2px 0 6px;font-size:14px;font-weight:500}
#tour p{margin:0 0 8px;font-size:12.5px;color:var(--tx2);line-height:1.65}
#tour .act{font-size:12px;background:var(--acS);border:1px solid #BFD6EE;border-radius:7px;padding:6px 8px;color:#1B4E85}
#tour .warn{font-size:12px;background:var(--wnS);border:1px solid #E8D3A8;border-radius:7px;padding:6px 8px;color:var(--wn)}
#tour .btns{display:flex;gap:6px;margin-top:10px;align-items:center}
#tour .btns .sp{flex:1}
footer{position:fixed;bottom:0;left:0;right:0;height:0}
</style>
</head>
<body>
<header class="top">
  <div class="brand">见岔</div>
  <button class="proj" id="projBtn"><span class="nm">Intel 代工前提</span><span class="q">这位 KOL 的核心判断依赖哪些前提，我认可哪些、质疑哪些？</span></button>
  <div class="spacer"></div>
  <button class="ghost" id="btnBase">对照整理原版</button>
  <span class="save" id="saveState">已保存</span>
  <div class="sw">
    <button class="on">列表</button>
    <button onclick="location.href='design-c-canvas.html'">画布</button>
    <button onclick="location.href='design-b-review.html'">审阅台</button>
  </div>
  <button class="primary" id="btnTour">引导</button>
</header>

<main>
  <aside class="col">
    <div class="colhead">材料 · 按业务期间<span class="hint">3 份</span></div>
    <div class="pad" style="padding-bottom:8px"><input id="matSearch" placeholder="检索全文与锚点"></div>
    <div class="pad" id="matList"></div>
  </aside>

  <section class="col">
    <div class="colhead">论证列表 · 键盘可达<span class="hint">[&amp;] 共同依赖　[|] 独立支持</span></div>
    <div class="legend"><b>内容起点</b> 来源／用户／AI　·　<b>研究参与</b> 参考内容／AI 候选／个人研究项　·　<b>我已编辑</b>　——　两组维度分开，看到不等于采用</div>
    <div id="hypoBanner"></div>
    <div class="pad" id="tree"></div>
  </section>

  <aside class="col">
    <div class="phead" id="phead"></div>
    <div class="pbody" id="pbody"></div>
  </aside>
</main>

<div class="mask" id="srcMask"><div class="modal"><div class="mh"><span class="t" id="srcT"></span><button class="ghost x" onclick="closeSrc()">关闭</button></div><div class="mb" id="srcB"></div></div></div>
<div class="mask" id="baseMask"><div class="modal"><div class="mh"><span class="t">对照整理原版</span><button class="ghost x" onclick="closeBase()">关闭</button></div><div class="mb" id="baseB"></div></div></div>
<div class="mask" id="rngMask"><div class="modal"><div class="mh"><span class="t">选择作用范围（D66）</span><button class="ghost x" onclick="closeRange()">关闭</button></div><div class="mb" id="rngB"></div></div></div>

<div id="ring"></div>
<div id="tour">
  <div class="st" id="tSt"></div>
  <h3 id="tT"></h3>
  <p id="tP"></p>
  <div id="tA"></div>
  <div class="btns">
    <button class="ghost" id="tPrev">上一步</button>
    <span class="sp"></span>
    <button class="ghost" id="tSkip">跳过引导</button>
    <button class="primary" id="tNext">下一步</button>
  </div>
</div>

<script>
const DATA={
 project:{name:'Intel 代工前提',question:'这位 KOL 的核心判断依赖哪些前提，我认可哪些、质疑哪些？'},
 materials:[
  {id:'M1',t:'X 归档 · @ShanghaoJin 主帖',m:'发布 2025-08-14 · 摘录'},
  {id:'M2',t:'Intel 2025 Q2 财报',m:'业务期间 2025 Q2 · 摘录 P24'},
  {id:'M3',t:'新闻 · 良率传闻',m:'发布 2025-09-02 · 摘录'}],
 claims:{
  c1:{text:'Intel 18A 会拿到外部大客户订单',origin:'来源',kind:'结论'},
  p1:{text:'18A 按期量产（2025 年内进入风险试产）',origin:'来源'},
  p2:{text:'良率达到可比水平',origin:'来源'},
  p3:{text:'客户有动机扶持第二家先进制程供应商',origin:'来源'},
  c2:{text:'代工业务亏损将在 2026 收窄',origin:'来源',kind:'结论'},
  p4:{text:'资本开支已见顶',origin:'AI'}},
 steps:[
  {id:'i1',to:'c1',from:['p1','p2'],combo:'共同依赖',origin:'来源'},
  {id:'i2',to:'c1',from:['p3'],combo:'独立支持',origin:'来源'},
  {id:'i3',to:'c2',from:['p1','p4'],combo:'共同依赖',origin:'AI'}],
 concl:['c1','c2'],
 evidence:{
  c1:[{t:'限定',s:'M2 · Intel 2025 Q2 财报 P24',q:'外部客户承诺取决于 18A 进度',a:'P24 §代工'}],
  p1:[{t:'支持',s:'M2 · Intel 2025 Q2 财报 P24',q:'18A remains on track for risk production in 2025',a:'P24 §代工'},
      {t:'相反',s:'M3 · 新闻 2025-09-02',q:'两名知情人士称良率仍低于内部目标',a:'正文第 3 段'},
      {t:'缺口',s:'—',q:'量产具体日期未公开披露',a:'—'}],
  p2:[{t:'缺口',s:'—',q:'未找到可比良率的公开披露，无法核验',a:'—'}],
  p3:[{t:'支持',s:'M1 · X 归档 2025-08-14',q:'没有一家客户愿意只剩一个先进制程来源',a:'主帖第 4 段'}],
  i2:[{t:'支持',s:'M1 · X 归档 2025-08-14',q:'（同一段，作为独立支持）',a:'主帖第 4 段'}],
  c2:[{t:'待查',s:'—',q:'尚未发起查证',a:'—'}],
  i1:[{t:'未查证',s:'—',q:'尚未发起查证',a:'—'}],
  i3:[{t:'待查',s:'—',q:'尚未发起查证',a:'—'}],
  p4:[{t:'未查证',s:'—',q:'AI 推断，原文未表达',a:'—'}]}
};
const STANCES=['待研究','认可','质疑','不认可'];
const S={sel:{k:'claim',id:'c1'},tab:'ev',stance:{},draft:{},reason:{},part:{},edited:{},corrected:{},hypo:null,paths:[],revisions:[],openedEv:false,sawBase:false,clicked:new Set()};
Object.keys(DATA.claims).forEach(id=>{S.stance[id]='待研究';S.part[id]=DATA.claims[id].origin==='AI'?'AI 候选':'参考内容';});
DATA.steps.forEach(s=>{S.stance[s.id]='待研究';S.part[s.id]=s.origin==='AI'?'AI 候选':'参考内容';});
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const objName=sel=>sel.k==='step'?('整步推导 '+sel.id.toUpperCase()+' · '+DATA.steps.find(s=>s.id===sel.id).combo):DATA.claims[sel.id].text;
const partCls=p=>p==='AI 候选'?'p-aic':p==='个人研究项'?'p-mine':'p-ref';
function marks(id){let h=`<span class="pill ${partCls(S.part[id])}">${S.part[id]}</span>`;
  if(S.edited[id])h+='<span class="pill p-edited">我已编辑</span>';
  if(S.corrected[id])h+='<span class="pill p-corrected">已校正</span>';return h;}
const affectedSteps=()=>S.hypo?DATA.steps.filter(s=>s.from.includes(S.hypo)):[];
const retainedSteps=()=>{const a=affectedSteps();return a.length?DATA.steps.filter(s=>!s.from.includes(S.hypo)&&a.some(x=>x.to===s.to)):[];};

function renderMat(){
  $('#matList').innerHTML=DATA.materials.map(m=>`<div class="mi"><div class="t">${esc(m.t)}</div><div class="m">${esc(m.m)}</div></div>`).join('');
}
function rowSel(sel){return S.sel&&S.sel.id===sel.id&&S.sel.k===sel.k}
function renderTree(){
  const el=$('#tree');el.innerHTML='';
  DATA.concl.forEach(cid=>{
    el.appendChild(mkRow({k:'claim',id:cid},0,'concl'));
    DATA.steps.filter(s=>s.to===cid).forEach(s=>{
      const sr=mkRow({k:'step',id:s.id},1);
      if(S.hypo&&s.from.includes(S.hypo)){sr.classList.add('affected');
        sr.querySelector('.tx').insertAdjacentHTML('beforeend',' <span class="flag">· 这组前提的联合支持失效</span>');}
      else if(retainedSteps().includes(s)){sr.classList.add('retained');
        sr.querySelector('.tx').insertAdjacentHTML('beforeend',' <span class="flag">· 独立支持保留</span>');}
      el.appendChild(sr);
      s.from.forEach(pid=>{
        const r=mkRow({k:'claim',id:pid},2);
        if(S.hypo===pid){r.querySelector('.tx').innerHTML=esc(DATA.claims[pid].text)+' <span class="flag">（假设不成立）</span>';}
        el.appendChild(r);
      });
      if(S.hypo&&s.from.includes(S.hypo)){
        const ind=retainedSteps().length?'；同一结论另有 1 路独立支持保留':'';
        el.insertAdjacentHTML('beforeend',`<div class="tr lv2" style="cursor:default"><span class="combo">影响</span><span class="tx">这一步联合推导失去这组前提的支持，结论未被证伪${ind}</span></div>`);
      }
      S.paths.filter(p=>p.step===s.id).forEach(p=>{
        el.insertAdjacentHTML('beforeend',`<div class="tr lv2" style="cursor:default"><span class="pill p-local">本路径局部</span><span class="tx">${esc(p.text)}</span><span class="flag">· ${esc(p.path)}</span></div>`);
      });
    });
  });
  $$('#tree .tr[data-id]').forEach(r=>r.onclick=()=>{S.sel={k:r.dataset.k,id:r.dataset.id};S.clicked.add(r.dataset.id);render();});
}
function mkRow(sel,lv,cls){
  const d=document.createElement('div');
  d.className='tr lv'+lv+(cls?' '+cls:'')+(rowSel(sel)?' sel':'');
  d.dataset.id=sel.id;d.dataset.k=sel.k;
  let pre='';
  if(sel.k==='step'){const s=DATA.steps.find(x=>x.id===sel.id);
    pre=`<span class="combo">${s.combo==='共同依赖'?'[&amp;]':'[|]'} ${s.combo}</span><span class="pill p-${s.origin==='AI'?'ai':'origin'}">${s.origin}</span>`;}
  else{const c=DATA.claims[sel.id];pre=`<span class="pill p-${c.origin==='AI'?'ai':c.origin==='来源'?'origin':'user'}">${c.origin}</span>`;}
  const st=`<span class="pill s-${S.stance[sel.id]}">${S.stance[sel.id]}</span>`;
  const txt=sel.k==='step'?'这一步推导 → '+DATA.claims[DATA.steps.find(x=>x.id===sel.id).to].text:DATA.claims[sel.id].text;
  d.innerHTML=pre+`<span class="tx">${esc(txt)}</span>`+marks(sel.id)+st;
  return d;
}
function renderHead(){
  const sel=S.sel, isStep=sel.k==='step';
  const c=isStep?null:DATA.claims[sel.id];
  const step=isStep?DATA.steps.find(x=>x.id===sel.id):null;
  const usedStep=isStep?null:DATA.steps.find(s=>s.from.includes(sel.id));
  $('#phead').innerHTML=`
   <div class="kind">${isStep?'推导关系 · '+step.combo+' · 整步为一个标注单位':'主张 · '+(c.kind||'前提')}</div>
   <div class="txt">${esc(isStep?(step.from.map(f=>DATA.claims[f].text).join(' ＋ ')+' → '+DATA.claims[step.to].text):c.text)}</div>
   <div style="display:flex;gap:5px;flex-wrap:wrap;margin:6px 0">
     <span class="pill p-${(isStep?step.origin:c.origin)==='AI'?'ai':'origin'}">${isStep?step.origin:c.origin}</span>${marks(sel.id)}
   </div>
   <div class="acts">
     ${isStep?'':'<button onclick="rewrite()">改写</button>'}
     <button onclick="openSrc()">查看已保存摘录</button>
     ${!isStep&&c.origin==='来源'&&!S.edited[sel.id]?'<button onclick="correct()">校正整理结果</button>':''}
     ${isStep?'<button onclick="askAI()">检查这一步</button>':''}
     ${usedStep?'<button onclick="hypo()">试一个假设</button>':''}
   </div>`;
}
function render(){
  $('#hypoBanner').innerHTML=S.hypo?`<div class="banner"><b>假设预览：</b>「${esc(DATA.claims[S.hypo].text)}」不成立 · 影响 1 步联合推导 · 保留 1 路独立支持 · 退出后原判断不变<div class="r"><button onclick="savePath()">保存为我的路径</button><button onclick="exitHypo()">退出假设</button></div></div>`:'';
  renderTree();renderHead();renderPanel();
  $('#saveState').textContent=S.dirty?'保存中…':'已保存';
}
function renderPanel(){
  const sel=S.sel,id=sel.id,b=$('#pbody'),d=S.draft[id];
  const ev=DATA.evidence[id]||[],rv=S.revisions.filter(r=>r.id===id);
  b.innerHTML=`<div class="duo">
   <div><div class="h">依据 · 查证摘要（左）</div><div class="evscroll">${
     ev.length?ev.map(e=>`<div class="ev" onclick="openSrc(${JSON.stringify(e.s)})"><div class="h"><span class="tag t-${e.t}">${e.t}</span><span style="font-size:12px">${esc(e.s==='—'?'未取得资料':e.s)}</span></div><div class="qt">${esc(e.q)}</div><div class="src">锚点：${esc(e.a)}</div></div>`).join('')
     :'<div class="empty">暂无依据</div>'}</div></div>
   <div><div class="h">个人立场与判断（右）${d?' · 草稿未保存':''}</div>
     <div class="stances">${STANCES.map(s=>`<button class="${(d||S.stance[id])===s?'on':''}" onclick="pick('${s}')">${s}</button>`).join('')}</div>
     <div class="field"><label>理由${(d==='质疑'||d==='不认可')?'（必填）':'（认可选填）'}</label><textarea id="rsn" rows="3" placeholder="写一句具体疑问或依据">${esc(S.reason[id]||'')}</textarea></div>
     <div class="row"><button class="primary" onclick="saveStance()">保存立场</button><button class="ghost" onclick="cancelStance()">取消草稿</button></div>
     <p style="font-size:11.5px;color:var(--tx3)">选择只形成草稿，明确保存后才更新列表；保存立场不自动采用依据。</p>
   </div></div>
   <div class="fold"><div class="hd" onclick="var n=this.nextElementSibling;n.style.display=n.style.display==='none'?'block':'none'">修改记录（${rv.length}）· 点击展开</div>
   <div style="display:none">${rv.length?rv.map(r=>`<div class="hist"><div class="tm">${r.tm}</div><div class="ch">${esc(r.ch)}</div></div>`).join(''):'<div class="empty">尚无修改记录</div>'}
   ${S.paths.length?`<div style="font-size:12px;color:var(--tx2);margin-top:8px">我的路径：${S.paths.map(p=>esc(p.path)).join('、')}</div>`:''}</div></div>`;
}
function pick(s){S.draft[S.sel.id]=s;renderPanel();tick();}
function saveStance(){
  const id=S.sel.id,v=S.draft[id],r=$('#rsn')?$('#rsn').value.trim():'';
  if(!v){alert('先选择一个立场。');return;}
  if((v==='质疑'||v==='不认可')&&!r){alert('质疑或不认可必须填写一句具体理由。');return;}
  const prev=S.stance[id],prevR=S.reason[id]||'';
  S.stance[id]=v;S.reason[id]=r;delete S.draft[id];
  if(prev!==v||prevR!==r){S.revisions.unshift({id,tm:'2026-10-06 00:0'+(S.revisions.length+1),ch:'立场：'+prev+' → '+v+(r?'（理由：'+r+'）':'')+(prevR&&prevR!==r?'（原理由：'+prevR+'）':'')});}
  S.part[id]='个人研究项';
  S.dirty=false;render();tick();
}
function cancelStance(){delete S.draft[S.sel.id];renderPanel();}
function rewrite(){
  const id=S.sel.id;
  const v=prompt('改写这项主张的正文（普通改写不填修改理由，改前改后自动记录）：',DATA.claims[id]?DATA.claims[id].text:'');
  if(v===null||!v.trim())return;
  if(DATA.claims[id])DATA.claims[id].text=v.trim();
  S.edited[id]=true;S.part[id]='个人研究项';S.dirty=false;render();tick();
}
function openSrc(s){
  const ev=(DATA.evidence[S.sel.id]||[]).find(e=>e.s===s)||(DATA.evidence[S.sel.id]||[])[0];
  if(!ev){alert('当前对象没有已保存摘录。');return;}
  S.openedEv=true;
  const m=DATA.materials.find(x=>ev.s.startsWith(x.id));
  $('#srcT').textContent='已保存摘录 · '+ev.s;
  $('#srcB').innerHTML=`<div style="font-size:12px;color:var(--tx2);margin-bottom:8px">范围：摘录（完整原文未提供）· 获取时间 2025-09-10 · 引用锁定该版本</div>
   <div style="border:1px solid var(--bd);border-radius:8px;padding:12px;background:var(--s2);font-size:13px;line-height:1.8">${esc(ev.q)}</div>
   <div style="margin-top:10px;font-size:12px;color:var(--tx3)">锚点：${esc(ev.a)}　·　${m?esc(m.t):''}</div>
   <div class="row"><button class="ghost" onclick="alert('原始网页需本人主动在新标签打开；它是网站当前内容，不等于引用时的版本。')">打开原始网页</button><button class="primary" onclick="closeSrc()">返回论证列表</button></div>`;
  $('#srcMask').classList.add('on');tick();
}
function closeSrc(){$('#srcMask').classList.remove('on');}
function correct(){S.corrected[S.sel.id]=true;alert('仅校正未个人改写的来源对象：误读、字句与日期。不改原始材料与初始基线；正文校正后旧查证留在旧版本。校正记录与「我已编辑」分别保留。');render();}
function askAI(){alert('固定检查框架：前提完整性 / 推导依据 / 证据支持 / 反例。AI 只提问题，不改判断；未解问题可留待查。');}
function hypo(){
  const id=S.sel.id;
  if(!DATA.steps.some(s=>s.from.includes(id))){alert('这项前提尚未用于任何推导。');return;}
  S.hypo=id;render();tick();
}
function exitHypo(){S.hypo=null;render();tick();}
function savePath(){if(S.hypo)openRange();}
function openRange(){
  const steps=affectedSteps();
  $('#rngB').innerHTML=`<p style="font-size:12.5px;color:var(--tx2);margin:0 0 10px">「${esc(DATA.claims[S.hypo].text)}」被 <b>${steps.length}</b> 步推导共用。按 D66，没有明确范围不得静默写入全部引用——请勾选要生成本路径局部版本的推导。</p>
   ${steps.map((s,i)=>`<div class="cbl" data-i="${i}" onclick="this.classList.toggle('on')"><span class="combo">${s.id.toUpperCase()}</span><span style="font-size:12px">→ ${esc(DATA.claims[s.to].text)}</span><span class="pill ${partCls(S.part[s.id])}">${S.part[s.id]}</span></div>`).join('')}
   <p style="font-size:11.5px;color:var(--tx3);margin:8px 0 0">未勾选的推导继续保留原前提；新版本默认「待研究」（D32）。</p>
   <div class="row"><button class="primary" onclick="applyRange(false)">只改所选</button><button onclick="applyRange(true)">全部 ${steps.length} 步</button><button class="ghost" onclick="closeRange()">取消</button></div>`;
  $('#rngMask').classList.add('on');
}
function applyRange(all){
  const steps=affectedSteps();
  const sel=all?steps:[...document.querySelectorAll('#rngB .cbl.on')].map(e=>steps[+e.dataset.i]);
  if(!sel.length){alert('请至少勾选一步推导，或明确选择「全部」。');return;}
  const name='路径 A · 良率不及预期';
  sel.forEach(s=>S.paths.push({step:s.id,path:name,text:'（本路径局部）'+DATA.claims[S.hypo].text+' 不成立 · 新版本默认待研究'}));
  S.revisions.unshift({id:S.hypo,tm:'2026-10-06 00:0'+(S.revisions.length+1),ch:'实质改写：为 '+sel.map(s=>s.id.toUpperCase()).join('、')+' 生成「'+name+'」局部版本；其余推导保留原前提'});
  S.hypo=null;S.dirty=false;closeRange();render();tick();
}
function closeRange(){$('#rngMask').classList.remove('on');}
function openBase(){
  S.sawBase=true;
  $('#baseB').innerHTML=`<div class="cmp"><div><h4>作者原版（整理基线）</h4>
    <div style="font-size:12.5px;line-height:1.9">18A 按期量产 ＋ 良率达可比水平<br>[&amp;] 共同依赖 → Intel 18A 会拿到外部大客户订单<br>客户有动机扶持第二供应商 [|] 独立支持 → 同一结论</div></div>
    <div><h4>我的路径</h4>
    <div style="font-size:12.5px;line-height:1.9">${S.paths.length?S.paths.map(p=>esc(p.path)+'：<br>'+esc(p.text)).join('<br>'):'尚未保存个人条件路径'}</div>
    <div style="font-size:12.5px;margin-top:8px;color:var(--tx2)">整步推导 I1：${S.stance.i1}${S.reason.i1?'（'+esc(S.reason.i1)+'）':''}</div></div></div>
    <p style="font-size:11.5px;color:var(--tx3);margin-top:12px">基线在自动整理时保留，不随后续整理或作者更新自动替换；逐项溯源保留内容起点。</p>`;
  $('#baseMask').classList.add('on');tick();
}
function closeBase(){$('#baseMask').classList.remove('on');}
$('#btnBase').onclick=openBase;

const TOUR=[
 {t:'1 / 6 · 先找到作者的结论',p:'系统在三份材料里整理出两条结论和它们依赖的前提。先选中第一条结论，看它下面挂着什么。',a:'点击列表第一行「Intel 18A 会拿到外部大客户订单」',
  tgt:()=>'#tree .tr[data-id="c1"]',ok:()=>S.clicked.has('c1')},
 {t:'2 / 6 · 回查原文锚点',p:'选中「18A 按期量产」这一步前提。右侧列出支持依据、相反依据和缺口——三者并存，不压成通过或失败。点开任意一条看已保存摘录。',a:'点击 P1 行，再点右侧一条依据',
  tgt:()=>'#tree .tr[data-id="p1"]',ok:()=>S.sel.id==='p1'&&S.openedEv},
 {t:'3 / 6 · 对整步推导表态',p:'选中 [&] 共同依赖那一步。右侧同窗：左边依据、右边判断。选「质疑」只形成草稿，列表不会变；点「保存立场」后才更新，同时该对象从「参考内容」变成「个人研究项」。质疑必须写理由。',a:'点 [&] 那一行 → 选「质疑」→ 填理由 → 保存立场',
  tgt:()=>'#tree .tr[data-id="i1"]',ok:()=>S.stance.i1==='质疑'&&!!S.reason.i1},
 {t:'4 / 6 · 试一个假设',p:'选中「良率达到可比水平」，暂时假设它不成立。受影响标记在<b>整步推导</b>上（这一步失去这组前提的联合支持），保留标记在<b>独立支持同一结论的那一步</b>上；前提本身不标红。预览不改任何判断。',a:'点「试一个假设」',
  tgt:()=>'#tree .tr[data-id="p2"]',ok:()=>S.hypo==='p2'},
 {t:'5 / 6 · 选作用范围，保存为我的路径',p:'这项前提被 I1、I3 两步共用。按 D66 不得静默写入全部引用——先勾选要改的推导（或明确点「全部 2 步」），再生成局部版本。',a:'点横幅「保存为我的路径」→ 勾选 I1 → 只改所选',
  tgt:()=>'#hypoBanner',ok:()=>S.paths.length>0},
 {t:'6 / 6 · 与作者原版逐项对照',p:'顶栏「对照整理原版」并排显示基线与你改过的路径，并保留整步推导的立场与理由。这是首个案例完成标准的第 4 项。',a:'点顶栏「对照整理原版」',
  tgt:()=>'#btnBase',ok:()=>S.sawBase}
];
let ti=0;
function showTour(){
  const s=TOUR[ti],ring=$('#ring'),card=$('#tour');
  $('#tSt').textContent=s.t;$('#tT').textContent='';$('#tP').textContent=s.p;
  const ok=s.ok();
  $('#tA').innerHTML=`<div class="${ok?'act':'warn'}">${ok?'已完成这一步 · 点「下一步」继续':'要做的：'+s.a}</div>`;
  $('#tNext').disabled=!ok;$('#tNext').textContent=ti===TOUR.length-1?'完成':(ok?'下一步':'待完成');
  $('#tPrev').style.visibility=ti?'visible':'hidden';
  const el=$(s.tgt());
  if(el){el.scrollIntoView({block:'center',behavior:'smooth'});
    setTimeout(()=>{const r=el.getBoundingClientRect();
      ring.style.left=(r.left-6)+'px';ring.style.top=(r.top-6)+'px';ring.style.width=(r.width+12)+'px';ring.style.height=(r.height+12)+'px';
      const top=Math.min(r.bottom+14,window.innerHeight-card.offsetHeight-16);
      card.style.top=Math.max(12,top)+'px';card.style.left=Math.min(r.left,window.innerWidth-350)+'px';},40);}
  ring.classList.add('on');card.classList.add('on');
}
function tick(){if($('#tour').classList.contains('on'))showTour();}
$('#btnTour').onclick=()=>{ti=0;showTour();};
$('#tNext').onclick=()=>{if(ti<TOUR.length-1){ti++;showTour();}else{$('#ring').classList.remove('on');$('#tour').classList.remove('on');alert('引导结束。这是设计 A：列表为主、画布为副视图。右上角可切换到 B 审阅台或 C 画布语义层，走同一条任务序列。');}};
$('#tPrev').onclick=()=>{if(ti>0){ti--;showTour();}};
$('#tSkip').onclick=()=>{$('#ring').classList.remove('on');$('#tour').classList.remove('on');};
window.addEventListener('resize',()=>tick());
renderMat();render();
setTimeout(()=>{$('#btnTour').click();},300);
</script>
</body>
</html>
