<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="738" viewBox="0 0 1100 738">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#287571" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1100" height="738" fill="#f4f7f6"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#273d3a">
    <text x="42" y="49" font-size="27" font-weight="600">保存最新立场，按需回看变化</text>
    <text x="42" y="79" font-size="15" fill="#687e78">操作示意 · 模拟内容 · 适用于主张卡与线上推导</text>

    <text x="42" y="126" font-size="18" font-weight="600">画布上：只显示当前立场</text>
    <rect x="42" y="146" width="320" height="208" rx="15" fill="#fff" stroke="#c9d8d3"/>
    <text x="62" y="177" font-size="14" fill="#73877f">内容起点</text>
    <rect x="136" y="159" width="48" height="25" rx="6" fill="#edf2f0"/>
    <text x="146" y="177" font-size="13">来源</text>
    <text x="62" y="225" font-size="21" font-weight="600">A 公司将获得新增订单</text>
    <text x="62" y="271" font-size="16" fill="#687e78">我的立场</text>
    <rect x="153" y="247" width="70" height="34" rx="8" fill="#e6f3e9" stroke="#add2b7"/>
    <text x="172" y="270" font-size="16" fill="#296847">认可</text>
    <line x1="62" y1="298" x2="342" y2="298" stroke="#e0e8e4"/>
    <text x="62" y="331" font-size="15" fill="#687e78">来源 2</text>
    <text x="278" y="331" font-size="15" fill="#287571">操作</text>
    <path d="M232 265 H395 V239 H436" fill="none" stroke="#287571" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="284" y="218" font-size="15" fill="#287571">点击立场标签</text>

    <rect x="448" y="113" width="610" height="562" rx="16" fill="#fff" stroke="#c9d8d3"/>
    <path d="M464 113 H1042 Q1058 113 1058 129 V168 H448 V129 Q448 113 464 113" fill="#edf3f1"/>
    <text x="472" y="148" font-size="21" font-weight="600">查证与立场</text>
    <text x="1021" y="148" font-size="24" fill="#647d73">×</text>
    <text x="472" y="196" font-size="13" fill="#73877f">这里只示意窗口中的立场区；查证仍在同一窗口查看</text>
    <text x="472" y="233" font-size="20" font-weight="600">我怎么看</text>
    <rect x="904" y="210" width="126" height="31" rx="7" fill="#e6f3e9"/>
    <text x="918" y="231" font-size="14" fill="#296847">已保存：认可</text>
    <text x="472" y="273" font-size="16">理由：找到正式订单披露（示例）</text>
    <line x1="472" y1="296" x2="1030" y2="296" stroke="#e1e9e5"/>
    <rect x="472" y="315" width="558" height="44" rx="8" fill="#f1f5f3"/>
    <path d="M487 331 L493 337 L499 331" fill="none" stroke="#467369" stroke-width="2"/>
    <text x="511" y="343" font-size="17" font-weight="600">立场变化（2）</text>
    <text x="849" y="343" font-size="13" fill="#73877f">默认收起 · 图中已展开</text>
    <line x1="493" y1="386" x2="493" y2="587" stroke="#d1ded7" stroke-width="2"/>

    <circle cx="493" cy="389" r="6" fill="#438960"/>
    <text x="512" y="395" font-size="15" font-weight="600">第二次保存 · 示例 10:20</text>
    <rect x="818" y="375" width="73" height="27" rx="6" fill="#fdf1da"/><text x="839" y="394" font-size="14" fill="#91611a">质疑</text>
    <text x="901" y="395" font-size="18" fill="#73877f">→</text>
    <rect x="931" y="375" width="73" height="27" rx="6" fill="#e6f3e9"/><text x="952" y="394" font-size="14" fill="#296847">认可</text>
    <text x="512" y="428" font-size="15" fill="#637a70">理由：找到正式订单披露（示例）</text>
    <text x="512" y="454" font-size="13" fill="#8a9b92">针对当时的卡片内容；可回看对应版本</text>

    <circle cx="493" cy="491" r="6" fill="#bc8b32"/>
    <text x="512" y="497" font-size="15" font-weight="600">第一次保存 · 示例 09:10</text>
    <rect x="818" y="477" width="73" height="27" rx="6" fill="#edf0f2"/><text x="834" y="496" font-size="13" fill="#6a7881">待研究</text>
    <text x="901" y="497" font-size="18" fill="#73877f">→</text>
    <rect x="931" y="477" width="73" height="27" rx="6" fill="#fdf1da"/><text x="952" y="496" font-size="14" fill="#91611a">质疑</text>
    <text x="512" y="530" font-size="15" fill="#637a70">理由：尚未找到正式订单承诺（示例）</text>
    <text x="512" y="556" font-size="13" fill="#8a9b92">保留当时的判断，不用当前理由覆盖</text>
    <circle cx="493" cy="585" r="5" fill="#a4b2b9"/>
    <text x="512" y="591" font-size="14" fill="#8a9b92">初始状态：待研究</text>
    <rect x="472" y="616" width="558" height="35" rx="7" fill="#f7f8f7"/>
    <text x="490" y="639" font-size="14" fill="#637a70">这里只回看这张卡，不自动生成整张研究画布的历史快照。</text>

    <text x="42" y="413" font-size="18" font-weight="600">什么情况才增加记录？</text>
    <circle cx="51" cy="448" r="4" fill="#287571"/><text x="67" y="454" font-size="16">立场改变 → 记一次</text>
    <circle cx="51" cy="481" r="4" fill="#287571"/><text x="67" y="487" font-size="16">立场相同，理由改变 → 也记一次</text>
    <circle cx="51" cy="514" r="4" fill="#a2b0a9"/><text x="67" y="520" font-size="16">立场和理由都没变 → 不新增</text>
    <circle cx="51" cy="547" r="4" fill="#a2b0a9"/><text x="67" y="553" font-size="16">只填写、尚未保存 → 仍是草稿</text>
    <rect x="42" y="582" width="352" height="66" rx="10" fill="#e8eeeb"/>
    <text x="58" y="609" font-size="15" fill="#46695b">AI 查证建议单独保留。</text>
    <text x="58" y="634" font-size="15" fill="#46695b">重新查证不会替你改变个人立场。</text>
    <text x="42" y="708" font-size="14" fill="#7f9288">变化记录保存时间、前后立场、当时理由与内容版本；更早的记录按需展开。</text>
  </g>
</svg>
