<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="660" viewBox="0 0 1140 660" role="img" aria-labelledby="title desc"><title id="title">见岔：个人立场标签与保存流程</title><desc id="desc">点击卡片立场标签，选择立场，按需填写理由，点击保存立场，回到同一张卡片查看更新后的标签。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#276e68"/></marker></defs><rect width="1140" height="660" fill="#f7f9fb"/><g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#263b49"><text x="30" y="43" font-size="30" fill="#263b49" font-weight="600">个人立场：看标签，改判断，明确保存</text><rect x="30" y="64" width="106" height="34" rx="7" fill="#edf1f5" stroke="#cbd5e1"/><text x="42" y="88" font-size="20" fill="#596777">待研究</text><rect x="159" y="64" width="106" height="34" rx="7" fill="#e9f6ef" stroke="#acd4bc"/><text x="171" y="88" font-size="20" fill="#1b6a4a">认可</text><rect x="288" y="64" width="106" height="34" rx="7" fill="#fff4d8" stroke="#e8c476"/><text x="300" y="88" font-size="20" fill="#8a5a00">质疑</text><rect x="417" y="64" width="106" height="34" rx="7" fill="#fdecef" stroke="#e6b5bd"/><text x="429" y="88" font-size="20" fill="#9e303b">不认可</text><text x="558" y="89" font-size="19" fill="#667786">主张卡与线上推导都使用这四种标签</text><text x="30" y="139" font-size="21" fill="#263b49" font-weight="600">① 点击卡片上的立场标签</text><text x="390" y="139" font-size="21" fill="#263b49" font-weight="600">② 选立场，再按需填理由</text><text x="840" y="139" font-size="21" fill="#263b49" font-weight="600">④ 回到原卡片查看</text><rect x="30" y="158" width="270" height="225" rx="12" fill="#ffffff" stroke="#cbd5df"/><text x="50" y="193" font-size="15" fill="#667786">内容起点</text><rect x="128" y="173" width="48" height="27" rx="5" fill="#eef2f1" stroke="#eef2f1"/><text x="135" y="193" font-size="15" fill="#465b58">来源</text><text x="50" y="234" font-size="22" fill="#263b49" font-weight="600">18A 按期进入量产</text><text x="50" y="284" font-size="18" fill="#667786">我的立场</text><rect x="141" y="260" width="88" height="34" rx="7" fill="#edf1f5" stroke="#cbd5e1"/><text x="153" y="284" font-size="20" fill="#596777">待研究</text><text x="50" y="335" font-size="16" fill="#667786">来源 2</text><text x="231" y="335" font-size="16" fill="#667786">操作</text><rect x="840" y="158" width="270" height="225" rx="12" fill="#ffffff" stroke="#cbd5df"/><text x="860" y="193" font-size="15" fill="#667786">内容起点</text><rect x="938" y="173" width="48" height="27" rx="5" fill="#eef2f1" stroke="#eef2f1"/><text x="945" y="193" font-size="15" fill="#465b58">来源</text><text x="860" y="234" font-size="22" fill="#263b49" font-weight="600">18A 按期进入量产</text><text x="860" y="284" font-size="18" fill="#667786">我的立场</text><rect x="951" y="260" width="88" height="34" rx="7" fill="#fff4d8" stroke="#e8c476"/><text x="963" y="284" font-size="20" fill="#8a5a00">质疑</text><text x="860" y="335" font-size="16" fill="#667786">来源 2</text><text x="1041" y="335" font-size="16" fill="#667786">操作</text><text x="50" y="410" font-size="18" fill="#667786">也可选中卡片 → 点“立场”</text><text x="857" y="410" font-size="18" fill="#667786">再点标签，可回看保存的理由</text><rect x="390" y="158" width="360" height="374" rx="12" fill="#ffffff" stroke="#cbd5df"/><text x="410" y="195" font-size="23" fill="#263b49" font-weight="600">我的立场</text><text x="410" y="225" font-size="16" fill="#667786">画布当前：待研究</text><rect x="410" y="247" width="155" height="38" rx="7" fill="#ffffff" stroke="#d5dde3"/><text x="434" y="273" font-size="19" fill="#596777">待研究</text><rect x="575" y="247" width="155" height="38" rx="7" fill="#ffffff" stroke="#d5dde3"/><text x="599" y="273" font-size="19" fill="#1b6a4a">认可</text><rect x="410" y="294" width="155" height="38" rx="7" fill="#fff4d8" stroke="#8a5a00"/><text x="434" y="320" font-size="19" fill="#8a5a00">✓ 质疑</text><rect x="575" y="294" width="155" height="38" rx="7" fill="#ffffff" stroke="#d5dde3"/><text x="599" y="320" font-size="19" fill="#9e303b">不认可</text><text x="410" y="363" font-size="18" fill="#667786">我具体质疑什么（必填）</text><rect x="410" y="378" width="320" height="66" rx="6" fill="#ffffff" stroke="#bdcbc5"/><text x="423" y="405" font-size="18" fill="#263b49">尚无正式披露确认</text><text x="423" y="429" font-size="18" fill="#263b49">这个量产时间。</text><text x="410" y="469" font-size="16" fill="#667786">草稿不会立即改变画布</text><rect x="557" y="480" width="173" height="36" rx="7" fill="#276e68" stroke="#276e68"/><text x="575" y="505" font-size="20" fill="#ffffff" font-weight="600">③ 保存立场</text><path d="M300 279H376" stroke="#276e68" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M762 279H825" stroke="#276e68" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="30" y="573" font-size="21" fill="#263b49" font-weight="600">理由何时填写？</text><text x="30" y="608" font-size="21" fill="#263b49">待研究：无需理由　　认可：依据选填　　质疑 / 不认可：具体理由必填</text><text x="30" y="643" font-size="18" fill="#667786">关闭保留草稿；取消放弃这次填写。保存仅更新当前对象。</text></g></svg>