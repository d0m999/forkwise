openapi: 3.0.0
info:
  title: 见岔（Forkwise）本机研究 API
  version: 0.1.0
security:
  - LocalSession: []
components:
  securitySchemes:
    LocalSession:
      type: http
      scheme: bearer
      description: 本机签发的个人或项目范围 Agent 会话
  schemas:
    Project:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 96
          pattern: ^[A-Za-z0-9_-]+$
        name:
          type: string
        question:
          type: string
        revision:
          type: integer
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          nullable: true
          format: date-time
      required:
        - id
        - name
        - question
        - revision
        - createdAt
        - deletedAt
    Error:
      type: object
      properties:
        code:
          type: string
        data:
          nullable: true
        message:
          type: string
      required:
        - code
        - message
    ResearchState:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/Project"
        objects:
          type: array
          items:
            $ref: "#/components/schemas/ResearchObject"
      required:
        - project
        - objects
    ResearchObject:
      anyOf:
        - type: object
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 96
              pattern: ^[A-Za-z0-9_-]+$
            projectId:
              type: string
              minLength: 1
              maxLength: 96
              pattern: ^[A-Za-z0-9_-]+$
            kind:
              type: string
              enum:
                - statement
            version:
              type: integer
              minimum: 0
              exclusiveMinimum: true
            versionId:
              type: string
              minLength: 1
              maxLength: 96
              pattern: ^[A-Za-z0-9_-]+$
            contentVersionId:
              type: string
              minLength: 1
              maxLength: 96
              pattern: ^[A-Za-z0-9_-]+$
            data:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 100000
                origin:
                  type: string
                  enum:
                    - user
                    - author
                    - ai
                participation:
                  type: string
                  enum:
                    - reference
                    - candidate
                    - personal
                stance:
                  type: object
                  properties:
                    value:
                      type: string
                      enum:
                        - pending
                        - accepted
                        - questioned
                        - rejected
                    reason:
                      type: string
                      maxLength: 20000
                      default: ""
