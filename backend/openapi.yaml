                            maxLength: 96
                            pattern: ^[A-Za-z0-9_-]+$
                          fileId:
                            type: string
                            minLength: 1
                            maxLength: 96
                            pattern: ^[A-Za-z0-9_-]+$
                          page:
                            type: number
                            enum:
                              - 1
                          imageWidth:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                          imageHeight:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                          region:
                            type: object
                            properties:
                              x:
                                type: number
                                minimum: 0
                                maximum: 1
                              y:
                                type: number
                                minimum: 0
                                maximum: 1
                              width:
                                type: number
                                minimum: 0
                                exclusiveMinimum: true
                                maximum: 1
                              height:
                                type: number
